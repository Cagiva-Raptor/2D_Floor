        Authorization: `Bearer ${inst.token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(kader),
    }), 10000);
    return r.ok;
  } catch (_) {
    return false;
  }
}

/* Bij het slepen komt er een reeks wijzigingen achter elkaar; één keer opslaan
   aan het eind is genoeg. En als het niet lukt, zeggen we dat één keer — een
   stil mislukte opslag is precies waar we van af wilden. */
function zonesNaarHABinnenkort() {
  clearTimeout(zonesSchrijfTimer);
  zonesSchrijfTimer = setTimeout(async () => {
    const gelukt = await zonesNaarHA(STAAT.zoneKader);
    if (gelukt) {
      zonesBronZet(`${zoneVormenTelling(STAAT.zoneKader)} in Home Assistant`);
      return;
    }
    zonesBronZet(`${zoneVormenTelling(STAAT.zoneKader)} lokaal — schrijven naar HA lukte niet`);
    if (!zonesSchrijfFoutGemeld) {
      zonesSchrijfFoutGemeld = true;
      meld("De zonevormen zijn lokaal bewaard, maar naar Home Assistant schrijven lukte " +
        "niet. Na een herstart van Home Assistant werkt het endpoint; tot die tijd " +
        "blijft alles lokaal staan.", "fout");
    }
  }, 800);
}

/* Bij het openen: halen wat er op de server staat. Staat daar nog niets maar is
   er hier wel iets, dan verhuist het één keer naar boven — zodat bestaand werk
   niet verdwijnt maar juist bij de plattegrond komt te staan. */
async function zonesUitHA() {
  const uit = await zonesVanHA();
  if (uit.reden) {
    zonesBronZet(`${zoneVormenTelling(STAAT.zoneKader)} lokaal (${uit.reden})`);
    return;
  }
  const vanHA = uit.zones;
  if (vanHA && Object.keys(vanHA).length) {
    zonesBronZet(`${zoneVormenTelling(vanHA)} in Home Assistant`);
    if (JSON.stringify(vanHA) !== JSON.stringify(STAAT.zoneKader)) {
      STAAT.zoneKader = vanHA;
      zoneVormenOpschoon();
      zoneKadersBewaarLokaal();          // meteen de cache bijwerken
      tekenAlles();
      meld(`${zoneVormenTelling(STAAT.zoneKader)} zonevormen opgehaald uit Home Assistant ` +
        "— die gelden nu op elke computer.", "serieus");
    }
    return;
  }
  zonesBronZet(`${zoneVormenTelling(STAAT.zoneKader)} klaar om naar Home Assistant te gaan`);
  if (!zoneVormenTelling(STAAT.zoneKader)) return;
  const gelukt = await zonesNaarHA(STAAT.zoneKader);
  zonesBronZet(gelukt
    ? `${zoneVormenTelling(STAAT.zoneKader)} in Home Assistant`
    : `${zoneVormenTelling(STAAT.zoneKader)} lokaal — schrijven naar HA lukte niet`);
  meld(gelukt
    ? `${zoneVormenTelling(STAAT.zoneKader)} zonevormen naar Home Assistant verhuisd — ` +
      "vanaf nu staan ze bij de plattegrond, dus op elke computer hetzelfde."
    : "De zonevormen staan nog lokaal: naar Home Assistant schrijven lukte niet. " +
      "Na een herstart van Home Assistant werkt het endpoint.", gelukt ? "serieus" : "fout");
}

/* Hetzelfde voor de verdiep-koppeling en de afbeeldingen per variant: die
   horen bij de plattegrond, niet bij de browser waarin u toevallig werkt.
   Uw adres en token blijven wél lokaal — die gaan hier nooit in mee. */
let verdiepSchrijfTimer = null;
let verdiepSchrijfFoutGemeld = false;

function settingsEindpunt() {
  const inst = haInstelling();
  if (!inst.url || !inst.token) return null;
  return `${inst.url.replace(/\/+$/, "")}/api/floorplan_layout/settings`;
}

async function verdiepVanHA() {
  const url = settingsEindpunt();
  if (!url) return { reden: "geen ⚙-instellingen" };
  const inst = haInstelling();
  try {
    const r = await metTijdslimiet(fetch(url, {
      headers: { Authorization: `Bearer ${inst.token}` },
    }), 10000);
    if (!r.ok) return { reden: `HTTP ${r.status}` };
    const data = await r.json().catch(() => null);
    return { settings: (data && data.settings) || null };
  } catch (e) {
    return { reden: (e && e.message) || String(e) };
  }
}

async function verdiepNaarHA(alles) {
  const url = settingsEindpunt();
  if (!url) return false;
  const inst = haInstelling();
  try {
    const r = await metTijdslimiet(fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${inst.token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(alles),
    }), 10000);
    return r.ok;
  } catch (_) {
    return false;
  }
}

function verdiepNaarHABinnenkort() {
  clearTimeout(verdiepSchrijfTimer);
  verdiepSchrijfTimer = setTimeout(async () => {
    const gelukt = await verdiepNaarHA(verdiepInstellingen());
    if (gelukt || verdiepSchrijfFoutGemeld) return;
    verdiepSchrijfFoutGemeld = true;
    meld("De verdiep-instellingen zijn lokaal bewaard, maar naar Home Assistant " +
      "schrijven lukte niet. Na een herstart van Home Assistant werkt het endpoint; " +
      "tot die tijd staan ze alleen op deze computer.", "fout");
  }, 800);
}

async function verdiepUitHA() {
  const uit = await verdiepVanHA();
  if (uit.reden) return;                       // lokaal verder werken
  const vanHA = uit.settings;
  if (vanHA && Object.keys(vanHA).length) {
    if (JSON.stringify(vanHA) !== JSON.stringify(verdiepInstellingen())) {
      verdiepCache = vanHA;
      try { localStorage.setItem(VERDIEP_SLEUTEL, JSON.stringify(vanHA)); } catch (_) { /* geen opslag */ }
      bouwZonekiezer();
      tekenZoeklijst();
      meld(`${Object.keys(vanHA).length} verdiep-instellingen opgehaald uit Home Assistant ` +
        "— de koppeling en de afbeeldingen staan nu op elke computer hetzelfde.", "serieus");
    }
    return;
  }
  const alles = verdiepInstellingen();
  if (!Object.keys(alles).length) return;
  const gelukt = await verdiepNaarHA(alles);
  meld(gelukt
    ? `${Object.keys(alles).length} verdiep-instellingen naar Home Assistant verhuisd — ` +
      "vanaf nu staan ze bij de plattegrond in plaats van in deze browser."
    : "De verdiep-instellingen staan nog lokaal: naar Home Assistant schrijven lukte niet.",
    gelukt ? "serieus" : "fout");
}

/* Instellingen en zonevormen van verdiepingen die niet meer bestaan: weg ermee.
   Alleen bij het laden — zo blijft ↶ binnen de sessie gewoon alles terugbrengen,
   en begint een later toegevoegde verdieping met dezelfde titel schoon in plaats
   van de koppeling en vormen van de oude te erven. */
function ruimVerlatenVerdiepingenOp() {
  const views = (STAAT.doc && STAAT.doc.views) || [];
  // Er zijn twee sleutelruimtes met twee sleutelfuncties: zonevormen hangen aan
  // `zoneSleutel` (pad vóór titel) en de verdiep-instellingen aan `verdiepSleutel`
  // (titel vóór pad). Beide gelden als "deze verdieping bestaat". Neem je er maar
  // één, dan gooit de opruimer zonevormen weg die gewoon bij een bestaand
  // verdiep horen — en dat is precies wat er met "Badkamer 1" op de eerste
  // verdiep gebeurde: die hing aan "1e-verdiep" en werd niet herkend.
  const sleutels = new Set();
  for (const v of views) {
    sleutels.add(zoneSleutel(v));
    sleutels.add(verdiepSleutel(v));
    if (v && v.path) sleutels.add(v.path);
    if (v && v.title) sleutels.add(v.title);
  }
  let weg = 0;
  const inst = verdiepInstellingen();
  for (const k of Object.keys(inst)) if (!sleutels.has(k)) { delete inst[k]; weg++; }
  if (weg) bewaarVerdiepInstellingen(inst);
  let wegZones = 0;
  for (const k of Object.keys(STAAT.zoneKader || {})) if (!sleutels.has(k)) {
    delete STAAT.zoneKader[k];
    wegZones++;
  }
  if (wegZones) zoneKadersBewaar();
  if (weg + wegZones) {
    meld(`${weg + wegZones} rest(en) van een geschrapt verdieping opgeruimd ` +
      "(instellingen en zonevormen).");
  }
}

/* Binnen de plattegrond houden. Eén hoekpunt tegelijk: een contour die
   grotendeels buiten de tekening ligt is niet meer te vinden. */
function klemPunt(p) {
  return [
    Math.min(100, Math.max(0, Number.isFinite(+p[0]) ? +p[0] : 0)),
    Math.min(100, Math.max(0, Number.isFinite(+p[1]) ? +p[1] : 0)),
  ];
}

/* De contour van een zone: uw eigen vorm als die er is, anders de rechthoek
   die uit de items erin volgt. Dit is wat er getekend wordt. */
function puntenVanZone(zone) {
  const eigen = puntenUitKader(zoneVormen()[zone]);
  if (eigen) return eigen.map(klemPunt);
  const v = vlakVanZone(zone);
  return v ? rechthoekPunten(v) : null;
}

/* Het kader dat verschijnt zodra u een zone kiest die nog nergens voor gedefinieerd
   is: gecentreerd en ruimer dan het minimum (34×30), zodat er meteen iets is om
   vast te pakken. Het is geen bedrog: alleen geklikt → verdwijnt het weer; verplaatst
   of hertekend → dan wordt het opgeslagen. */
const STANDAARD_ZONE_VLAK = { l: 50, t: 50, b: 40, h: 34 };

function vlakVanZone(zone) {
  // Uw eigen vorm wint van de afgeleide omtrek — inclusief de ondergrens van
  // 34×30 en het verplichte midden: de contour die u heeft neergezet is
  // precies wat u krijgt, anders verdwijnt het resultaat van het slepen
  // meteen weer in de automatiek. Alleen het zoomvlak wordt begrensd.
  const eigen = puntenUitKader(zoneVormen()[zone]);
  if (eigen) {
    const xs = eigen.map(p => p[0]);
    const ys = eigen.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    return {
      l: (x0 + x1) / 2,
      t: (y0 + y1) / 2,
      b: Math.max(ZONE_KADER_MIN, x1 - x0),
      h: Math.max(ZONE_KADER_MIN, y1 - y0),
    };
  }
  const stukken = [];
  const loop = lijst => {
    for (const e of lijst || []) {
      if (e.type === "conditional") { loop(e.elements); continue; }
      if (e.__zone !== zone) continue;
      const st = e.style || {};
      const b = parseFloat(st.width || "0");
      const l = parseFloat(st.left ?? "50");
      const t = parseFloat(st.top ?? "50");
      if (!isFinite(l) || !isFinite(t) || b >= 99) continue;
      stukken.push({ l, t, b: b || 4 });
    }
  };
  loop(STAAT.kaart ? STAAT.kaart.elements : []);
  const vlak = omhullende(stukken);
  if (!vlak) {
    // Niets bekend over deze zone: geen eigen vorm én geen elementen die erbij
    // horen. Alleen voor de gékozen zone tonen we het standaardkader — anders
    // zou de kaart vol lege vakken staan. Zonder dit is er niets om vast te
    // pakken en kunt u nooit beginnen met tekenen.
    return zone === STAAT.zone ? STANDAARD_ZONE_VLAK : null;
  }
  const b = Math.max(parseFloat(vlak.b), ZONE_VLAK_MIN.b);
  const h = Math.max(parseFloat(vlak.h), ZONE_VLAK_MIN.h);
  // Het minimumvlak wordt groter dan wat de zone zelf inneemt, dus het middelpunt
  // kan eruit schuiven. Een zone tegen de rand (Hal vooraan op 10%) zou dan
  // deels buiten de plattegrond vallen en is bij elke zoom half afgesneden. Daarom
  // het middelpunt meeschuiven tot het vlak binnen de plattegrond past.
  const binnen = (positie, maat) => Math.min(Math.max(positie, maat / 2), 100 - maat / 2);
  return {
    l: binnen(parseFloat(vlak.l), b).toFixed(2),
    t: binnen(parseFloat(vlak.t), h).toFixed(2),
    b: b.toFixed(2),
    h: h.toFixed(2),
  };
}

/* ---------- de zone-laag ----------

   Uw vraag was: buiten in de eigen achtergrondfoto is er geen verschil tussen
   de zones te zien. Dat klopt, en de oorzaak is dubbel:

   1. Er was geen laag. Een zone was alleen een filter, een zoomdoel en een
      naam in de inspectie. Er stond nooit iets getekend.
   2. Zelfs met een laag zou het tegenvallen. De elf lichtkaarten zijn
      1500x720 met 53 tot 94 procent volledig transparant, en een flink deel van
      wat overblijft is halfdekkend: `sfeerlicht_haard.png` heeft 0 procent
      helder, 53,3 procent leeg en dus 46,7 procent nevel. Eén zo'n kaart legt
      al een waas over bijna de helft van de plattegrond. Elf boven elkaar is
      waarom de kamers in elkaar overgaan.

   Daarom staat deze laag boven alles (z-index 9600, boven de 9500 van een
   gesleept element) en heeft ze een donkere rand-schaduw, zodat een kadeer
   over zowel een lichte als een donkere ondergrond leesbaar blijft. De laag
   neemt geen klik aan: `pointer-events: none`. */

/* Twee labels op vrijwel hetzelfde punt — twee kamers die elkaar raken — en je
   leest geen van beide namen meer. Wie het eerst staat houdt zijn plek; een
   etiket dat erop zou vallen schuift een stukje naar beneden, zijn eigen kamer
   in. Dit is het vangnet onder de regel hierboven: die kiest de richting, dit
   lost het op als er tóch iets op elkaar valt. */
function etiketVrijzetten(etiket) {
  const houder = el("zonelagen");
  if (!houder) return;
  const vak = houder.getBoundingClientRect();
  if (!vak.width || !vak.height) return;
  const kaderVan = e => {
    const r = e.getBoundingClientRect();
    return {
      l: r.left - vak.left, t: r.top - vak.top,
      r: r.right - vak.left, b: r.bottom - vak.top,
    };
  };
  const anderen = [...houder.querySelectorAll(".zone-etiket")].filter(e => e !== etiket);
  if (!anderen.length) return;
  for (let poging = 0; poging < 6; poging++) {
    const mijn = kaderVan(etiket);
    const bots = anderen.map(kaderVan).find(g =>
      !(mijn.r <= g.l || mijn.l >= g.r || mijn.b <= g.t || mijn.t >= g.b));
    if (!bots) return;
    etiket.style.top = ((parseFloat(etiket.style.top) || 0) + 3.2) + "%";
  }
}

function tekenZoneLagen() {
  const houder = el("zonelagen");
  if (!houder) return;
  houder.textContent = "";
  const s = STAAT.zoneLaag;
  houder.style.setProperty("--zone-dikte", `${s.dikte}px`);
  houder.style.setProperty("--zone-kleur", s.kleur);
  // Alleen in de bewerkstand vangen de contouren klikken; daarbuiten blijven ze
  // onzichtbaar voor de muis zoals ze altijd waren.
  houder.classList.toggle("bewerken", s.aan && !!STAAT.weergave.zoneBewerken);
  if (!s.aan) { el("label-zones").textContent = "zonekaders uit"; return; }

  // Zonder maat is elke coördinaat een gok: de achtergrondfoto is dan nog niet
  // geladen en het vlak is nul hoog. Tekenen we wél, dan staan alle contouren
  // op een paar tienden procent — en dat valt pas op als er iemand iets
  // aanklikt. `pasVlakAan` tekent opnieuw zodra de foto binnen is.
  if (houder.clientWidth < 10 || houder.clientHeight < 10) return;

  // De tekenvlakte is de laag zélf, in pixels; de vorm wordt in procent
  // bewaard en hier pas omgerekend. Zo blijven de getallen hetzelfde bij
  // zoomen en op een ander scherm.
  const breed = houder.clientWidth || 1;
  const hoog = houder.clientHeight || 1;
  const X = x => (x / 100) * breed;
  const Y = y => (y / 100) * hoog;

  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "zonesvg");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "100%");
  houder.appendChild(svg);

  let geteld = 0;
  // Is van deze verdieping bekend welke zones erbij horen? Dat kan pas als de
  // gebieden van Home Assistant binnen zijn. Zolang dat niet zo is, tekenen we
  // alleen wat er écht voor dít verdiep is opgeslagen. Anders verschijnt de
  // woonkamer van het gelijkvloers hier als leeg standaardkader — precies in dat
  // korte ogenblik na een verversing, voordat de gebieden binnen zijn.
  const tekenLijst = (zoneVerdiepBekend() ? zonesVanVerdiep() : []).slice();
  const alInLijst = new Set(tekenLijst.map(z => z.id));
  // Ook de vormen die al voor dit verdiep zijn opgeslagen, ook als hun gebied op
  // een ander verdiep hangt: wat hier getekend ligt hoort hier zichtbaar te
  // zijn. Filteren is voor de keuzelijst, niet voor de tekening.
  for (const id of Object.keys(zoneVormen())) {
    if (alInLijst.has(id)) continue;
    tekenLijst.push({ id, naam: ZONE_NAAM[id] || id });
  }
  for (const z of tekenLijst) {
    const pts = puntenVanZone(z.id);
    if (!pts) continue;
    // Bij een gekozen kamer staan de andere kamers leeg. Zeven lege kaders
    // door elkaar is onleesbaar, dus dan alleen de gekozen.
    if (STAAT.zone && STAAT.zone !== z.id) continue;
    const gekozen = STAAT.zone === z.id;
    const actief = STAAT.weergave.zoneBewerken && STAAT.zoneBewerkt === z.id;

    const poly = document.createElementNS(SVG, "polygon");
    poly.setAttribute("points",
      pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" "));
    poly.setAttribute("class",
      "zone-vak" + (gekozen ? " gekozen" : "") + (actief ? " actief" : ""));
    poly.dataset.zone = z.id;
    svg.appendChild(poly);

    // Het etiket hangt boven het hoogste hoekpunt. Bij een rechthoek is dat
    // de linkerbovenhoek — precies zoals voorheen.
    const boven = pts.reduce(
      (a, p) => (p[1] < a[1] || (p[1] === a[1] && p[0] < a[0])) ? p : a, pts[0]);
    const etiket = document.createElement("span");
    // Waar hangt de tekst en welke kant loopt hij op? Naar rechts lopende tekst
    // schuift bij een kamer die rechts tegen een buurman ligt dwars over diens
    // naam: Badkamer 1 en Berging op de eerste verdieping raken elkaar, hun
    // hoogste punten liggen 0,2% uit elkaar, en geen van beide namen was nog te
    // lezen. Daarom: staat het hoogste punt in de rechterhelft van de kamer, dan
    // loopt de tekst naar links — de kamer in. Bij de rechterrand van de
    // plattegrond blijft de oude regel staan, anders loopt het etiket (met de ↺
    // erin) voorbij de rand van `#werkgebied` en wordt het afgekapt.
    const kaderL = Math.min(...pts.map(p => p[0]));
    const kaderR = Math.max(...pts.map(p => p[0]));
    const naarLinks = (boven[0] - kaderL) > (kaderR - boven[0]) || boven[0] > 70;
    etiket.className = "zone-etiket"
      + (boven[1] < 4 ? " laag" : "")
      + (naarLinks ? " rechts" : "");
    etiket.textContent = z.naam;
    etiket.style.left = boven[0].toFixed(2) + "%";
    etiket.style.top = boven[1].toFixed(2) + "%";
    if (actief && zoneVormen()[z.id]) {
      const terug = document.createElement("button");
      terug.className = "zone-terug";
      terug.textContent = "↺";
      terug.title = "terug naar automatisch — de omtrek van de items erin";
      terug.onclick = ev => {
        ev.stopPropagation();
        onthoud();                      // de oude vorm terug met ↶
        delete zoneVormen()[z.id];
        zoneKadersBewaar();
        tekenZoneLagen();
        meld(`${z.naam}: kader weer automatisch — ↶ maakt dit ongedaan.`);
      };
      etiket.appendChild(terug);
    }
    houder.appendChild(etiket);
    etiketVrijzetten(etiket);

    if (STAAT.weergave.zoneBewerken) zoneKlikbaar(poly, z.id, actief, svg, pts, X, Y, etiket);
    geteld++;
  }
  const handmatig = Object.keys(STAAT.zoneKader).length;
  el("label-zones").textContent = STAAT.zone
    ? "1 kamer"
    : `${geteld} kaders${handmatig ? ` · ${handmatig} versleept` : ""}`;
}

/* ---------- zonevormen aanpassen ---------- */

/* Alleen het geselecteerde kader krijgt bediening; de rest is nog maar een
   klik om zich te selecteren. Anders staat het scherm vol handvatten en pakt
   u per ongeluk de verkeerde kamer. */
function zoneKlikbaar(poly, id, actief, svg, pts, X, Y, etiket) {
  const kies = ev => {
    if (actief) return;
    if (ev.button !== 0) return;
    if (ev.target.closest("button")) return;
    ev.preventDefault();
    ev.stopPropagation();
    STAAT.zoneBewerkt = id;
    tekenZoneLagen();
  };
  poly.title = actief
    ? `${ZONE_NAAM[id] || id} — sleep om te verplaatsen · trek aan een hoekpunt · ` +
      `druk op een middenpunt om de zijde te knippen`
    : `${ZONE_NAAM[id] || id} — klik om te selecteren`;
  poly.addEventListener("pointerdown", ev => {
    if (!actief) { kies(ev); return; }
    zoneSleep(ev, id, "vorm");
  });
  if (etiket) etiket.addEventListener("pointerdown", ev => {
    if (!actief) { kies(ev); return; }
    if (ev.target.closest("button")) return;   // de ↺ mag zijn eigen werk doen
    zoneSleep(ev, id, "vorm");
  });
  if (!actief) return;

  // In de rechthoek-modus is een rechthoek geen polygoon: één hoek slepen
  // herformt hem, en er zijn dus geen knip-middenpunten en geen dubbelklik om
  // een hoek te halen. Vormen die méér dan vier hoeken hebben zijn polygoon en
  // blijven zo bewerkbaar.
  const rechthoek = STAAT.weergave.zoneRechthoek && pts.length === 4;

  // Hoekpunten: slepen verplaatst de hoek, dubbelklikken haalt hem weg.
  pts.forEach((p, i) => {
    const c = document.createElementNS(SVG, "circle");
    c.setAttribute("class", "zone-punt");
    c.setAttribute("cx", X(p[0]).toFixed(1));
    c.setAttribute("cy", Y(p[1]).toFixed(1));
    c.setAttribute("r", "5.5");
    c.title = rechthoek
      ? "sleep om de rechthoek te herformen — de overkant blijft staan"
      : "sleep om de hoek te verplaatsen — dubbelklikken haalt hem weg";
    c.addEventListener("pointerdown", ev => {
      ev.stopPropagation();
      zoneSleep(ev, id, "punt", i);
    });
    if (!rechthoek) c.addEventListener("dblclick", ev => {
      ev.stopPropagation();
      zonePuntWeg(id, i);
    });
    svg.appendChild(c);
  });
  if (rechthoek) return;

  // Middenpunt van elke zijde: daar knipt u de zijde in tweeën. Het nieuwe
  // hoekpunt ontstaat onder uw vinger en volgt meteen mee, dus knippen en
  // plaatsen is één gebaar.
  pts.forEach((p, i) => {
    const q = pts[(i + 1) % pts.length];
    const c = document.createElementNS(SVG, "circle");
    c.setAttribute("class", "zone-midden");
    c.setAttribute("cx", X((p[0] + q[0]) / 2).toFixed(1));
    c.setAttribute("cy", Y((p[1] + q[1]) / 2).toFixed(1));
    c.setAttribute("r", "4.5");
    c.title = "druk en trek: deze zijde in tweeën knippen";
    c.addEventListener("pointerdown", ev => {
      ev.stopPropagation();
      zoneSleep(ev, id, "midden", i);
    });
    svg.appendChild(c);
  });
}

/* Drie soorten slepen, één afhandelaar:

     "vorm"   de hele contour verplaatsen;
     "punt"   één hoek verplaatsen;
     "midden" de zijde knippen — het middenpunt wordt een hoekpunt en volgt
              meteen uw muis.

   De vorm tussentijd gaat direct in `STAAT.zoneKader` en wordt opnieuw
   getekend. De laag is klein genoeg om dat bij elke muisbeweging te doen, en
   zo ziet u de vorm terwijl u trekt. */
function zoneSleep(ev, id, soort, i) {
  // De modus van dit moment: rechthoek-hershapen of vrije polygoon. Eén keer
  // vastleggen, zodat er niet halverwege een sleep iets kan omslaan.
  const rechthoekModus = STAAT.weergave.zoneRechthoek;
  if (ev.button !== 0) return;
  ev.preventDefault();
  ev.stopPropagation();                      // geen pan van het vlak eronder

  const laag = el("zonelagen");
  const rect = laag.getBoundingClientRect();
  const punt = e => klemPunt([
    (e.clientX - rect.left) / (rect.width || 1) * 100,
    (e.clientY - rect.top) / (rect.height || 1) * 100,
  ]);
  const beg = puntenVanZone(id).map(p => [p[0], p[1]]);
  const was = puntenUitKader(zoneVormen()[id]);   // wat er al stond, of null
  const vooraf = huidigeStaat();                     // stand vóór het slepen
  const p0 = punt(ev);
  let nu = beg.map(p => [...p]);
  let nieuw = -1;

  if (soort === "midden") {
    const q = beg[(i + 1) % beg.length];
    nu = [...beg.slice(0, i + 1),
          [(beg[i][0] + q[0]) / 2, (beg[i][1] + q[1]) / 2],
          ...beg.slice(i + 1)];
    nieuw = i + 1;
  }

  const zet = p => {
    if (soort === "vorm") {
      // De hele vorm mee, en begrensd als één geheel: per hoek begrenzen zou
      // de vorm vervormen zodra hij de rand raakt (drie hoeken op 100% en één
      // op 96,5%). Nu schuift de contour net zover naar binnen als er past.
      let dx = p[0] - p0[0], dy = p[1] - p0[1];
      const xs = beg.map(q => q[0]), ys = beg.map(q => q[1]);
      dx = Math.min(Math.max(dx, -Math.min(...xs)), 100 - Math.max(...xs));
      dy = Math.min(Math.max(dy, -Math.min(...ys)), 100 - Math.max(...ys));
      nu = beg.map(q => [q[0] + dx, q[1] + dy]);
    } else if (soort === "punt") {
      if (rechthoekModus && beg.length === 4) {
        // Rechthoekig: de overkant blijft staan en de hoeken blijven in lijn —
        // verplaatsen is herformen, geen losse hoek die eruit steekt.
        nu = rechthoekSleep(beg, i, p);
      } else {
        nu = beg.map(q => [q[0], q[1]]);
        nu[i] = p;
      }
    } else {
      nu[nieuw] = p;
    }
    zoneVormen()[id] = { punten: nu };
    tekenZoneLagen();
  };

  const beweeg = e => zet(punt(e));
  const einde = () => {
    document.removeEventListener("pointermove", beweeg);
    document.removeEventListener("pointerup", einde);
    document.removeEventListener("pointercancel", einde);
    // Alleen aanklikken zonder te slepen verandert niets en mag dus niets
    // vastspijkeren: één klik zou het automatische kader bevriezen. Een
    // geknipte zijde telt wél — daar is echt iets nieuws ontstaan.
    if (soort !== "midden" && JSON.stringify(nu) === JSON.stringify(beg)) {
      if (was) zoneVormen()[id] = { punten: was };
      else delete zoneVormen()[id];
      tekenZoneLagen();
      return;
    }
    // Eerst de stand vóór het slepen wegzetten: die is wat ↶ terugbrengt.
    // (Het document is inmiddels niet veranderd, dus alleen de zonevorm telt.)
    onthoud(vooraf);
    zoneVormen()[id] = { punten: nu };
    zoneKadersBewaar();
    tekenZoneLagen();
    const wat = soort === "midden" ? "zijde doorgeknipt"
      : soort === "punt"
        ? (rechthoekModus && beg.length === 4 ? "rechthoek aangepast" : "hoek verplaatst")
      : "vorm verplaatst";
    meld(`${ZONE_NAAM[id] || id}: ${wat} — ↶ maakt het ongedaan, ↺ naast de ` +
         `naam zet alles terug, dubbelklik op een hoek haalt hem weg.`);
  };
  document.addEventListener("pointermove", beweeg);
  document.addEventListener("pointerup", einde);
  document.addEventListener("pointercancel", einde);
}

/* Een hoek weghalen, zodat een uitgeknipte zijde ook zonder meteen alles terug
   te zetten ongedaan te maken is. Drie hoeken is de grens. */
function zonePuntWeg(id, i) {
  const p = puntenVanZone(id);
  if (!p || p.length <= 3) {
    meld(`${ZONE_NAAM[id] || id}: minstens drie hoeken — verder kan niet.`);
    return;
  }
  const weg = p.slice(0, i).concat(p.slice(i + 1));
  onthoud();                            // de oude vorm terug met ↶
  zoneVormen()[id] = { punten: weg.map(klemPunt) };
  zoneKadersBewaar();
  tekenZoneLagen();
  meld(`${ZONE_NAAM[id] || id}: hoekpunt weggehaald (${p.length} → ${weg.length})` +
       ` — ↶ maakt het ongedaan.`);
}

/* ---------- unavailable-markeringen ----------

   Uw eigen rode kringen: 34 `conditional`-blokken met `state: unavailable` en
   een `icon: mdi:close-circle` erin. Die horen niet in de configuratie — ze
   maken de lijst onleesbaar en hun posities liggen allang niet meer bij het
   item waar ze bij horen. De editor haalt ze eruit en zet ze bij het
   exporteren vanzelf terug, op de plek van het item zelf. Zo hoeft u ze
   nergens te beheren en ze staan altijd op de goede plek. */
const MARKER_STIJL = {
  color: "red",
  filter: "drop-shadow(0 0 4px red)",
  "font-size": "1.5vw",
  opacity: "0.9",
  "z-index": "100",
};

function isMarkering(e) {
  return e.type === "conditional"
    && (e.conditions || []).some(c => c.state === "unavailable")
    && (e.elements || []).some(k => k.icon === "mdi:close-circle");
}

/* Haalt ze uit de boom weg en geeft terug wat eruit ging. */
function filterMarkeringen(doc) {
  const weg = [];
  const loop = lijst => {
    const blijven = [];
    for (const e of lijst || []) {
      if (isMarkering(e)) weg.push(e);
      else { blijven.push(e); if (e.elements) loop(e.elements); }
    }
    lijst.length = 0;
    lijst.push(...blijven);
  };
  for (const view of doc.views || []) {
    for (const kaart of view.cards || []) {
      const c = kaart.card || kaart;
      if (c && c.elements) loop(c.elements);
    }
  }
  return weg;
}

/* Entities waarvoor géén markering gemaakt wordt.

   De rode kring wordt bij het exporteren voor élk geplaatst element met een
   entity gemaakt — dat is handig (ze staan altijd op de goede plek en u hoeft
   ze niet te onderhouden), maar het betekent ook dat verwijderen uit het
   document niet blijft staan: bij de volgende export komen ze terug.

   Voor camera's die wél beeld geven maar waarvan HA de status als
   `unavailable` rapporteert — UniFi Protect doet dat bij kanalen die herverbinden
   — zou dat een permanent rood kruis opleveren terwijl er wél een plaatje en
   video is. Zet zo'n entity-id eronder om hem weg te laten; haal hem eruit om
   de markering terug te krijgen. */
const MARKER_GEEN = new Set([
  "camera.g4_doorbell_high",   // Protect geeft beeld én video, maar zegt 'unavailable'
]);

/* Eén marker per entity, op de plek van het item zelf. Drie voorwaarden:

   - het item moet een positie hebben. De vijf personen hebben er geen, daar valt
     niets op te zetten;
   - geen laag van 100% breed. Dat is een achtergrondvlak dat de hele
     plattegrond beslaat; een marker ervan zou in het midden landen in plaats
     van bij het apparaat;
   - één marker per entity. Sommige entities hebben twee items ( een gauge en
     een icoon, of twee afbeeldingen ); twee markers zou twee rode kringen op
     dezelfde kamer geven. Het eerste item dat we tegenkomen wint. */
function markersVoor(lijst, uit, gezien) {
  const gemist = new Set(gezien || []);
  for (const e of lijst || []) {
    const st = e.style || {};
    const heeftPleks = e.entity && !gemist.has(e.entity)
      && !MARKER_GEEN.has(e.entity)
      && st.left != null && st.top != null
      && parseFloat(st.width || "0") < 99;
    if (heeftPleks) {
      gemist.add(e.entity);
      uit.push({
        conditions: [{ entity: e.entity, state: "unavailable" }],
        elements: [{
          icon: "mdi:close-circle",
          style: Object.assign({}, MARKER_STIJL, { left: st.left, top: st.top }),
          tap_action: { action: "more-info" },
          type: "icon",
        }],
        type: "conditional",
      });
    }
    if (e.elements) markersVoor(e.elements, uit, gemist);
  }
  return uit;
}

/* `__aan`, `__zone` en `__bron` zijn werkgeheugen van de editor. Die horen niet
   in het dashboard: onbekende sleutels in een picture-element geven een
   waarschuwing en het bestand zou vol staan met rommel. */
function stripEigen(lijst) {
  for (const e of lijst || []) {
    delete e.__zone;
    delete e.__bron;
    for (const c of e.conditions || []) delete c.__aan;
    if (e.elements) stripEigen(e.elements);
  }
}

/* De kopie die u krijgt: uw bewerkte elementen, plus de markers erachteraan. */
function exportDoc() {
  const kopie = JSON.parse(JSON.stringify(STAAT.doc));
  // De twee opmerkingen uit het bronbestand (`_bron`, `_let_op`) zijn
  // kommentaar op de momentopname, geen onderdeel van het dashboard. HA zou
  // ze als onbekende sleutelklagen, dus ze horen niet in een export. Ze
  // blijven wel in `STAAT.doc` staan — alleen de kopie gaat ze kwijt.
  delete kopie._bron;
  delete kopie._let_op;
  for (const view of kopie.views || []) {
    for (const kaart of view.cards || []) {
      const c = kaart.card || kaart;
      // De `entities:`-lijst op alfabet: abonnementslijst van de
      // config-template-card én de lijst van een kaart die entities toont. De
      // volgorde waarin ergens naar verwezen wordt zegt niets — die lijst groeit
      // in de volgorde van het moment, en zo'n lijst is niet te vergelijken met
      // wat er al in Home Assistant staat. Gesorteerd is hij dat wél, en het
      // leest in YAML meteen alfabetisch terug.
      //
      // Alleen als het puur entiteiten-id's zijn: een lijst met objecten erin
      // (`{entity: …, name: …}`) is kaartinhoud, en die herschik ik niet.
      for (const lijst of new Set([kaart.entities, c.entities])) {
        if (!Array.isArray(lijst) || !lijst.length) continue;
        if (!lijst.every(x => typeof x === "string")) continue;
        lijst.sort((a, b) => a.localeCompare(b));
      }
      if (c && c.elements) {
        stripEigen(c.elements);
        c.elements = c.elements.concat(markersVoor(c.elements, [], []));
      }
    }
  }
  return kopie;
}

/* De 55 namen uit /config/floorplan/2d-floorplan.js, als die er nog staan. */
function laadHerkend() {
  return fetch("herkend.json?t=" + Date.now())
    .then(r => (r.ok ? r.json() : null))
    .then(d => (d && Array.isArray(d.entiteiten) ? d.entiteiten : []))
    .catch(() => []);
}

/* ---------- de boom doorlopen ---------- */

/* De abonnementslijst van de config-template-card bijhouden.

   Die `entities:`-lijst bepaalt waarop de kaart zélf live reageert. Staat uw
   entity er niet in, dan ziet u de wijziging pas na een verversing — precies
   wat u niet wilt. Staat er iets in dat nergens meer voorkomt, dan is het een
   dooie abonnee die alleen maar voor re-renders zorgt.

   Dus, bij elke wijziging van het document: alles waar de kaart naar verwijst
   erin, de rest eruit. Alleen echte entiteiten tellen mee —
   `licht_living_rechts.png` oogt ook als `domein.naam`, maar dat is een
   bestandsnaam. En alleen `config-template-card`-karen: een `entities:`-kaart
   is inhoud, geen abonnementslijst, en die mag u niet schoonvegen. */
function abonnementenBijwerken() {
  const resultaat = { toegevoegd: [], weggehaald: [] };
  for (const view of STAAT.doc.views || []) {
    for (const kaart of view.cards || []) {
      if (!Array.isArray(kaart.entities)) continue;
      if (!String(kaart.type || "").includes("config-template")) continue;
      // Zonder de lijst zelf in de tekst: anders abonneert hij zich op zijn
      // eigen woorden en wordt er nooit iets geschrapt.
      const tekst = JSON.stringify(Object.assign({}, kaart, { entities: undefined }));
      const verwijzingen = new Set();
      const patroon = /["']([a-z_][a-z0-9_]*\.[a-z0-9_]+)["']/g;
      let m;
      while ((m = patroon.exec(tekst))) verwijzingen.add(m[1]);

      for (const id of kaart.entities.slice()) {
        if (verwijzingen.has(id)) continue;
        kaart.entities.splice(kaart.entities.indexOf(id), 1);
        resultaat.weggehaald.push(id);
      }
      for (const id of verwijzingen) {
        if (!STAAT.namen[id] || kaart.entities.includes(id)) continue;
        kaart.entities.push(id);
        resultaat.toegevoegd.push(id);
      }
    }
  }
  STAAT.abonnement = resultaat;
  return resultaat;
}

/* De kaart van een view als er iets te bewerken valt: een view kan een wrapper
   zijn (`{card: …}`) of de kaart zelf. Zonder `elements` — een leeg tabblad of
   een `sections`-lay-out — valt er in die view niets te bewerken. */
function bewerkbareKaart(view) {
  for (const c of (view && view.cards) || []) {
    const k = c && (c.card || c);
    if (k && Array.isArray(k.elements)) return k;
  }
  return null;
}

/* Welke verdieping staat er open? De gekozen, of bij gebrek daaraan de eerste
   die wél een kaart heeft. Vroeger pakte deze functie de láátste kaart van het
   láátste view — daarmee was er geen weg terug naar een ander tabblad. */
/* Welke verdieping u open had. Net als de stijlkeuze van de voorwerpen iets van
   uw scherm en niet van de plattegrond, dus het staat in deze browser en niet op
   de HA-instance. */
const OPEN_VERDIEP_SLEUTEL = "prototype.openverdiep";

function onthoudVerdiep() {
  if (!Number.isInteger(STAAT.viewIndex) || STAAT.viewIndex < 0) return;
  try { localStorage.setItem(OPEN_VERDIEP_SLEUTEL, String(STAAT.viewIndex)); } catch (_) { /* geen opslag */ }
}

function eerderVerdiep() {
  try {
    const n = parseInt(localStorage.getItem(OPEN_VERDIEP_SLEUTEL), 10);
    return Number.isInteger(n) && n >= 0 ? n : null;
  } catch (_) {
    return null;
  }
}

function bouwStaats() {
  STAAT.tak = new WeakMap();
  STAAT.kaart = null;
  const views = STAAT.doc.views || [];
  // De gekozen verdieping mag óók leeg zijn — anders kun je er nooit een kaart
  // in maken. Alleen als de keuze zelf onbruikbaar is vallen we terug op de
  // eerste view die wél een kaart heeft.
  let i = Number.isInteger(STAAT.viewIndex) && views[STAAT.viewIndex] ? STAAT.viewIndex : -1;
  // Nog niets gekozen (een verse laadbeurt)? Dan terug naar de verdieping die u
  // open had — ook als daar nog geen kaart in zit, want dat is uw eigen keuze.
  if (i < 0) {
    const eerder = eerderVerdiep();
    if (eerder != null && views[eerder]) i = eerder;
  }
  if (i < 0) i = views.findIndex(bewerkbareKaart);
  STAAT.viewIndex = i;
  STAAT.view = i >= 0 ? views[i] : null;
  STAAT.kaart = i >= 0 ? bewerkbareKaart(views[i]) : null;
  loop(STAAT.kaart ? STAAT.kaart.elements || [] : [], null, "");
  markeerZones();
  // Altijd als laatste: dan is de abonnementslijst actueel zodra u exporteert.
  abonnementenBijwerken();
}

/* De sleutel is het pad van indices vanaf de bovenkant: "0.12.1". Die blijft
   hetzelfde zolang de boom hetzelfde is, ook na ongedaan-maken, en is daarom
   bruikbaar als naam voor "verborgen". */
function loop(lijst, ouder, pad, diepte = 0) {
  (lijst || []).forEach((e, i) => {
    const sleutel = pad ? pad + "." + i : String(i);
    // `lijst` is nodig om te kunnen verwijderen. Een element aan de bovenkant
    // heeft geen ouderelement, maar wel een bovenliggende lijst — anders zou
    // "Verwijderen" bij de helft van de kaart zeggen dat het niet kan.
    STAAT.tak.set(e, { ouder, lijst, index: i, sleutel, diepte });
    if (e.elements) loop(e.elements, e, sleutel, diepte + 1);
  });
}

function aantal() {
  let n = 0;
  const tel = l => (l || []).forEach(e => { n++; tel(e.elements); });
  tel(STAAT.kaart ? STAAT.kaart.elements : []);
  return n;
}

function sleutelVan(e) {
  const info = STAAT.tak.get(e);
  return info ? info.sleutel : "";
}

/* Is er ergens in de boom een voorwaarde uitgeschakeld? Een `conditional`
   is zelf niet op de plattegrond te zien — alleen zijn kinderen zijn dat. De
   voorwaarde zit aan de doos, de gevolgen zitten aan de kinderen, dus ik moet
   omhoog lopen om het te weten. */
function voorwaardeUit(e) {
  let node = e;
  while (node) {
    const c = node.conditions && node.conditions[0];
    if (c) {
      if (STAAT.condities === "statussen") {
        const w = conditieWaar(c);
        if (w !== null && !w) return true;
      } else if (c.__aan === false) return true;
    }
    const info = STAAT.tak.get(node);
    node = info ? info.ouder : null;
  }
  return false;
}

/* ---------- maten en zoom ---------- */

function basisBreedte() {
  return Math.max(320, Math.min(el("werkgebied").clientWidth - 36, 1400));
}

function vlakBreedte() {
  return Math.round(basisBreedte() * STAAT.zoom);
}

/* Eén `vw` in pixels. In de echte kaart is dat 1% van de vensterbreedte; hier
   vermenigvuldigd met de zoom, zodat inzoomen alles gelijk vergroot. */
function vwEenheid() {
  return (window.innerWidth / 100) * STAAT.zoom;
}

function vwPx(waarde) {
  const n = parseFloat(waarde);
  return isFinite(n) ? n * vwEenheid() : 0;
}

function cssWaarde(waarde) {
  return String(waarde).replace(/([\d.]+)\s*vw/gi, (_, n) => {
    const p = parseFloat(n) * vwEenheid();
    return (isFinite(p) ? p.toFixed(2) : "0") + "px";
  });
}

/* De bestandsnaam uit een afbeeldingsuitdrukking als "${vars[0] + 'x.png'}".
   Wat er niet in past — een andere uitdrukking, een vaste URL — laten we heel
   terugkomen; alleen de naam is wat we willen weten (en kunnen veranderen). */
function afbeeldingVan(kaart) {
  const img = kaart && kaart.image;
  const m = /\+\s*'([^']+)'/.exec(String(img || ""));
  if (m) return m[1];
  return typeof img === "string" && !img.includes("${") ? img : "";
}

/* Cache-plek voor de achtergrondfoto's. De browser onthoudt een afbeelding op
   z'n URL: een nieuwe foto onder dezelfde naam zou de oude blijven tonen, en
   daarom moet u nu telkens hard verversen. Oplossing: één tijdstip per
   laadbeurt (een gewone F5 geeft dus al een verse URL), plus een verse stempel
   zodra ú iets ophaalt. Bewust géén nieuw tijdstip per tekenbeurt — dan zou het
   beeld van 1,6 MB bij elke muisbeweging opnieuw worden gehaald. */
function beeldTijdNu() {
  const d = new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join("");
}
const BEELD_TIJD = beeldTijdNu();
const beeldStempels = {};              // "<variant>/<naam>" -> stempel na een upload
let beeldTel = 0;                      // voor een upload in dezelfde seconde
function beeldStempelVoor(sleutel) { return beeldStempels[sleutel] || BEELD_TIJD; }
function beeldStempelZet(pad) {        // pad zoals bij het ophalen: first_floor/<variant>/<naam>
  const sleutel = pad.replace(/^first_floor\//, "");
  const nu = beeldTijdNu();
  const oude = beeldStempels[sleutel] || BEELD_TIJD;
  // Zelfde seconde als daarnet: dan ziet de browser géén verschil en toont hij
  // de oude foto. Een tel erbij, zodat de URL altijd verandert.
  beeldStempels[sleutel] = nu === oude ? `${nu}${++beeldTel}` : nu;
}

function pasVlakAan() {
  const img = el("ondergrond");
  const vlak = el("vlak");
  const breed = vlakBreedte();
  const meet = () => {
    const verhouding = (img.naturalWidth / img.naturalHeight) || 2.08;
    vlak.style.width = breed + "px";
    vlak.style.height = Math.round(breed / verhouding) + "px";
    // De contouren van de zones zijn in pixels getekend op de maat van dit
    // vlak. Zonder deze tekening zouden ze op de maat blijven staan van het
    // vlak van daarnet — toen de achtergrondfoto nog niet geladen was en het
    // 0 hoog was. Dan stonden de kamers pas weer goed zodra er iemand iets
    // aanklikte.
    tekenZoneLagen();
  };
  // De achtergrond van de verdieping die nú open is: de kaart noemt de
  // bestandsnaam en de map is dezelfde als waar de editor zelf uit laadt.
  // Vroeger stond hier hardgecodeerd `home.png`, waardoor élke verdieping de
  // afbeelding van het gelijkvloers kreeg.
  const kaart = bewerkbareKaart(STAAT.view);
  const sleutel = `${STAAT.variant}/${verdiepAfbeelding(STAAT.variant, kaart)}`;
  const bron = "/local/jdi_custom_images/floorplans/first_floor/" +
    `${sleutel}?t=${beeldStempelVoor(sleutel)}`;
  img.onload = meet;
  // Ontbreekt het bestand, dan alsnog opmeten met de verhouding 2,08 — anders
  // bleef het vlak op 0 staan en was er niets om op te tekenen.
  img.onerror = meet;
  if (img.getAttribute("src") === bron) {
    if (img.complete && img.naturalWidth) meet();
    return;                       // al de goede afbeelding
  }
  meet();                         // maat van de vorige foto, tot de nieuwe binnen is
  img.src = bron;
}

function zoomZet(nieuw, anker = null) {
  let stap = TRAP.findIndex(z => z >= nieuw - 1e-9);
  if (stap < 0) stap = TRAP.length - 1;

  // Vóór het meten onthouden waar het punt onder de aanwijzer staat, anders is
  // de verhouding niet meer te berekenen zodra het vlak van maat verandert.
  const werk = el("werkgebied");
  const rect = werk.getBoundingClientRect();
  const dx = anker ? anker.clientX - rect.left : 0;
  const dy = anker ? anker.clientY - rect.top : 0;
  const offset = anker
    ? { x: werk.scrollLeft + dx, y: werk.scrollTop + dy }
    : null;
  const vorig = STAAT.zoom;

  STAAT.zoom = TRAP[stap];
  el("zoom-label").textContent = Math.round(STAAT.zoom * 100) + "%";
  pasVlakAan();
  tekenAlles();

  if (offset) {
    const factor = STAAT.zoom / vorig;
    werk.scrollLeft = offset.x * factor - dx;
    werk.scrollTop = offset.y * factor - dy;
  }
}

function zoomStap(richting, anker = null) {
  let stap = TRAP.findIndex(z => Math.abs(z - STAAT.zoom) < 1e-9);
  if (stap < 0) stap = TRAP.indexOf(1);
  stap = Math.min(TRAP.length - 1, Math.max(0, stap + richting));
  zoomZet(TRAP[stap], anker);
}

/* Schuift het beeld zodat het midden van `vlak` precies in het midden van het
   werkgebied valt. Zonder dit springt het beeld wel in, maar naar boven links.

   `vlak` komt uit vlakVanZone: l en t zijn percentages van de plattegrond, en in
   picture-elements is dat het midden van het element, niet de linkerrand. De
   padding van het werkgebied wordt niet meegerekend: het punt op de plattegrond
   waar u naar toe schuift is `x` pixels van de linkerrand van het vlak, en dat
   vlak staat al op padding af van de linkerrand van het venster. De browser ploft
   de waarde vanzelf terug binnen de grenzen: bij een zone tegen de rand van de
   plattegrond kan het beeld simpelweg niet verder schuiven, en dat is dan goed
   genoeg — de zone ligt dan wel volledig in beeld. */
function centreerOpVlak(vlak) {
  const maat = el("vlak").getBoundingClientRect();
  const werk = el("werkgebied");
  if (!maat.width || !maat.height) return;
  const stijl = getComputedStyle(werk);
  const pad = (k) => parseFloat(stijl[k]) || 0;
  werk.scrollLeft = (parseFloat(vlak.l) / 100) * maat.width
    - (werk.clientWidth - pad("paddingLeft") - pad("paddingRight")) / 2;
  werk.scrollTop = (parseFloat(vlak.t) / 100) * maat.height
    - (werk.clientHeight - pad("paddingTop") - pad("paddingBottom")) / 2;
}

/* De grootste stap uit de trap waarbij de zone in beeld past.

   Twee eisen, in volgorde van belangrijk:
     1. de zone hangt niet half buiten beeld;
     2. de zone staat zo goed mogelijk in het midden.

   Die twee botsen bij een zone tegen de rand van de plattegrond. De garage
   zit op 19%: om die gecentreerd te krijgen moet er 332px scrollruimte aan de
   linkerkant overblijven, en dat kan pas vanaf 263% — terwijl 200% de grens is
   zodat u nog een kamer ziet in plaats van één icoon. Dan wint eis 1: de zone
   ligt helemaal in beeld en het beeld schuift tot de rand.

   Niet verder dan 200%: bij 400% ziet u één icoon en geen kamer meer. */
function zoomVoorZone(vlak) {
  const werk = el("werkgebied");
  const img = el("ondergrond");
  const stijl = getComputedStyle(werk);
  const pad = (k) => parseFloat(stijl[k]) || 0;
  const zichtbaarB = werk.clientWidth - pad("paddingLeft") - pad("paddingRight");
  const zichtbaarH = werk.clientHeight - pad("paddingTop") - pad("paddingBottom");
  const basis = basisBreedte();
  const verhouding = (img.naturalWidth / img.naturalHeight) || 2.08;
  const b = parseFloat(vlak.b) / 100, h = parseFloat(vlak.h) / 100;
  const l = parseFloat(vlak.l) / 100, t = parseFloat(vlak.t) / 100;

  let pastVolledig = null;
  for (let i = TRAP.length - 1; i >= 0; i--) {
    const z = TRAP[i];
    if (z > 2) continue;
    const vw = basis * z, vh = vw / verhouding;
    const bx = l * vw, by = t * vh, zb = b * vw, zh = h * vh;
    // De zone mag niet half buiten beeld staan.
    if (zb > zichtbaarB || zh > zichtbaarH) continue;
    // Ook nog schuifruimte over om het midden van het beeld te halen.
    const kanMidden = bx >= zichtbaarB / 2 && bx <= vw - zichtbaarB / 2
                   && by >= zichtbaarH / 2 && by <= vh - zichtbaarH / 2;
    if (kanMidden) return z;
    if (pastVolledig === null) pastVolledig = z;
  }
  return pastVolledig !== null ? pastVolledig : 1;
}

/* ---------- afbeeldingen ---------- */

const ONZICHTBAAR = /transp1px|1px\.png/;

function takken(uitdrukking) {
  let s = String(uitdrukking == null ? "" : uitdrukking);
  s = s.replace(/^\s*\$\{/, "").replace(/\}\s*$/, "");
  if (s.includes("?")) {
    const p = s.indexOf("?");
    const k = s.indexOf(":", p);
    if (k > p) return [s.slice(p + 1, k).trim(), s.slice(k + 1).trim()];
  }
  return [s.trim()];
}

/* Ziet dit eruit als een uitdrukking die wij niet kunnen uitrekenen? De kaart
   gebruikt JavaScript in `image` en `state_image` — het beeld van de televisie
   hangt bijvoorbeeld van een sensor af. Wij kennen `states` en `vars` niet, dus
   zo'n waarde levert geen bestandsnaam op. Vragen we hem toch op, dan vraagt de
   browser om een half uitgerekende URL en geeft Home Assistant een 404 in de
   console. Liever niets vragen dan iets fouts. */
function isUitdrukking(waarde) {
  const t = String(waarde == null ? "" : waarde);
  return /\$\{|\bstates\[|\bvars\[|\bconfig\.|\bhass\./.test(t) || /\s\+\s/.test(t);
}

function pad(uitdrukking) {
  const kandidaten = takken(uitdrukking);
  let keuze = kandidaten[0];
  // Bij een aan/uit-twee takken kiezen we standaard de zichtbare.
  if (kandidaten.length === 2 && ONZICHTBAAR.test(kandidaten[0]) && !ONZICHTBAAR.test(kandidaten[1])) {
    keuze = kandidaten[1];
  }
  keuze = keuze.replace(/vars\[0\]\s*\+\s*/g, "").replace(/["']/g, "").trim();
  // Blijft er nog uitdrukking over, dan kennen wij de bestandsnaam niet.
  if (!keuze || isUitdrukking(keuze)) return "";
  const basis = `/local/jdi_custom_images/floorplans/first_floor/${STAAT.variant}/`;
  if (keuze.startsWith("/local/")) return keuze;
  if (keuze.startsWith("local/")) return "/" + keuze;
  return basis + keuze;
}

function isAfbeelding(e) {
  const i = e.image || (e.state_image && e.state_image.on);
  return !!i && !String(i).includes("mdi:");
}

/* Welk icoon Home Assistant zelf kiest als de entiteit er geen heeft. Dit volgt
   de `device_class`; de meest voorkomende staan hier. */
const DEVICE_CLASS_ICOON = {
  temperature: "mdi:thermometer",
  humidity: "mdi:water-percent",
  battery: "mdi:battery",
  power: "mdi:flash",
  energy: "mdi:lightning-bolt",
  illuminance: "mdi:brightness-5",
  pressure: "mdi:gauge",
  voltage: "mdi:sine-wave",
  current: "mdi:current-ac",
  moisture: "mdi:water",
  motion: "mdi:motion-sensor",
  door: "mdi:door",
  window: "mdi:window-closed",
  connectivity: "mdi:wifi",
};

const GEEN_DOMEIN_GOK = new Set(["sensor"]);

function icoonVan(e) {
  if (e.icon) return e.icon;
  if (e.default) return e.default;
  const entity = String(e.entity || "");
  const eigen = entity && STAAT.entityIconen ? STAAT.entityIconen[entity] : null;
  if (eigen) return eigen;
  // En wat Home Assistant zelf voor deze entiteit koos — de device_class en al.
  // Zonder dit zou de editor een naamvakje tekenen waar de kaart een icoon zet.
  const live = entity && STAAT.iconenLive ? STAAT.iconenLive[entity] : null;
  if (live) return live;
  const domein = entity.split(".")[0];
  if (GEEN_DOMEIN_GOK.has(domein)) return null;
  return STAAT.perDomein[domein] || null;
}

const ICONEN_SLEUTEL = "prototype.iconen";

function laadLiveIconen() {
  try { STAAT.iconenLive = JSON.parse(localStorage.getItem(ICONEN_SLEUTEL)) || {}; }
  catch (_) { STAAT.iconenLive = {}; }
}

function bewaarLiveIconen() {
  try { localStorage.setItem(ICONEN_SLEUTEL, JSON.stringify(STAAT.iconenLive)); }
  catch (_) { /* geen opslag */ }
}

/* Voor elementen zónder icoon: vraag het Home Assistant. De momentopname kent
   het icoon van een entiteit niet — een temperatuursensor dankt zijn thermometer
   aan de device_class — en zonder dit tekent de editor een naamvakje waar de
   kaart straks een icoon zet. Alleen wat we nog niet weten, en in kleine
   porties; de opgehaalde iconen blijven bewaard. */
let iconenBezig = false;
async function haalOntbrekendeIconen() {
  if (iconenBezig) return;
  const nodig = [];
  const loop = lijst => {
    for (const e of lijst || []) {
      if (e && e.entity && !e.icon && !e.default &&
          !(STAAT.entityIconen && STAAT.entityIconen[e.entity]) &&
          STAAT.iconenLive[e.entity] === undefined) nodig.push(e.entity);
      if (e && e.elements) loop(e.elements);
      if (e && e.card) loop(Array.isArray(e.card) ? e.card : [e.card]);
    }
  };
  if (STAAT.kaart) loop(STAAT.kaart.elements);
  // Alles wat ontbreekt, hooguit veertig: het is één klein verzoek per entiteit
  // en daarna staat het in de cache, dus dit gebeurt maar één keer.
  const uniek = [...new Set(nodig)].slice(0, 40);
  if (!uniek.length) return;
  iconenBezig = true;
  try {
    let iets = false;
    for (const id of uniek) {
      const icoon = await icoonVanHA(id);
      if (icoon === null) continue;              // geen antwoord: later opnieuw
      STAAT.iconenLive[id] = icoon;
      iets = true;
    }
    if (iets) {
      bewaarLiveIconen();
      tekenAlles();
    }
  } finally {
    iconenBezig = false;
  }
}

/* Het icoon dat de entiteit nú draagt, opgevraagd bij Home Assistant zelf. Dat
   is de enige bron die de device_class kent — en dus de thermometer. Lukt het
   niet (geen ⚙-instellingen, HA even weg), dan geeft dit `null` en blijft het
   bij wat de momentopname weet. */
async function icoonVanHA(entity) {
  const inst = haInstelling();
  if (!inst.url || !inst.token) return null;
  try {
    const r = await metTijdslimiet(fetch(
      `${inst.url.replace(/\/+$/, "")}/api/states/${encodeURIComponent(entity)}`,
      { headers: { Authorization: `Bearer ${inst.token}` } }), 5000);
    if (!r.ok) return null;
    const st = await r.json();
    const at = (st && st.attributes) || {};
    // Staat er geen `icon`, dan kiest Home Assistant het op grond van de
    // device_class — precies wat er bij een temperatuursensor gebeurt.
    const icoon = at.icon || DEVICE_CLASS_ICOON[at.device_class] || "";
    // Antwoord binnengekregen: `""` betekent "deze entiteit draagt geen eigen
    // icoon" (dan kiest Home Assistant er zelf een), `null` betekent "geen
    // antwoord" — dat verschil bepaalt of we het nog eens proberen.
    return icoon || "";
  } catch (_) {
    return null;
  }
}

function kleurVan(e, standaard) {
  const st = e.style || {};
  const ruw = st["--paper-item-icon-color"] || st.color || standaard;
  const v = String(ruw || "").trim();
  if (/^var\(/i.test(v)) {
    const naam = v.match(/--[a-z0-9-]+/i);
    return { kleur: "#cfd8dc", onbekend: naam ? naam[0] : v };
  }
  if (/^#[0-9a-f]{3,8}$/i.test(v)) return { kleur: v };
  return { kleur: v || "#cfd8dc" };
}

function svgIcoon(naam, kleur, px) {
  const d = STAAT.iconen[naam];
  if (!d) return null;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", px);
  svg.setAttribute("height", px);
  const pad = document.createElementNS(SVG, "path");
  pad.setAttribute("d", d);
  pad.setAttribute("fill", kleur);
  svg.appendChild(pad);
  return svg;
}

/* De twee gereedschapsknoppen krijgen hun icoon uit iconen.json, net als de
   plattegrond. Ontbreekt er eentje, dan valt die knop terug op een teken, want
   de editor moet blijven werken. */
/* De knoppen tonen alleen een icoon; de tekst ervan staat in de tooltip. Zo
   blijft de balk smal en leest u de knop alsnog. */
function tekenGereedschap() {
  const knoppen = [
    ["greep-pan", "mdi:hand-back-right-outline", "✋"],
    ["greep-select", "mdi:cursor-default-click-outline", "➤"],
    ["knop-balk-toevoegen", "mdi:devices", "▤"],
    ["knop-balk-lijst", "mdi:filter-variant", "▽"],
    ["knop-refresh", "mdi:refresh", "⟳"],
    ["knop-haaldashboard", "mdi:cloud-download", "☁"],
    ["knop-ongedaan", "mdi:undo", "↶"],
    ["knop-herstellen", "mdi:restore", "↻"],
    ["knop-export", "mdi:export", "⤓"],
    ["knop-export-yaml", "mdi:file-code", "⌁"],
    ["knop-schrijf", "mdi:content-save", "💾"],
    ["knop-instellingen", "mdi:cog", "⚙"],
    ["knop-zoom-pas", "mdi:fit-to-screen", "⤢"],
    // De vier lijstknoppen links: dezelfde behandeling, want ook die tonen
    // alleen een icoon en heten de rest van de tijd alleen in de tooltip.
    // De iconen zijn dezelfde als Home Assistant zelf voor die tabbladen
    // gebruikt (config-sections.ts): devices → mdiDevices, entities →
    // mdiShape, helpers → mdiTools, person → mdiAccount.
    ["wijz-apparaten", "mdi:devices", "▤"],
    ["wijz-entities", "mdi:shape", "◆"],
    ["wijz-persons", "mdi:account", "☺"],
    ["wijz-helpers", "mdi:tools", "🔧"],
  ["wijz-voorwerpen", "mdi:sofa", "🛋"],
  ];
  for (const [id, icoon, terugval] of knoppen) {
    const knop = el(id);
    if (!knop) continue;
    knop.innerHTML = "";
    // `fill="currentColor"` volgt de kleur van de knop, dus een actieve knop
    // kleurt vanzelf mee in plaats dat de kleur twee keer hardcoded staat.
    const svg = svgIcoon(icoon, "currentColor", 17);
    if (svg) knop.appendChild(svg);
    else knop.textContent = terugval;
  }
}

function icoonGrootte(e) {
  const st = e.style || {};
  for (const k of [st["--mdc-icon-size"], st["font-size"]]) {
    if (!k) continue;
    if (/vw/i.test(k)) return Math.max(5, vwPx(k));
    const n = parseFloat(k);
    if (/px/i.test(k) && isFinite(n)) return Math.max(5, n);
    if (/em|rem/i.test(k) && isFinite(n)) return Math.max(5, n * 14);
    // Een percentage is 1,2 keer de bovenliggende lettergrootte, niet 120 keer
    // de viewport-eenheid. Zonder deze regel werd `font-size: 120%` een
    // lettergrootte van 6720px en groeide de laag tot 247300px hoog.
    if (/%$/.test(k) && isFinite(n)) return Math.max(5, (n / 100) * 14);
    if (isFinite(n) && n > 0) return Math.max(5, n * vwEenheid());
  }
  return 18;
}

/* ---------- tekenen ---------- */

function tekenAlles() {
  const vlak = el("vlak");
  vlak.querySelectorAll(".el, .groep-kader, .groep-etiket, .hint-leeg").forEach(n => n.remove());
  if (STAAT.kaart) {
    if (el("toon-groepen").checked) tekenGroepen(vlak);
    tekenElementen(vlak, STAAT.kaart.elements || []);
  } else {
    // Een verdieping zonder kaart: niets om te tekenen, maar niet zonder uitleg.
    const hint = document.createElement("div");
    hint.className = "vakje hint-leeg";
    hint.textContent = 'Deze verdieping heeft nog geen kaart. Druk op de + naast "verdiep" ' +
      "om er een te maken — daarna kunt u hier elementen plaatsen.";
    hint.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
      "padding:10px 14px;font-size:12px;line-height:1.5;max-width:72%";
    vlak.appendChild(hint);
  }
  // De achtergrond van dít verdiep: die hoort bij de kaart die nu open is, dus
  // bij een wissel moet hij meeveranderen. Zonder dit bleef de foto van het
  // vorige verdiep staan — mét z'n kamers erop, en dan lijkt het alsof de zones
  // van de vorige verdieping zijn blijven hangen terwijl ze wel netjes waren
  // vervangen.
  pasVlakAan();
  el("ondergrond").style.display = el("toon-achtergrond").checked ? "" : "none";
  tekenZoneLagen();
  tekenLijst();
  tekenInspector();
}

/* Dotted kaders rond elke `conditional`. Zonder dit lijkt de plattegrond 157
   losse dingen in plaats van 112 losse dingen en 45 groepjes. De kader loopt
   rond de kinderen die ergens staan; de brede lagen van 100% zouden het hele
   vlak opslurven en dan zeggen ze niets. */
function tekenGroepen(vlak) {
  vlak.querySelectorAll(".groep-kader, .groep-etiket").forEach(n => n.remove());
  const mag = zichtbaarVoorZone(STAAT.zone);
  const loopG = (lijst) => (lijst || []).forEach(e => {
    if (e.type === "conditional" && e.elements) {
      // Een groep waarvan niets overblijft: geen stippellijn en geen etiket.
      const kinderen = e.elements.filter(k => mag(k));
      if (!kinderen.length) { loopG(e.elements); return; }
      const doos = omhullende(kinderen);
      if (doos) {
        const d = document.createElement("div");
        d.className = "groep-kader";
        if (voorwaardeUit(e)) d.classList.add("uit");
        Object.assign(d.style, {
          left: doos.l + "%", top: doos.t + "%",
          width: doos.b + "%", height: doos.h + "%",
        });
        vlak.appendChild(d);
        const t = document.createElement("div");
        t.className = "groep-etiket";
        if (voorwaardeUit(e)) t.classList.add("uit");
        t.style.left = doos.l + "%";
        t.style.top = doos.t + "%";
        t.textContent = naamVan(e);
        vlak.appendChild(t);
      }
      loopG(e.elements);
    }
  });
  loopG(STAAT.kaart ? STAAT.kaart.elements : []);
}

/* Het omhullende van een stuk posities. Accepteert twee soorten invoer:
   echte elementen (dan komt links/boven/breedte uit `style`) en kale
   {l, t, b}-stukken, zoals `vlakVanZone` die opbouwt. Die twee door elkaar
   gebruiken lijkt handig maar leidt stil tot de valkuil dat `k.style` undefined
   is: elk stuk valt dan terug op de default 50% en de hele groep klapt in het
   midden van de plattegrond. */
function omhullende(kinderen) {
  const stukken = [];
  for (const k of kinderen || []) {
    const st = k.style || k;
    const b = parseFloat(st.width ?? st.b ?? "0");
    const l = parseFloat(st.left ?? st.l ?? "50");
    const t = parseFloat(st.top ?? st.t ?? "50");
    if (!isFinite(l) || !isFinite(t)) continue;
    if (b >= 99) continue;          // een volledige laag zegt niets over de groep
    stukken.push({ l, t, b: b || 4 });
  }
  if (!stukken.length) return null;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const s of stukken) {
    x0 = Math.min(x0, s.l - s.b / 2); x1 = Math.max(x1, s.l + s.b / 2);
    y0 = Math.min(y0, s.t - s.b / 2); y1 = Math.max(y1, s.t + s.b / 2);
  }
  const p = 1.5;
  return {
    l: ((x0 + x1) / 2).toFixed(2),
    t: ((y0 + y1) / 2).toFixed(2),
    b: Math.max(3, x1 - x0 + p * 2).toFixed(2),
    h: Math.max(3, y1 - y0 + p * 2).toFixed(2),
  };
}

function tekenElementen(vlak, lijst) {
  const mag = zichtbaarVoorZone(STAAT.zone);
  for (const e of lijst || []) {
    const sleutel = sleutelVan(e);
    const verborgen = STAAT.verborgen.has(sleutel);
    // Een `conditional` is een doos met daarin kinderen, geen plaatje. Zonder
    // stijl heeft hij geen eigen plek; 45 van die zouden als één ophoping in het
    // midden landen. De stippellijn eromheen en de lijst volstaan.
    const groep = e.type === "conditional" && !e.style;
    if (!verborgen && !groep && mag(e)) vlak.appendChild(maakDoos(e));
    if (e.elements) tekenElementen(vlak, e.elements);
  }
}

function maakDoos(e) {
  const st = e.style || {};
  const doos = document.createElement("div");
  doos.className = "el";
  doos.style.left = st.left == null ? "50%" : st.left;
  doos.style.top = st.top == null ? "50%" : st.top;
  if (st.width != null) doos.style.width = st.width;
  // Een eigen `transform` verdringt het gecentreerd zetten; dat is ook zo in
  // de echte kaart, dus ik neem het gewoon over.
  if (st.transform) doos.style.transform = cssWaarde(st.transform);

  for (const [k, v] of Object.entries(st)) {
    if (k === "left" || k === "top" || k === "width" || k === "transform") continue;
    doos.style.setProperty(k, cssWaarde(v));
  }

  const breed = parseFloat(st.width || "0");
  const w = STAAT.weergave;
  if (w.alleenKaders) {
    doos.classList.add("kader");
    if (breed >= 99) doos.classList.add("breed");
  } else if (w.naamvak) {
    doos.appendChild(vakje(e, true));
  } else {
    tekenEchteInhoud(e, doos);
    if (breed >= 99) doos.classList.add("breed");
  }

  if (STAAT.selektie.has(e)) doos.classList.add("geselecteerd");
  if (voorwaardeUit(e)) {
    // De 34 pictogrammen hebben zelf een `filter` in hun stijl. Die wint van een
    // klasse, dus dan alleen de transparantie aanpassen en de filter met rust
    // laten — anders verander ik er iets in wat u zelf heeft ingesteld.
    doos.classList.add(st && st.filter ? "uit-f" : "uit");
  }

  doos.__element = e;
  maakVersleepbaar(doos, e);
  // In de schaal- of draaistand zitten de grepen in het element zelf.
  if (STAAT.grepen && STAAT.grepen.e === e) grepenTeken(doos, e, STAAT.grepen.modus);
  doos.title = `${naamVan(e)}\n${e.type}${e.entity ? " · " + e.entity : ""} · sleutel ${sleutelVan(e)}`;
  // Rechtermuisklik op het element zelf: hetzelfde menu als in de boom. Eerst
  // het menu, dan pas selecteren — selecteren tekent opnieuw en dat mag het
  // menu niet meteen weer weghalen.
  doos.oncontextmenu = ev => {
    ev.preventDefault();
    ev.stopPropagation();
    contextMenu(ev, naamVan(e), elementMenuItems(e));
    if (!STAAT.selektie.has(e)) selecteer(e);
  };
  // Dubbelklik opent het inspectievenster (een enkele klik selecteert alleen).
  doos.ondblclick = ev => {
    ev.preventDefault();
    ev.stopPropagation();
    selecteer(e);
    inspectorZet(true);
  };
  return doos;
}

/* ---------- camera's ---------- */

/* De camera's zijn `state-icon`, maar in de echte kaart staat daar geen
   pictogram naast: card_mod vergroot de `state-badge` tot 80×50 met een
   afgeronde hoek (één van 40×25), en dít is het venster dat u moet raken.
   Twee camera's hebben `--mdc-icon-size: 10px` — als icoon zijn ze dus
   nauwelijks te zien en al helemaal niet te plaatsen.

   Eerst het kader op de juiste maat: dat alleen maakt plaatsen al mogelijk en
   het werkt zonder verbinding. Daarna, als `camera-beelden` aanstaat, één
   momentopname van Home Assistant erin. Lukt dat niet — geen token, offline,
   camera onbereikbaar — dan blijft het icoon staan. */
function isCamera(e) {
  return String(e.entity || "").split(".")[0] === "camera";
}

/* Wat card_mod met de badge heeft gedaan: breedte, hoogte en de ronding.
   Alleen px is te lezen (de vijf camera's zijn dat allemaal); anders valt het
   terug op een maat die uit het icoon volgt. */
function badgeMaat(e) {
  const cm = e.card_mod;
  const css = typeof cm === "string" ? cm : (cm && cm.style);
  if (!css || typeof css !== "string") return null;
  // `(?:^|[{;\s])` voorkomt dat `min-width: 40px` als `width` wordt gelezen.
  const b = /(?:^|[{;\s])width:\s*([0-9.]+)px/.exec(css);
  const h = /(?:^|[{;\s])height:\s*([0-9.]+)px/.exec(css);
  if (!b || !h) return null;
  const r = /border-radius:\s*([^;}\n]+)/.exec(css);
  return {
    breedte: parseFloat(b[1]),
    hoogte: parseFloat(h[1]),
    radius: r ? r[1].trim() : "10%",
  };
}

/* Eén momentopname per camera, opgehaald met het token uit de ⚙-instellingen
   en bewaard als objectURL in het geheugen. Het beeld gaat nergens heen en
   komt niet in de export, net als het token. Zonder instellingen wordt er
   niets bewaard, zodat het alsnog lukt zodra u het token heeft ingevuld. */
const cameraBeelden = new Map();

function cameraBeeld(entity) {
  if (!entity) return Promise.resolve(null);
  if (cameraBeelden.has(entity)) return cameraBeelden.get(entity);
  const inst = haInstelling();
  if (!inst.url || !inst.token) return Promise.resolve(null);
  const belofte = (async () => {
    try {
      const r = await fetch(
        `${inst.url.replace(/\/+$/, "")}/api/camera_proxy/${entity}`,
        { headers: { Authorization: `Bearer ${inst.token}` } });
      if (!r.ok) return null;
      return URL.createObjectURL(await r.blob());
    } catch (_) { return null; }
  })();
  cameraBeelden.set(entity, belofte);
  return belofte;
}

function tekenCamera(e, doos, { naam, kleur }) {
  const m = badgeMaat(e);
  // Zonder card_mod: een standaardkader, zodat er altijd iets staat om te
  // plaatsen.
  const breedte = m ? m.breedte : 60;
  const hoogte = m ? m.hoogte : breedte;
  doos.style.width = breedte + "px";
  doos.style.height = hoogte + "px";

  const kader = document.createElement("div");
  kader.className = "camera-kader";
  kader.style.borderRadius = (m && m.radius) || "10%";
  if (STAAT.weergave.icoon) {
    // Bewust níét het `--mdc-icon-size`: dat is 10px bij twee camera's en in
    // een venster van 80×50 is dan niets te zien. Het icoon dient hier als
    // terugval en als herkenning, niet als maat.
    const s = Math.min(40, Math.max(10, Math.min(breedte, hoogte) * 0.45));
    const ico = naam ? svgIcoon(naam, kleur, s) : null;
    kader.appendChild(ico || vakje(e, false));
  }
  doos.appendChild(kader);

  if (!STAAT.weergave.cameraBeelden) return;
  cameraBeeld(e.entity).then(bron => {
    // Het vlak kan inmiddels opnieuw getekend zijn; dat beeld hoort dan bij
    // een doos die weg is.
    if (!bron || !doos.isConnected) return;
    const img = document.createElement("img");
    img.src = bron;
    img.alt = "";
    kader.replaceChildren(img);
  });
}

/* Stand `icoon`: zo dicht mogelijk bij wat u in Home Assistant ziet. */
function tekenEchteInhoud(e, doos) {
  // Uitgevinkt betekent: deze soort niet tekenen, maar de plek blijft wel
  // bestaan (de doos), zodat u het element nog kunt aanklikken en schuiven.
  const w = STAAT.weergave;
  const beeld = isAfbeelding(e);
  // Een camera telt mee zónder dat het pictogram aanstaat: het kader op maat
  // is op zichzelf al genoeg om te kunnen plaatsen, en met `camera-beelden`
  // aan is het de foto die u zoekt.
  const camera = !beeld && isCamera(e);
  if (camera ? !(w.icoon || w.cameraBeelden)
             : (beeld ? !w.afbeelding : !w.icoon)) return;

  if (beeld) {
    const bron = pad(e.image || e.state_image.on);
    // Geen bestandsnaam te maken (het beeld hangt van Home Assistant af)? Dan
    // vraagt de editor niets op, en tonen we de naam zodat het element zichtbaar
    // en aanklikbaar blijft.
    if (!bron) {
      const v = vakje(e, false);
      v.title = "het beeld van dit element hangt van Home Assistant af — " +
        "de editor kan die uitdrukking niet uitrekenen";
      doos.appendChild(v);
      return;
    }
    const img = document.createElement("img");
    img.src = bron;
    img.alt = "";
    // Precies zoals de kaart: `hui-image` zet `width: 100%`, `height: 100%` en
    // `object-fit: cover`. Staat er dus een hoogte in de stijl, dan vult het beeld
    // die doos en wordt het bijgesneden — het rekt niet mee. Zonder hoogte houdt
    // de afbeelding haar eigen verhouding (`height: auto`), net als op de kaart.
    img.style.width = "100%";
    img.style.height = e.style && e.style.height != null ? "100%" : "auto";
    img.style.objectFit = e.style && e.style.height != null ? "cover" : "";
    img.onerror = () => {
      const v = vakje(e, false);
      v.textContent = "afbeelding onbekend";
      img.replaceWith(v);
    };
    doos.appendChild(img);
    return;
  }

  const naam = icoonVan(e);
  const px = icoonGrootte(e);
  const { kleur } = kleurVan(e, "#ffffff");

  if (camera) { tekenCamera(e, doos, { naam, kleur }); return; }

  if (e.type === "custom:gauge-card") {
    const r = document.createElement("div");
    r.className = "rond";
    r.style.width = r.style.height = Math.max(16, px * 1.6) + "px";
    r.style.color = kleur;
    const naald = document.createElement("div");
    naald.style.cssText = "width:2px;height:50%;background:currentColor;margin-bottom:50%;opacity:.7";
    r.appendChild(naald);
    doos.appendChild(r);
    return;
  }

  if (e.type === "custom:button-card") {
    const v = document.createElement("div");
    v.className = "vakje groot";
    v.style.flexDirection = "column";
    v.style.gap = "1px";
    const ico = naam ? svgIcoon(naam, kleur, Math.max(8, px * 0.8)) : null;
    if (ico) v.appendChild(ico);
    if (e.show_name !== false) {
      const t = document.createElement("span");
      t.style.fontSize = "9px";
      t.textContent = e.name || entitynaam(e).split(".").pop().replace(/_/g, " ");
      v.appendChild(t);
    }
    doos.appendChild(v);
    return;
  }

  if (e.type === "state-label") {
    const t = document.createElement("div");
    t.className = "vakje";
    t.style.fontSize = Math.max(7, px) + "px";
    t.style.background = "none";
    t.style.color = kleurVan(e, "#e8eef5").kleur;
    t.textContent = labeltekst(e);
    doos.appendChild(t);
    return;
  }

  // Badge, icoon, state-icon: een icoon in de kleur van het element. Een badge
  // zonder titel (14 van de 15) is in de echte kaart een gekleurde cirkel, dus
  // zo teken ik hem ook.
  const zonderTitel = e.type === "state-badge" &&
    String((e.style || {})["--ha-label-badge-title-font-size"]) === "0em";
  if (zonderTitel) {
    const s = Math.max(9, px * 1.5);
    doos.style.width = s + "px";
    doos.style.height = s + "px";
    const cirkel = document.createElement("div");
    cirkel.style.cssText = `width:100%;height:100%;border-radius:50%;border:2px solid ${kleur};display:flex;align-items:center;justify-content:center`;
    const ico = naam ? svgIcoon(naam, kleur, s * 0.55) : null;
    if (ico) cirkel.appendChild(ico);
    doos.appendChild(cirkel);
    return;
  }

  const ico = naam ? svgIcoon(naam, kleur, px) : null;
  if (ico) { doos.appendChild(ico); return; }

  // We weten het icoon niet — dan een vraagteken op de plek, in plaats van een
  // tekstvak dat de plattegrond vol zet. De naam staat in de tooltip (en in de
  // boom links), dus er gaat niets verloren. Alleen als zelfs dát icoon
  // ontbreekt valt het terug op tekst.
  const vraag = svgIcoon("mdi:help-circle-outline", kleur, px);
  doos.appendChild(vraag || vakje(e, false));
}

function entitynaam(e) { return String(e.entity || ""); }

function vakje(e, groot) {
  const v = document.createElement("div");
  v.className = "vakje" + (groot ? " groot" : "");
  v.textContent = naamVan(e);
  return v;
}

/* Korte, leesbare naam. Liever geen moeilijke dingen tonen: dit is een
   plattegrond, geen debugger. */
function naamVan(e) {
  if (e.name) return String(e.name);
  if (e.entity) return String(e.entity).split(".").pop().replace(/_/g, " ");
  if (e.conditions && e.conditions[0].entity) {
    return "als " + String(e.conditions[0].entity).split(".").pop();
  }
  if (e.icon && !String(e.icon).includes("mdi:")) return String(e.icon);
  if (e.icon) return String(e.icon).replace("mdi:", "");
  if (e.image) {
    const k = takken(e.image);
    const z = k.find(x => !ONZICHTBAAR.test(x)) || k[0];
    return String(z).replace(/vars\[0\]\s*\+\s*/, "").replace(/["']/g, "").split("/").pop();
  }
  if (e.state_image) return e.entity ? String(e.entity).split(".").pop() : "state-image";
  return e.type;
}

/* Een element met breedte 100% is een volledige transparante laag. Daarvan
   verplaatsen is zinloos — de laag bedekt de hele kaart. */
function isVerschuifbaar(e) {
  return parseFloat((e.style || {}).width || "0") < 99;
}

function grenzen() {
  const vlak = el("vlak").getBoundingClientRect();
  return vlak.width ? vlak : { width: 1, height: 1 };
}

/* ---------- verslepen ---------- */

/* Alle dozen van het vlak bij elkaar, zodat ik een element kan terugvinden
   zonder het vlak steeds opnieuw door te lopen. */
function dozen() {
  const kaart = new Map();
  el("vlak").querySelectorAll(".el").forEach(doos => {
    if (doos.__element) kaart.set(doos.__element, doos);
  });
  return kaart;
}

function maakVersleepbaar(doos, e) {
  if (!isVerschuifbaar(e)) { doos.classList.add("niet-verplaatsbaar"); return; }
  doos.classList.add("versleepbaar");
  doos.addEventListener("pointerdown", ev => {
    if (ev.button !== 0) return;
    // In de panstand hoort een sleep op een element het beeld te verplaatsen,
    // niet het element. Wij doen dan niets, en het vlak pánt eronder door.
    if (STAAT.greep !== "select") return;
    ev.preventDefault();
    ev.stopPropagation();

    // Een element dat al geselecteerd is neemt de hele groep mee; een nieuw
    // element wordt eerst de enige selectie. Met shift/ctrl/cmd telt de klik
    // als tellen bij de groep — zo kiest u er meerdere in de selectiestand.
    const meerdere = ev.shiftKey || ev.ctrlKey || ev.metaKey;
    if (meerdere) selecteer(e, true);
    else if (!STAAT.selektie.has(e)) selecteer(e);
    // Als het tellen het element juist uit de groep heeft gehaald, sleep je het
    // niet mee — anders gebeurt er iets anders dan u gevraagd heeft.
    const inGroep = STAAT.selektie.has(e);
    const groep = inGroep ? geselecteerdVerplaatsbaar() : [];
    if (!groep.length && inGroep) groep.push(e);

    const vlak = grenzen();
    const startX = ev.clientX, startY = ev.clientY;
    const kaart = dozen();
    const begin = groep.map(x => {
      const st = x.style || (x.style = {});
      return { e: x, st, l: parseFloat(st.left ?? 50), t: parseFloat(st.top ?? 50), doos: kaart.get(x) };
    });
    // Vastpakken kan mislukken bij een gesimuleerde of al vrijgegeven
    // aanwijzer. Dat mag het slepen niet afbreken.
    try { doos.setPointerCapture(ev.pointerId); } catch (_) { /* niet erg */ }
    for (const b of begin) if (b.doos) b.doos.classList.add("slepend");
    let verplaatst = false;

    const zet = (x, y) => {
      // Eén keer rekenen, en dezelfde verschuiving op elk element: anders
      // loopt de groep bij het afronden van de percentages uiteen.
      const dx = ((x - startX) / vlak.width) * 100;
      const dy = ((y - startY) / vlak.height) * 100;
      for (const b of begin) {
        const l = Math.min(100, Math.max(0, b.l + dx));
        const t = Math.min(100, Math.max(0, b.t + dy));
        b.st.left = +l.toFixed(2) + "%";
        b.st.top = +t.toFixed(2) + "%";
        if (b.doos) { b.doos.style.left = b.st.left; b.doos.style.top = b.st.top; }
      }
      verplaatst = true;
      toonPositie(e, true);
    };

    const op = ev2 => zet(ev2.clientX, ev2.clientY);
    const einde = () => {
      doos.removeEventListener("pointermove", op);
      doos.removeEventListener("pointerup", einde);
      doos.removeEventListener("pointercancel", einde);
      for (const b of begin) if (b.doos) b.doos.classList.remove("slepend");
      if (verplaatst) {
        onthoud();
        tekenGroepen(el("vlak"));
        tekenInspector();
        toonPositie(e, false);
      }
    };
    doos.addEventListener("pointermove", op);
    doos.addEventListener("pointerup", einde);
    doos.addEventListener("pointercancel", einde);
  });
}

/* Wat er uit de selectie wél kan schuiven. Een laag van 100% breedte niet —
   die bedekt de hele kaart en zou het plan meeslepen. */
function geselecteerdVerplaatsbaar() {
  return [...STAAT.selektie].filter(isVerschuifbaar);
}

/* Het beeld met de hand verplaatsen. Een klik zonder beweging is géén
   verschuiving: dan kiezen we het element waarop u tikte. Zo kunt u in de
   panstand toch elementen kiezen, zonder dat u per ongeluk iets verplaatst. */
function panVast(ev, kandidaat, toevoegen) {
  const werk = el("werkgebied");
  const l0 = werk.scrollLeft, b0 = werk.scrollTop;
  const x0 = ev.clientX, y0 = ev.clientY;
  let verplaatst = false;
  el("vlak").classList.add("pant");

  const op = ev2 => {
    const dx = ev2.clientX - x0, dy = ev2.clientY - y0;
    if (!verplaatst && Math.hypot(dx, dy) < 4) return;   // een trilling is geen sleep
    verplaatst = true;
    werk.scrollLeft = l0 - dx;
    werk.scrollTop = b0 - dy;
  };
  const einde = () => {
    document.removeEventListener("pointermove", op);
    document.removeEventListener("pointerup", einde);
    document.removeEventListener("pointercancel", einde);
    // Alleen `pant` weghalen: `knijp` hoort bij de gekozen stand, niet bij het
    // slepen, en die zou hier anders onterecht verdwijnen.
    el("vlak").classList.remove("pant");
    // In de panstand kiest u niets: klikken verplaatst alleen het beeld. Kiezen
    // hoort bij de selectiestand, en gebeurt daar ook op een element dat niet
    // mag schuiven (een achtergrondlaag) of op het lege vlak.
    if (!verplaatst && kandidaat && STAAT.greep === "select") selecteer(kandidaat, toevoegen);
  };
  document.addEventListener("pointermove", op);
  document.addEventListener("pointerup", einde);
  document.addEventListener("pointercancel", einde);
}

/* Pijltjestoetsen: een halve procent per tik. Precies genoeg om een
   ongeveer-positie echt goed te krijgen. */
function verplaatsMetPijl(e, dx, dy) {
  if (!isVerschuifbaar(e)) return;
  const groep = STAAT.selektie.has(e) ? geselecteerdVerplaatsbaar() : [];
  if (!groep.length) groep.push(e);
  onthoud();
  const naar = (nu, stap) => Math.min(100, Math.max(0, +(parseFloat(nu ?? 50) + stap).toFixed(2)));
  for (const x of groep) {
    const st = x.style || (x.style = {});
    st.left = naar(st.left, dx) + "%";
    st.top = naar(st.top, dy) + "%";
  }
  tekenAlles();
  if (groep.length > 1) meldSelektie();
}

/* ---------- de positieregel onder de knoppen ---------- */

function toonPositie(e, bezig) {
  const balk = el("positie");
  if (!e) { balk.textContent = "geen element gekozen"; return; }
  const st = e.style || {};
  const deel = (k, v) => v == null ? "50%" : String(v);
  balk.innerHTML =
    `${naamVan(e)} <span class="geldig">${bezig ? "← bezig" : ""}</span> ` +
    `· sleutel ${sleutelVan(e)} · links ${deel("left", st.left)} · boven ${deel("top", st.top)}` +
    (st.width != null ? ` · breedte ${st.width}` : "");
}

/* ---------- geschiedenis ----------

   Eén stap is méér dan alleen het document: de zonevormen horen erbij, want
   die verandert u met de muis en ze staan even zo goed in de weg. Zonder dat
   zou ↶ na het aanpassen van een contour zeggen dat er niets is om ongedaan te
   maken. */
function huidigeStaat() {
  return {
    doc: JSON.stringify(STAAT.doc),
    zone: JSON.stringify(STAAT.zoneKader),
  };
}

/* `vooraf` is er voor het slepen van een contour: die gaat al mee terwijl u
   trekt, dus de stand van vóór de handeling moet aan het begin bewaard worden
