<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plattegrond-editor · prototype</title>
<!-- Hetzelfde icoon als de integratie: het blauwe vierkant, uitgesneden uit
     logo_2dfloorplan.jpeg en met een transparante achtergrond. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --achtergrond: #14161a;
    --paneel: #1d2026;
    --paneel-hoger: #262a32;
    --lijn: #333944;
    --tekst: #dfe3ea;
    --tekst-dim: #8d95a5;
    --accent: #4aa3df;
    --accent-dim: #2c6f9e;
    --waarschuwing: #d9a441;
    --gevaarlijk: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--achtergrond); color: var(--tekst);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 7px 12px; background: var(--paneel);
    border-bottom: 1px solid var(--lijn); flex: none; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .waarschuwing {
    color: var(--waarschuwing); font-size: 12.5px;
    border: 1px solid #5c4a20; background: #2b2417;
    padding: 3px 9px; border-radius: 4px;
  }
  header .groep {
    display: flex; align-items: center; gap: 6px;
    padding-right: 12px; border-right: 1px solid var(--lijn);
  }
  header .groep:last-child { border-right: none; }
  header label { font-size: 12px; color: var(--tekst-dim); white-space: nowrap; }
  #zoom-label {
    min-width: 46px; text-align: center; font-size: 12px;
    color: var(--tekst); font-variant-numeric: tabular-nums;
  }
  #knop-zoom-uit, #knop-zoom-in { width: 30px; font-size: 16px; line-height: 1; padding: 3px 0; }

  /* De twee gereedschapsknoppen: kleine icoonknoppen, geen tekst. */
  .gereedschap { gap: 3px; }
  .gereedschap button {
    width: 30px; height: 27px; padding: 0; display: flex;
    align-items: center; justify-content: center;
  }
  .gereedschap button svg { display: block; width: 17px; height: 17px; }
  .gereedschap button.aan { background: var(--accent-dim); border-color: var(--accent); }
  /* Deze knoppenrij begint altijd op een eigen regel, ook als het venster breed
     genoeg is: `flex-basis: 100%` past niet naast de rest, dus wikkelt de kop
     hem naar de volgende regel. Zonder dit schoof de rij bij elke versmalling
     heen en weer en stonden de knoppen telkens ergens anders. */
  header .eigen-regel { flex: 0 0 100%; }
  /* Vaste lege ruimte in de knoppenrij: houdt de plaats vrij tussen de
     gereedschapsknoppen en Ongedaan, en tussen Ongedaan en Herstellen. */
  header .groep .spacer { width: 18px; flex: none; }
  /* Downloaden kan geen kwaad, overschrijven wel — daarom een andere rand
     voor de knop die in Home Assistant zelf schrijft. */
  .gereedschap button.gevaar { border-color: var(--waarschuwing); color: var(--waarschuwing); }
  .gereedschap button.gevaar:hover { background: #2b2417; }

  /* Bevestiging voor het wegschrijven. Het venster toont eerst wát er
     verandert; pas na "ja" gaat het op. Zonder dit zou één verkeerde klik
     het echte dashboard overschrijven.

     Het moet óók boven de bediening uitkomen, niet alleen boven de
     plattegrond: het uitklapmenu 'weergave' staat op 700. De plattegrond
     maakt intussen (via `isolation: isolate` op `#vlak`) een eigen
     stapelcontext, dus de zone-laag (9600), een slepend element (9500) en de
     selectie (9000) blijven binnen `#vlak` — en 10000 ligt boven dat allemaal. */
  .bevestig {
    position: fixed; inset: 0; z-index: 10000; background: #000b;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .bevestig .venster {
    background: var(--paneel); border: 1px solid var(--lijn); border-radius: 6px;
    width: min(780px, 100%); max-height: 86vh; box-shadow: 0 14px 46px #000c;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;
    /* Drie lijsten van 300px boven elkaar zijn al hoger dan dit venster. Zonder
       scrollen stonden de knoppen buiten beeld en was er niets om op te
       drukken — het venster zelf moet dus mee kunnen bewegen. */
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .bevestig h3 { margin: 0; font-size: 14px; }
  .bevestig .veld { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .bevestig .veld > span { color: var(--tekst-dim); }
  .bevestig .veld input, .bevestig .veld select { width: 100%; }
  .bevestig .veld .let-op { color: var(--waarschuwing); font-size: 11.5px; }
  .bevestig .rij {
    display: flex; gap: 8px; justify-content: flex-end; align-items: center;
    /* De knoppen blijven onderin plakken, zodat ze ook bij een lange lijst
       meteen bereikbaar zijn — zonder te hoeven zoeken naar het einde. */
    position: sticky; bottom: 0;
    background: var(--paneel);
    box-shadow: 0 -12px 14px -8px var(--paneel);
  }
  .bevestig .rij .links { margin-right: auto; font-size: 11.5px; color: var(--tekst-dim); }
  .bevestig .rij button { min-width: 130px; }
  .bevestig .weg { color: var(--gevaarlijk); }
  .bevestig .bij { color: #7fe3a0; }
  .bevestig .gewijzigd { color: var(--waarschuwing); }

  /* Het uitklapmenu 'weergave'. Alle manieren van tonen staan hier apart aan
     of uit, zodat u er geen van hoeft te verruilen voor een ander. */
  .uitklap { position: relative; }
  .uitklap summary {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 9px; font-size: 12px; color: var(--tekst-dim);
    border: 1px solid var(--lijn); border-radius: 4px;
    background: var(--paneel-hoger); cursor: pointer; list-style: none;
    white-space: nowrap;
  }
  .uitklap summary::-webkit-details-marker { display: none; }
  .uitklap summary:hover { border-color: var(--accent-dim); color: var(--tekst); }
  .uitklap[open] summary { background: var(--accent-dim); border-color: var(--accent); color: var(--tekst); }
  .uitklap .paneel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 700;
    display: flex; flex-direction: column; gap: 5px;
    min-width: 235px; padding: 8px 9px;
    background: var(--paneel-hoger); border: 1px solid var(--lijn);
    border-radius: 6px; box-shadow: 0 12px 34px #000b;
  }
  .uitklap .paneel label {
    display: flex; gap: 7px; align-items: center;
    font-size: 12.5px; color: var(--tekst); white-space: normal;
    cursor: pointer; line-height: 1.35;
  }
  .uitklap .paneel input[type="checkbox"] { margin: 0; flex: none; }
  .uitklap .paneel hr { border: 0; border-top: 1px solid var(--lijn); margin: 2px 0; width: 100%; }
  .uitklap .paneel .sub {
    display: flex; gap: 6px; align-items: center;
    padding-left: 24px; font-size: 12px; color: var(--tekst-dim);
  }
  .uitklap .paneel .sub input[type="range"] { width: 74px; }
  .uitklap .paneel .sub .tag { padding-left: 0; }

  main { display: flex; flex: 1; min-height: 0; position: relative; }

  aside {
    width: 320px; flex: none; background: var(--paneel);
    border-right: 1px solid var(--lijn);
    display: flex; flex-direction: column; min-height: 0;
  }
  /* De twee linker balken staan naast elkaar: apparaten/entiteiten links,
     de filter met de boom ernaast. */
  aside.toevoegen, aside.lijst { width: 300px; }
  aside.verborgen { display: none; }

  .sectie {
    padding: 9px 12px; border-bottom: 1px solid var(--lijn);
    display: flex; flex-direction: column; gap: 7px; min-height: 0;
  }
  .sectie > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--tekst-dim); margin: 0; font-weight: 600;
  }
  /* Een balkkop met een kruisje erin. Sluiten doet hetzelfde als de knop in de
     gereedschapsbalk, dus de balk is altijd weer terug te halen. */
  .sectie-kop {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sectie-kop > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--tekst-dim); margin: 0; font-weight: 600;
  }
  .paneel-sluit { min-width: 22px; padding: 0 5px; line-height: 1.25; }
  /* De stijlkeuze voor de voorwerpen staat alleen bij die lijst. */
  #voorwerp-stijl-vak.verborgen { display: none; }
  #voorwerp-stijl { max-width: 190px; }
  .sectie.rooster { flex: 1; overflow-y: auto; gap: 3px; }
  .legenda { font-size: 11.5px; color: var(--tekst-dim); }

  /* De lijst verwijzingen: één regel per plek in het document, met de
     sleutel van het element ervoor. Klikken selecteert dat element. */
  .plekken {
    display: flex; flex-direction: column; gap: 3px;
    max-height: 190px; overflow: auto;
  }
  .plekken .leeg { font-style: italic; font-size: 11.5px; color: var(--tekst-dim); }
  .plek {
    display: flex; gap: 6px; align-items: baseline;
    font-size: 11.5px; color: var(--tekst-dim);
    padding: 2px 4px; border: 1px solid transparent; border-radius: 3px;
    cursor: pointer; text-align: left; width: 100%;
  }
  .plek:hover { background: var(--paneel-hoger); border-color: var(--lijn); color: var(--tekst); }
  .plek .tag { flex: none; }
  .plek.niet-klikbaar { cursor: default; }
  .plek.niet-klikbaar:hover { background: none; border-color: transparent; color: var(--tekst-dim); }

  input, select, button, textarea {
    font: inherit; color: var(--tekst); background: var(--paneel-hoger);
    border: 1px solid var(--lijn); border-radius: 4px; padding: 5px 8px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent-dim); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent-dim); }
  button.primary { background: var(--accent-dim); border-color: var(--accent); }
  button.gevaarlijk:hover { border-color: var(--gevaarlijk); color: var(--gevaarlijk); }
  /* Alleen voor de vervangknop: grijs en geen klikbare muis zolang er niet
     beide velden ingevuld staan, zodat "waarom doet hij niets" geen vraag is. */
  #i-vervang-knop:disabled { opacity: .4; cursor: not-allowed; }
  #i-vervang-knop:disabled:hover { border-color: var(--lijn); }

  .rij { display: flex; gap: 6px; align-items: center; }
  .rij > * { min-width: 0; }
  .rij .groeit { flex: 1; }

  /* De twee lijstjes links onder elkaar: apparaten of entities. */
  button.aan { background: var(--accent-dim); border-color: var(--accent); color: var(--tekst); }
  /* De vier lijstknoppen erboven: alleen een icoon, de naam staat in de
     tooltip. Vaste maat in plaats van groeien, zodat ze samen op één smal
     rijtje passen — de lijst eronder houdt daardoor alle breedte. */
  .rij.modus { gap: 5px; }
  .rij.modus button {
    width: 46px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rij.modus button svg { display: block; width: 18px; height: 18px; }
  label.klein {
    font-size: 11.5px; color: var(--tekst-dim);
    white-space: normal; line-height: 1.35; cursor: pointer;
  }
  label.klein input { margin: 0 5px 0 0; vertical-align: -1px; }
  /* De stand van het ophalen van de verdiepdata. Eén regel, altijd gezegd:
     een filter dat stilletjes uitziet ziet er precies uit als "er is niets". */
  .status-regel {
    font-size: 11px; color: var(--tekst-dim); line-height: 1.35; min-height: 1.35em;
  }
  /* Het rechtermuisklik-menu: klein en zwevend, en het sluit bij de eerste klik
     ernaast. Zo blijft de inspectie vrij voor het gewone werk. */
  #contextmenu {
    position: fixed; z-index: 80; min-width: 230px;
    background: var(--paneel-hoger); border: 1px solid var(--lijn);
    border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    padding: 4px; font-size: 12.5px;
  }
  #contextmenu .kop {
    padding: 4px 8px 6px; color: var(--tekst-dim); font-size: 11px;
    border-bottom: 1px solid var(--lijn); margin-bottom: 4px;
    overflow-wrap: anywhere;
  }
  #contextmenu button {
    display: block; width: 100%; text-align: left; padding: 6px 8px;
    background: none; border: 0; border-radius: 3px; color: var(--tekst);
    min-width: 0;
  }
  #contextmenu button:hover:not(:disabled) { background: var(--accent-dim); }
  #contextmenu button.uit { opacity: .45; }
  #contextmenu .klein { padding: 2px 8px 6px; color: var(--tekst-dim); font-size: 11px; }
  #contextmenu .scheiding { border-top: 1px solid var(--lijn); margin: 4px 6px; }

  /* Wat er na de lijst verschijnt: bij een apparaat de entity-keuze, bij een
     entity één knop. Allebei in dezelfde plaats, zodat de kolom niet springt. */
  #keuze-apparaat, #keuze-entiteit {
    display: flex; flex-direction: column; gap: 6px;
  }
  #keuze-apparaat.zoniet, #keuze-entiteit.zoniet { display: none; }
  #keuze-naam { white-space: normal; line-height: 1.35; }

  /* ---- de plattegrond ---- */
  #werkgebied { flex: 1; overflow: auto; padding: 18px; background: #191c21; }
  #vlak {
    position: relative; margin: 0 auto; background: #0e1013;
    box-shadow: 0 8px 40px #000a;
    /* Een eigen stapelcontext. De lagen ín de plattegrond dragen hoge waarden
       (zone 9600, slepend 9500, selectie 9000) en stonden dáárom in dezelfde
       stapel als de bediening ernaast: het uitklapmenu 'weergave' (700) werd
       dóór de zoellijnen heen getoond. Met `isolation` blijft alles binnen
       `#vlak` en kan de plattegrond nooit meer bedekken wat ernaast ligt. */
    isolation: isolate;
  }
  #ondergrond {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; pointer-events: none; user-select: none;
  }

  .el {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  /* Het chipje dat de muis volgt zodra u uit de lijst naar de plattegrond
     trekt. `pointer-events: none` zodat hij nooit tussen u en het vlak in
     kan zitten. */
  #sleep-ghost {
    position: fixed; z-index: 60; pointer-events: none;
    padding: 3px 8px; font-size: 11.5px; border-radius: 3px;
    background: var(--paneel-hoger); color: var(--tekst);
    border: 1px solid var(--accent-dim);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
  }
  body.sleept, body.sleept * {
    cursor: grabbing !important;
    user-select: none !important;
  }
  /* De stand op het vlak bepaalt de cursor overal — óók over de elementen.
     Zonder die id-voet wint een regel op het element zelf en ziet u halfweg
     een pijltje of een open handje in plaats van de hand die bij de stand hoort.
     De regels staan van zwak naar sterk. */
  #vlak { cursor: grab; touch-action: none; user-select: none; }
  #vlak .el { cursor: inherit; }
  #vlak .el.versleepbaar { cursor: grab; }
  #vlak .el.niet-verplaatsbaar { cursor: default; }
  /* Selectiestand: een verschuifbaar element laten zien dat het meegaat. */
  #vlak.knijp .el.versleepbaar { cursor: move; }
  #vlak.knijp .el.versleepbaar:hover { outline: 1px dashed var(--accent); outline-offset: 2px; }
  /* In de panstand is élk punt een handje, ook een element dat niet mag
     schuiven, en tijdens het slepen gaat de hand dicht. */
  #vlak.pant, #vlak.pant .el, #vlak.pant .el.versleepbaar { cursor: grabbing; }
  #vlak .el.versleepbaar.slepend { cursor: grabbing; z-index: 9500 !important; }
  .el.geselecteerd {
    outline: 2px solid var(--accent); outline-offset: 2px;
    box-shadow: 0 0 0 2px #0009, 0 0 16px #4aa3df80; z-index: 9000 !important;
  }
  /* In de stand 'uit de statussen' bepaalt de snapshot welke tak zichtbaar is.
     De rondjes per voorwaarde staan in de lijst, niet op het vlak, dus de klasse
     moet op `body` — anders zou de regel niets treffen. */
  body.uitstatussen .knopje { pointer-events: none; opacity: .4; }

  /* ---- de zone-laag ----
     Uw eigen achtergrondfoto heeft geen zoneverdeling: de kamers lopen in
     elkaar over. Zonder laag is er dus geen grens te zien. Elk zonevlak is
     een kadeer om de items van die kamer heen, met het naamlabel erboven.

     `pointer-events: none`, want de laag mag nooit een element onbereikbaar
     maken. De dikte en de kleur staan bovenaan in de balk. */
  #zonelagen { position: absolute; inset: 0; pointer-events: none; z-index: 9600; }
  /* De zone-laag tekent als SVG: een echte contour, zodat een kamer ook een
     andere vorm kan hebben dan een rechthoek. `fill: transparent` en nóóit
     `none` — alleen dan is de binnenkant van de contour aanklikbaar. */
  #zonelagen .zonesvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .zone-vak {
    fill: transparent;
    stroke: var(--zone-kleur, #7fe3a0);
    stroke-width: var(--zone-dikte, 2px);
    stroke-linejoin: round;
    /* Donkere sluier rond de lijn, zodat een kadeer op zowel een lichte als
       een donkere ondergrond leesbaar blijft — dezelfde opzet als de oude
       `box-shadow`, nu als SVG-filter. */
    filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 5px #000a);
  }
  .zone-vak.gekozen {
    fill: color-mix(in srgb, var(--zone-kleur, #7fe3a0) 14%, transparent);
  }
  .zone-vak.leeg { stroke-dasharray: 7 5; }
  .zone-etiket {
    position: absolute; left: 0; top: 0; transform: translate(0, -100%);
    padding: 1px 6px; border-radius: 4px 4px 0 0;
    background: var(--zone-kleur, #7fe3a0); color: #06131c;
    font: 600 11px/1.5 system-ui, sans-serif; white-space: nowrap;
  }
  /* Het etiket hangt boven het hoogste hoekpunt; bij een kamer die tegen de
     bovenrand zit (Toilet begint op 2%) zou het er buiten vallen en weg zijn.
     Dan net ín de contour, met de afgeronde hoek onderaan. */
  .zone-etiket.laag { transform: translate(0, 3px); border-radius: 0 0 4px 0; }
  /* En naar links uitgelijnd als het hoogste hoekpunt rechts staat — anders
     loopt het etiket voorbij de rand en wordt de ↺ erin afgekapt. */
  .zone-etiket.rechts { transform: translate(-100%, -100%); }
  .zone-etiket.rechts.laag { transform: translate(-100%, 3px); border-radius: 0 0 4px 0; }
  /* Zonekaders bewerken. Normaal staat de hele laag op `pointer-events: none`,
     zodat een kader nooit een element kan blokkeren. In die stand vangen de
     contouren wél klikken — eerst om zich te selecteren (pijl), en alleen het
     geselecteerde kader daarna om te verhuizen (hand), met hoekpunten die u
     kunt trekken en middenpunten die de zijde knippen. */
  #zonelagen.bewerken .zone-vak { pointer-events: auto; cursor: pointer; }
  #zonelagen.bewerken .zone-vak:hover { stroke: var(--accent); }
  #zonelagen.bewerken .zone-vak.actief {
    cursor: move; stroke: var(--accent);
    filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 6px #000a)
            drop-shadow(0 0 7px #4aa3df99);
  }
  #zonelagen.bewerken .zone-etiket { pointer-events: auto; }
  /* Hoekpunt: slepen. Middenpunt: zodra u het vastpakt knipt het de zijde
     in tweeën en volgt het uw muis — één gebaar, twee stappen. */
  #zonelagen.bewerken .zone-punt {
    pointer-events: auto; cursor: move;
    fill: var(--accent); stroke: #06131c; stroke-width: 1;
  }
  #zonelagen.bewerken .zone-midden {
    pointer-events: auto; cursor: crosshair;
    fill: #d7e6f5cc; stroke: #06131c; stroke-width: 1;
  }
  #zonelagen.bewerken .zone-midden:hover { fill: var(--accent); }
  .zone-terug {
    border: 0; background: none; color: inherit; font: inherit;
    cursor: pointer; padding: 0 0 0 5px;
  }
  .zone-terug:hover { text-decoration: underline; }
  /* Alleen een markering, zonder inhoud: voor wie de plattegrond wil zien. */
  .el.kader { border: 1px dashed #ffffff30; min-width: 9px; min-height: 9px; }
  .el.breed { border: 1px dashed #d9a44155; }
  .el.uit { opacity: .22; filter: grayscale(1); }
  .el.uit-f { opacity: .22; }

  .el img { width: 100%; height: auto; display: block; pointer-events: none; }
  .el svg { display: block; pointer-events: none; }
  /* Het camerakader: in de echte kaart de `state-badge` die card_mod tot
     80×50 (of 40×25) heeft uitgebreid met een afgeronde hoek. Erin staat het
     camerabeeld; als dat er niet is het camera-icoon, zodat de plek altijd
     te zien blijft. De achtergrond is donker zodat ook een leeg kader
     als een venster leest. */
  #vlak .camera-kader {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0b0e12d9; border: 1px solid #ffffff3d;
  }
  #vlak .camera-kader img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .vakje {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2px; overflow: hidden;
    font-size: 10px; line-height: 1.15; word-break: break-all;
    background: #4aa3df22; color: #cfe0ef; border-radius: 3px;
  }
  .vakje.groot { min-height: 26px; }
  .rond {
    border-radius: 50%; border: 1px solid #ffffff40; background: #10131899;
    display: flex; align-items: center; justify-content: center;
  }

  .groep-kader {
    position: absolute; pointer-events: none;
    border: 1px dotted #ffffff28; border-radius: 4px;
    transform: translate(-50%, -50%);
  }
  .groep-etiket {
    position: absolute; transform: translate(-50%, -100%);
    pointer-events: none; font-size: 10px; color: #ffffff90;
    background: #0008; padding: 0 4px; border-radius: 3px;
    white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis;
  }
  .groep-kader.uit, .groep-etiket.uit { opacity: .3; }

  /* ---- de boom links ---- */
  .knoop {
    display: flex; align-items: center; gap: 5px;
    padding: 2px 5px; border-radius: 3px; cursor: pointer;
    font-size: 12.5px; border: 1px solid transparent;
  }
  .knoop:hover { background: var(--paneel-hoger); }
  .knoop.geselecteerd { border-color: var(--accent); background: #4aa3df22; }
  .knoop.verborgen { opacity: .42; }
  .knoop.verborgen .etiket { text-decoration: line-through; }
  .knoop.uit .etiket { opacity: .6; font-style: italic; }
  .knoop .soort {
    background: #3a4150; color: #cfd6e2; font-size: 9.5px; padding: 0 4px;
    border-radius: 3px; flex: none; font-weight: 600; letter-spacing: .02em;
  }
  .knoop .etiket {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .knopje {
    flex: none; width: 17px; height: 17px; line-height: 15px; text-align: center;
    border: 1px solid var(--lijn); border-radius: 3px; font-size: 10px;
    background: var(--paneel-hoger); color: var(--tekst-dim); padding: 0;
  }
  .knopje.aan { background: var(--accent-dim); color: #fff; border-color: var(--accent); }
  .knopje:hover { border-color: var(--accent); }

  /* ---- de boom: echte takken met uitklappen ----
     De lijst hierboven was plat met insprong; nu staat elke tak in een eigen
     doos, zodat in- en uitklappen vanzelf de kinderen meeneemt. */
  #boom .tak { display: flex; flex-direction: column; min-width: 0; }
  #boom .kinderen {
    display: flex; flex-direction: column; min-width: 0;
    border-left: 1px solid var(--lijn);
    margin-left: 10px; padding-left: 5px;
  }
  #boom .kinderen.dicht { display: none; }
  #boom .kinderen .dan {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0 2px 2px;
  }
  /* Dezelfde vorm als de 'als'-knop erboven, andere kleur: blauw hoort bij
     'dan' (de tak die wél getoond wordt), groen/rood bij de voorwaarde. */
  #boom .dan-knop {
    display: inline-flex; align-items: center; gap: 3px; flex: none;
    height: 17px; padding: 0 5px; border-radius: 3px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    background: #16324a; border: 1px solid var(--accent-dim); color: #b9dcf7;
  }
  #boom .dan-knop svg { display: block; }
  #boom .dan .aantal { font-size: 10.5px; color: var(--tekst-dim); }
  .knoop > * { min-width: 0; }
  .knopje.schuif { display: flex; align-items: center; justify-content: center; }
  .knopje.schuif svg { display: block; }
  /* Lege plek waar bij een ander element het schuifje zou zitten. */
  .knoop .plek { border-color: transparent; background: transparent; }
  .knoop .naam {
    flex: 0 1 auto; max-width: 44%; color: var(--tekst-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .knoop.uit .cond { opacity: .6; font-style: italic; }

  /* 'als' is geen woord meer maar een knop: icoon, kleur, en de voorwaarde
     ernaast als statement. Groen = tak aan, rood = tak uit. */
  .knopje.als {
    width: auto; padding: 0 5px; gap: 3px; display: inline-flex;
    align-items: center; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: lowercase;
  }
  .knopje.als svg { display: block; }
  .knopje.als.waar { background: #14532d; border-color: #2f9d6a; color: #b7f5d2; }
  .knopje.als.onwaar { background: #57211f; border-color: #a04545; color: #ffc9c4; }
  body.uitstatussen .knopje.als { pointer-events: none; opacity: .75; }

  .knoop .cond {
    flex: 1; display: flex; align-items: center; gap: 4px;
    overflow: hidden;
  }
  .knoop .cond code {
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--paneel-hoger); border: 1px solid var(--lijn);
    border-radius: 3px; padding: 0 4px; color: var(--tekst);
    max-width: 118px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .knoop .cond .op { color: var(--tekst-dim); font-size: 11px; flex: none; }
  .knoop .cond code.waar { border-color: #2f9d6a; color: #b7f5d2; }
  .knoop .cond code.onwaar { border-color: #a04545; color: #ffc9c4; }

  /* ---- het paneel rechts ---- */
  #inspector .veld { display: flex; flex-direction: column; gap: 2px; }
  #inspector .veld > span { font-size: 11px; color: var(--tekst-dim); }
  /* Zonder breedte houdt een invoerveld zijn ingebouwde maat (~192px, van
     `size="20"`), en het rooster `1fr 1fr` kan daar niet onder: dan werd de
     inhoud breder dan het paneel en verscheen er een horizontale balk.
     `min-width: 0` laat de velden echt krimpen naar hun kolom. */
  #inspector .veld > input,
  #inspector .veld > select,
  #inspector .veld > textarea { width: 100%; min-width: 0; }
  /* De rij chips bovenaan (type, zone, icoon, voorwaarde) is een flexrij zonder
     terugloop, en in een chip kan een lange entity-id niet afbreken. Zo'n rij
     werd dan breder dan het paneel — en dat gaf de horizontale balk. Laat de
     chips naar de volgende regel zakken en de id binnen de chip afbreken. */
  #inspector .rij { flex-wrap: wrap; }
  #inspector .tag { overflow-wrap: anywhere; }
  /* De inspectie zweeft boven de kaart in plaats van er naast: hij is er alleen
     als u hem opent (dubbelklik), en met het kruisje gaat hij weer dicht. Zo
     houdt de kaart de volle breedte zolang u hem niet nodig heeft. */
  /* Het paneel hangt aan `main` en niet aan het venster: `main` begint pas
     onder het menu, dus hoe hoog dat menu ook wordt (het breekt af op smalle
     vensters) — het paneel komt er nooit overheen. En `100%` is de hoogte van
     `main`, dus het loopt ook niet onder de onderrand door. */
  #inspector-paneel {
    position: absolute; top: 8px; right: 14px; width: 330px;
    max-height: calc(100% - 16px); overflow-y: auto;
    background: var(--paneel-hoger, #23272e); border: 1px solid var(--lijn);
    border-radius: 6px; box-shadow: 0 12px 36px rgba(0, 0, 0, .55);
    z-index: 60; padding: 10px 12px;
  }
  #inspector-paneel.verborgen { display: none; }
  #inspector-paneel .kop {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-bottom: 1px solid var(--lijn); padding-bottom: 6px; margin-bottom: 8px;
    /* De titelbalk is de greep: slepen verplaatst het venster. `touch-action`
       zorgt dat dat ook met een vinger werkt in plaats van te scrollen. */
    cursor: move; user-select: none; touch-action: none;
  }
  #inspector-paneel .kop.sleept { cursor: grabbing; }
  #inspector-paneel .kop span { font-size: 13px; font-weight: 600; }
  #inspector-sluit { min-width: 26px; padding: 1px 7px; line-height: 1.2; }
  /* Twee tabbladen in hetzelfde venster: de gegevens van het element, en de ruwe
     YAML die eruit volgt. Zo hoeft de YAML niet onderaan te hangen en blijft het
     venster kort, met de kaart erachter vrij. */
  #inspector-paneel .tabbladen {
    display: flex; gap: 2px; border-bottom: 1px solid var(--lijn); margin-bottom: 8px;
  }
  #inspector-paneel .tab {
    padding: 4px 10px; background: none; border: 0; font-size: 12px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--tekst-dim);
  }
  #inspector-paneel .tab:hover { color: var(--tekst); }
  #inspector-paneel .tab.aan {
    color: var(--tekst); font-weight: 600; border-bottom-color: var(--accent);
  }
  #inspector-paneel .tabpaneel.verborgen { display: none; }
  #inspector-paneel pre { max-height: 320px; }
  /* De grepen om te schalen en te draaien. Ze zitten ín het element, dus ze
     bewegen mee als u het versleept; `position: absolute` met een halve marge
     zet ze precies op de hoek of het midden van de rand. */
  /* Randgrepen zijn rond — die schalen één richting. Hoekgrepen zijn vierkant —
     die schalen breedte én hoogte. Zo ziet u vooraf wat een greep gaat doen. */
  .greep {
    position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    background: var(--accent); border: 1px solid #fff; border-radius: 50%;
    box-shadow: 0 0 4px #000a; z-index: 9800; touch-action: none;
  }
  .greep.hoek { border-radius: 2px; }
  .greep.draai {
    border-radius: 50%; background: var(--waarschuwing); cursor: grab;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
  }
  .greep.draai::after {
    content: ""; position: absolute; left: 5px; top: 12px; width: 2px; height: 16px;
    background: var(--waarschuwing);
  }
  #greep-label {
    position: fixed; z-index: 9900; pointer-events: none;
    background: #000c; color: var(--tekst); border: 1px solid var(--lijn);
    border-radius: 4px; padding: 2px 7px; font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .vier { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  pre {
    margin: 0; padding: 8px; background: #11141a; border: 1px solid var(--lijn);
    border-radius: 4px; font-size: 11.5px; overflow: auto; max-height: 300px;
    white-space: pre-wrap; word-break: break-word;
  }
  .leeg { color: var(--tekst-dim); font-style: italic; }
  .tag {
    font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
    background: var(--paneel-hoger); border: 1px solid var(--lijn);
    color: var(--tekst-dim);
  }
  .tag.raar { color: var(--waarschuwing); border-color: #5c4a20; }
  /* Meldingen zijn voortgangsinformatie: die horen weg te trekken als ze
     hun werk gedaan hebben. Daarom na vier seconden dicht. Een melding die
     u móet zien (fouten, de export) krijgt een OK-knop en blijft staan. */
  /* De melding hoort de rest van het scherm niets te verdringen: hij is
     informatie, geen balk. Daarom een losse kaart rechtsonder die óver het
     venster ligt — aankomen en weggaan veranderen de indeling niet, en de
     plattegrond schuift niet meer naar beneden en terug.

     Z-index 900: boven de plattegrond en het uitklapmenu (700), maar onder het
     bevestigingsvenster (10000), dat boven alles moet blijven. */
  #melding {
    position: fixed; right: 16px; bottom: 16px; z-index: 900;
    max-width: min(520px, calc(100vw - 32px));
    padding: 8px 12px; font-size: 12.5px; background: #16324a;
    color: #cfe4f7; border: 1px solid var(--lijn); border-radius: 8px;
    box-shadow: 0 12px 34px #000b;
    display: flex; gap: 10px; align-items: center;
    transition: opacity .25s ease, transform .25s ease, visibility 0s linear 0s;
  }
  #melding .tekst { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #melding.verborgen {
    opacity: 0; transform: translateY(10px);
    visibility: hidden; pointer-events: none;
    /* De zichtbaarheid wacht op het einde van de overgang: anders verdwijnt de
       kaart al terwijl hij nog aan het infaden is. */
    transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
  }
  /* Een melding die bevestiging vraagt blijft staan: groen voor gewone
     mededelingen, rood als er iets mis is. */
  #melding.serieus { background: #1c3a1e; color: #c8f5cc; border-color: var(--accent-dim); }
  #melding.fout { background: #4a2416; color: #ffd9c4; border-color: var(--gevaarlijk); }
  #melding button { flex: none; }
  #positie {
    padding: 4px 12px; font-size: 12px; background: var(--paneel-hoger);
    border-bottom: 1px solid var(--lijn); color: var(--tekst-dim); flex: none;
    font-variant-numeric: tabular-nums; min-height: 25px;
  }
  #positie .geldig { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Plattegrond-editor</h1>

  <div class="groep gereedschap" role="group" aria-label="gereedschap">
    <button id="greep-pan" type="button" aria-pressed="true"
            title="Pan: slepen verplaatst het beeld. Klik op een element om het te kiezen."></button>
    <button id="greep-select" type="button" aria-pressed="false"
            title="Select: slepen verplaatst de elementen. Shift+klik kiest meerdere."></button>
  </div>

  <div class="groep">
    <label for="variant">variant</label>
    <select id="variant">
      <option>day</option><option>evening</option><option>morning</option>
      <option>night</option><option>sunrise</option><option>sunset</option>
    </select>
  </div>

  <div class="groep">
    <button id="knop-zoom-uit" title="uitzoomen">−</button>
    <span id="zoom-label">100%</span>
    <button id="knop-zoom-in" title="inzoomen">+</button>
    <button id="knop-zoom-pas" title="passend"></button>
  </div>

  <div class="groep">
    <label for="verdiep">verdiep</label>
    <select id="verdiep"></select>
    <button id="knop-verdiep-inst" title="instellingen van dit verdiep: koppeling met een Home Assistant-floor, en per variant de achtergrondafbeelding">⚙</button>
    <button id="knop-verdiep-plus" title="de geopende verdieping een kaart geven (als die er nog geen heeft), of een nieuwe verdieping toevoegen">+</button>
    <button id="knop-verdiep-min" title="deze verdieping schrappen — met bevestiging, en ↶ maakt het ongedaan">−</button>
    <button id="knop-verdiep-afb" title="achtergrondafbeelding van deze verdieping wijzigen">▦</button>
  </div>

  <div class="groep">
    <label for="zone">zone</label>
    <select id="zone"></select>
  </div>

  <div class="groep uitklap">
    <details id="weergave-menu">
      <summary title="weergave: zelf kiezen wat er op de plattegrond te zien is">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>
        </svg>
        <span>weergave</span>
      </summary>
      <div class="paneel">
        <label title="de pictogrammen, badges, meters en tekstlabels">
          <input type="checkbox" id="w-icoon" checked> icoonen</label>
        <label title="de foto's en lichtbeelden">
          <input type="checkbox" id="w-afbeelding" checked> afbeeldingen</label>
        <label title="de camera-beelden zelf, opgehaald uit Home Assistant.
          Uitvinken laat alleen het kader op maat met het icoon staan —
          plaatsen kan dan alsnog, zonder dat er iets wordt opgehaald.">
          <input type="checkbox" id="w-camera" checked> camera-beelden</label>
        <label title="de kaderlijnen rond elke kamer, met de naam erbij">
          <input type="checkbox" id="w-kaders" checked> Zones (kaders)</label>
        <div class="sub">
          <label for="zone-dikte">lijn</label>
          <input type="range" id="zone-dikte" min="1" max="8" step="1" value="2">
          <label for="zone-kleur">kleur</label>
          <input type="color" id="zone-kleur" value="#7fe3a0">
        </div>
        <label title="de zonevormen zelf bewerken: klik op een contour om hem te
          selecteren, sleep hem dan om te verplaatsen, trek aan een hoekpunt om
          de vorm te veranderen, en druk op een middenpunt om een zijde in
          tweeën te knippen. Dubbelklik op een hoek haalt hem weer weg; ↺ naast
          de naam zet de hele vorm terug naar automatisch. Let op: zolang dit
          aanstaat liggen de contouren boven de elementen, dus klikken gaat
          eerst hier.">
          <input type="checkbox" id="w-zonebewerk"> zones bewerken</label>
        <label title="Alleen rechthoeken bewerken: een hoek slepen herformt de
          rechthoek — de tegenoverliggende hoek blijft staan, de rest blijft in
          lijn, en u kunt geen zijden knippen. Zet dit uit voor de vrije
          polygoon-manier. Zones die geen rechthoek meer zijn (meer dan vier
          hoeken) blijven gewoon als polygoon te bewerken.">
          <input type="checkbox" id="w-zone-rechthoek"> Zone rechthoekig bewerken</label>
        <hr>
        <label title="Geen inhoud, alleen een stippellijn om elk element heen —
          de stand om te zien waar alles precies staat zonder dat de foto's
          het zicht wegnehmen.">
          <input type="checkbox" id="w-alleenkaders"> alleen kaders</label>
        <label title="elk element vervangen door een vakje met zijn naam">
          <input type="checkbox" id="w-naamvak"> grote naamvakjes</label>
        <div class="sub"><span class="tag" id="label-zones"></span></div>
        <div class="sub">
          <button id="knop-zones-export"
                  title="alle zonevormen naar een .json-bestand — meenemen naar een andere computer, of bewaren als backup">⤓ zones exporteren</button>
          <button id="knop-zones-import"
                  title="zonevormen uit een .json-bestand laden — vervangt alles wat er nu is, ↶ maakt het ongedaan">⤒ zones importeren</button>
          <input type="file" id="zones-bestand" accept="application/json,.json" style="display:none">
        </div>
        <div class="sub"><span class="tag" id="zones-bron"></span></div>
      </div>
    </details>
  </div>

  <div class="groep">
    <label><input type="checkbox" id="toon-achtergrond" checked> brede lagen</label>
    <label><input type="checkbox" id="toon-groepen" checked> groepen</label>
    <span class="tag" id="label-fouten"></span>
  </div>

  <div class="groep">
    <label for="condities">voorwaarden</label>
    <select id="condities">
      <option value="handmatig">handmatig omklappen</option>
      <option value="statussen">uit de statussen</option>
    </select>
    <span class="tag" id="label-condities"></span>
  </div>

  <div class="groep gereedschap eigen-regel" role="group" aria-label="balken en knoppenrij">
    <button id="knop-balk-toevoegen" type="button" aria-pressed="false"
            title="Devices/Entities: balk 'Toevoegen' tonen of verbergen"></button>
    <button id="knop-balk-lijst" type="button" class="aan" aria-pressed="true"
            title="Filter met de boom tonen of verbergen"></button>
    <button id="knop-refresh" type="button"
            title="Statussen opnieuw ophalen uit statussen.json"></button>
    <button id="knop-haaldashboard" type="button"
            title="Het dashboard ophalen uit Home Assistant — de editor begint opnieuw op de háldige stand"></button>
    <span class="spacer" aria-hidden="true"></span>
    <button id="knop-ongedaan" title="Ongedaan"></button>
    <span class="spacer" aria-hidden="true"></span>
    <button id="knop-herstellen" title="Herstellen"></button>
    <button id="knop-export" class="primary" title="Exporteren als JSON (zelfde vorm als het geladen bestand)"></button>
    <button id="knop-export-yaml" title="Exporteren als YAML — voor ui-lovelace.yaml"></button>
    <span class="spacer" aria-hidden="true"></span>
    <button id="knop-schrijf" class="gevaar" title="Wegschrijven naar het dashboard 2d-floorplan — toont eerst wat er verandert"></button>
    <button id="knop-instellingen" title="Instellingen — Home Assistant-adres en token bekijken of wijzigen"></button>
  </div>
</header>

<div id="melding"><span class="tekst">Bezig met laden…</span></div>
<div id="positie">geen element gekozen</div>

<main>
  <!-- De balk 'Toevoegen' begint dicht: bij het openen van de editor is de kaart
       het onderwerp, niet de lijst. Eén klik op de knop Devices/Entities in de
       gereedschapsbalk haalt hem tevoorschijn. -->
  <aside class="toevoegen verborgen">
    <div class="sectie">
      <div class="sectie-kop">
        <h2>Toevoegen</h2>
        <button id="sluit-toevoegen" class="paneel-sluit"
                title="deze balk verbergen — met de knop Devices/Entities in de gereedschapsbalk haalt u hem terug">×</button>
      </div>
      <input id="zoek-entiteit" autocomplete="off"
             placeholder="zoek op naam, entity of apparaat-id"
             title="Zoekt in de naam van het apparaat, in elke bijhorende entity
                    én in het apparaat-id, bv. f82418b75edcdc969d98a99728ceedd7">
      <div class="rij modus">
        <button id="wijz-persons"
                title="persons — de lijst toont de personen"></button>
        <button id="wijz-apparaten" class="aan"
                title="apparaten — de lijst toont de apparaten"></button>
        <button id="wijz-entities"
                title="entities — de lijst toont alle losse entities"></button>
        <button id="wijz-helpers"
                title="helpers — de lijst toont de entiteiten zonder apparaat"></button>
        <button id="wijz-voorwerpen"
                title="voorwerpen — bedden, kasten, lampen, ventilatoren en meer op de kaart"></button>
      </div>
      <label class="klein verborgen" id="voorwerp-stijl-vak"
             title="waarmee de voorwerpen getekend worden — de keuze geldt voor wat u hierna plaatst">
        <select id="voorwerp-stijl"></select> stijl
      </label>
      <select id="lijst-entiteiten" size="6"></select>
      <label class="klein" title="Alleen tonen wat op dit verdiep hoort — een gebied dat bij Gelijkvloer, Eerste verdiep of Tweede verdiep hoort. Zonder gebied, of op een ander verdiep, blijft het verborgen; zet de toggle uit om alles te zien.">
        <input type="checkbox" id="toon-ongebruikt" checked> toon enkel ongebruikte
      </label>
      <label class="klein" title="Alleen apparaten en entiteiten die aan een gebied op dit verdiep hangen. Personen volgen dit niet — die horen nergens alleen thuis.">
        <input type="checkbox" id="toon-verdiep" checked> huidig verdiep

      <div id="keuze-apparaat" class="verborgen">
        <div class="tag" id="keuze-naam"></div>

                  title="het apparaat toevoegen — kies zelf het entity dat op de kaart komt">＋ apparaat</button>
        </div>

                  title="het gekozen entity van dit apparaat toevoegen">＋ entity</button>

    <div class="sectie">

        <h2>Filter</h2>
        <button id="sluit-lijst" class="paneel-sluit"
                title="deze balk verbergen — met de knop Filter met de boom in de gereedschapsbalk haalt u hem terug">×</button>
      </div>
      <input id="filter" placeholder="filter op naam of entity" autocomplete="off">
      <div class="legenda">
        <b>✓</b> voorwaarde actief — klik om uit te zetten<br>
        <b>◉</b> zichtbaar op de plattegrond — klik om te verbergen<br>
        <b>★</b> stond eerder op deze plattegrond

  <section id="werkgebied">
    <div id="vlak"><img id="ondergrond" alt="plattegrond"><div id="zonelagen"></div></div>

  <!-- De inspectie zweeft boven de kaart en komt alleen als u erom vraagt:
       dubbelklik op een element in de boom, in de lijst of op de kaart. Zo
       houdt u de kaart vrij zolang u hem niet nodig heeft. Sluiten met het

    <div class="kop" title="sleep deze titelbalk om het venster te verplaatsen · dubbelklik om het terug te zetten">
      <span>Geselecteerd element</span>
      <button id="inspector-sluit" title="dit venster sluiten (de selectie blijft)">×</button>

        <div class="leeg">Dubbelklik op een element in de boom of op de kaart.</div>
      </div>

</main>

<script>
"use strict";

/* Hoe dit werkt
   ------------
   Er is geen platte lijst. `elements` bevat 45 `conditional`-blokken die elk
   weer kinderen dragen, plus losse `custom:gauge-card`- en
   `custom:button-card`-kaarten. Daarom bewaart elk element zijn sleutel
   (`0.12.1`): verslepen verandert alleen `style.left` en `style.top` en raakt
   de boom niet aan.

   Posities: `left` en `top` zijn het MIDDEN van het element, niet de bovenhoek.
   Dat blijkt uit de data zelf — `home.png` staat op 50%/50% met breedte 100%
   en is de volledige ondergrond, dus hij zit gecentreerd.

   Maten: `font-size: 0.6vw` betekent 0,6% van de vensterbreedte, niet van de
   kaart. Daarom wordt elke `vw` omgerekend naar pixels en daarna met de
   zoomfactor vermenigvuldigd. Zo lijkt het resultaat op het echte scherm en
   groeit alles toch mee als u inzoomt. De JSON blijft `vw` houden.

   Niets wordt teruggeschreven. `Exporteren` maakt een bestand, meer niet.
*/

const STAAT = {
  doc: null,
  kaart: null,
  variant: "day",
  geselecteerd: null,    // het element dat rechts in de inspectie staat
  grepen: null,          // { e, modus } zolang u schaalt of draait
  selektie: new Set(),   // alles wat geselecteerd is; mag meer dan één zijn
  greep: "pan",          // "pan" = slepen verplaatst het beeld, "select" = de elementen
  ongedaan: [],
  voorbeeld: null,
  tak: new WeakMap(),      // element -> {ouder, index, sleutel}
  open: new WeakMap(),     // element -> tak open (true) of dicht (false)
  verborgen: new Set(),    // sleutels die niet getekend worden
  markerTotaal: 0,       // hoeveel unavailable-markeringen Exporteren terugzet
  zone: null,            // null = alles tonen, anders de id van één kamer
  zones: {},             // entity_id -> zone, afgeleid uit de HA-area
  zonesGeladen: false,   // is zones.json binnen? Zo niet, dan valt alles terug op de naam
  zoneArea: {},          // zone-id -> HA-area-naam (zone_naar_area uit zones.json)
  namen: {},             // entity_id -> friendly name, om de zone uit de naam te halen
  zoom: 1,
  // Wat er op de plattegrond te zien is. Elk vinkje staat apart, zodat het
  // aanzetten van de een de ander niet uitzet.
  weergave: {
    icoon: true,        // pictogrammen, badges, meters, tekstlabels
    afbeelding: true,   // de foto's en lichtbeelden
    cameraBeelden: true,// de camerabeelden zelf; uit = alleen het kader op maat
    alleenKaders: false,// geen inhoud, alleen de omtrek van elk element
    naamvak: false,     // elk element vervangen door een vakje met zijn naam
    zoneBewerken: false,// de zonevormen zelf bewerken: verplaatsen, knippen
    zoneRechthoek: true, // hoeken slepen als rechthoek herformen, niet als polygoon
    // De zonekaders hebben hun eigen vlag in `zoneLaag.aan`; die stuurt ook de
    // dikte en de kleur, en het vinkje `kaders (zones)` leest die ene vlag.
  },
  iconen: {},
  perDomein: {},
  entityIconen: {},
  iconenLive: {},       // entity_id -> icoon dat Home Assistant zelf koos (of "")
  states: {},           // entity_id -> state, uit statussen.json
  snapshotBron: "",     // `_bron` uit statussen.json — zegt wanneer die snapshot is gemaakt
  eenheden: {},        // entity_id -> eenheid, voor het state-label
  condities: "handmatig",  // "handmatig" = zelf omklappen, "statussen" = uit de snapshot
  apparaten: [],        // de apparaatlijst uit apparaten.json
  helpers: new Set(),   // de entiteiten die géén apparaat hebben
  vloeren: null,        // entiteit/apparaat -> verdiep, uit de registries van HA
  vloerenBelofte: null, // zodat er nooit twee ophalingen tegelijk lopen
  viewIndex: -1,        // welk tabblad (view) de editor bewerkt; -1 = nog niets
                        // gekozen, dan pakt bouwStaats de onthouden verdieping
  bron: "momentopname",  // waar het geladen document vandaan komt — bij het
                         // laden vervangen door `_bron` uit het bestand zelf
  // Welke lijst er links staat. Vier knoppen: apparaten, alle entities,
  // personen en helpers — de laatste twee zijn entiteiten, geen apparaten.
  toev: "apparaten",
  zoneLaag: { aan: true, dikte: 2, kleur: "#7fe3a0" },
  /* Welke zone er in de bewerkstand uitgekozen is. Alleen die ene contour
     krijgt hoekpunten en mag gesleept worden — anders staat het scherm vol
     handvatten en verplaatst u per ongeluk de verkeerde kamer. `null` = niets
     gekozen. */
  zoneBewerkt: null,
  /* Handmatig bewerkte zonevormen: zoneId → {punten: [[x, y], …]} in procent
     van de plattegrond, in de volgorde waarin ze omgetrokken worden. Leeg is
     de stand: dan volgt de vorm de rechthoek om de items erin heen. */
  zoneKader: {},
};

/* De waarde van een entity volgens de snapshot, of `null` als de entity er niet
   in staat. `null` betekent: we weten het niet en tekenen wat de kaart ook zou
   tekenen als er geen state bekend was. */
function stateOf(id) {
  if (!id) return null;
  const s = STAAT.states[id];
  return s === undefined ? null : s;
}

/* Wat een `state-label` op de echte kaart toont: de state, met de eenheid
   erachter, en de `prefix`/`suffix` uit de JSON. Geen van de vijf labels in deze
   plattegrond heeft een `name`, dus vroeger viel de tekst altijd terug op de
   entity-id — u zag `input_text.floorplan_label_1everdiep` in plaats van
   `1e Verdiep:`. Zonder snapshot valt hij nog terug op de id, want dan weten we
   de waarde niet. */
function labeltekst(e) {
  const s = stateOf(e.entity);
  if (s === null) return e.name || entitynaam(e).replace(/^sensor\./, "");
  const eenheid = STAAT.eenheden[e.entity];
  let v = eenheid ? `${s} ${eenheid}` : String(s);
  return `${e.prefix || ""}${v}${e.suffix || ""}`;
}

/* De tekst bij het keuzevakje voorwaarden. De datum komt uit `_bron` van
   statussen.json — als u die snapshot ververst verandert die mee, en een
   vastgezette "5 oktober" zou dan over de nieuwe waarden liegen. */
function snapshotLabel() {
  const n = Object.keys(STAAT.states).length;
  if (!n) return "geen statussen.json — labels tonen de entity-id";
  const datum = (String(STAAT.snapshotBron || "").match(/\d{4}-\d{2}-\d{2}/) || [])[0];
  return datum ? `${n} states · snapshot ${datum}` : `${n} states uit de snapshot`;
}

/* Alle 45 voorwaarden in deze plattegrond zijn een kale `{entity, state}` of
   `{entity, state_not}` — geen `numeric_state`, geen `template`. Daarom is dit
   volledig na te rekenen. `null` betekent: onbekend, en dan doet de editor wat
   hij deed: het element laten staan. */
function conditieWaar(c) {
  if (!c || !c.entity) return null;
  const s = stateOf(c.entity);
  if (s === null) return null;
  if (c.state !== undefined) return s === String(c.state);
  if (c.state_not !== undefined) return s !== String(c.state_not);
  return null;
}

/* Welke tak van deze voorwaarde is zichtbaar? In de handmatige stand is dat
   wat het rondje aangeeft; in de stand 'uit de statussen' is het de snapshot.
   Onbekende voorwaarden vallen terug op het rondje, want dan weten we het niet
   en het weglaten zou een element doen verdwijnen zonder reden. */
function takAan(c) {
  if (STAAT.condities === "statussen") {
    const w = conditieWaar(c);
    if (w !== null) return w;
  }
  return c.__aan !== false;
}

const el = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";

/* ---------- melden ----------
   Meldingen zijn voortgangsinformatie: ze horen te verdwijnen zodra ze
   gelezen kunnen zijn. Drie standen:

   - gewoon      → autofade na vier seconden, geen knop;
   - "serieus"   → bevestiging van goed nieuws ("opgehaald", "geëxporteerd",
                   "opgeslagen"): OK-knop, en na dertig seconden alsnog vanzelf
                   weg — zo'n bevestiging hoeft niet eeuwig op het scherm;
   - "fout"      → OK-knop en blijft staan tot u hem bevestigt. Een fout
                   loopt u niet mis. */
let meldTimer = null;
function meld(tekst, soort) {
  const d = el("melding");
  clearTimeout(meldTimer);
  d.classList.remove("verborgen", "serieus", "fout");
  d.innerHTML = "";
  const s = document.createElement("span");
  s.className = "tekst";
  s.textContent = tekst;
  d.appendChild(s);
  if (soort) {
    d.classList.add(soort);
    const b = document.createElement("button");
    b.textContent = "OK";
    b.onclick = () => { clearTimeout(meldTimer); d.classList.add("verborgen"); };
    d.appendChild(b);
    // Alleen een fout blijft staan. De timer wordt bij elke nieuwe melding
    // gewist, zodat een verlopen timer nooit een melding verbergt die er
    // nog moet zijn.
    if (soort !== "fout") {
      meldTimer = setTimeout(() => d.classList.add("verborgen"), 30000);
    }
    return;
  }
  meldTimer = setTimeout(() => d.classList.add("verborgen"), 4000);
}

/* Zoomtrap. Stapjes van ongeveer een kwart, zodat `+` niet ineens doorschiet. */
const TRAP = [0.4, 0.5, 0.65, 0.8, 1, 1.25, 1.6, 2, 2.5, 3.2, 4];

/* ---------- laden ---------- */

/* Het document dat de editor bewerkt vastleggen: de markeringen eruit halen,
   de staat opnieuw bouwen, de voorwaarden vullen — en dán pas een kopie
   bewaren als herstelpunt. Die volgorde is bewust: 'Herstellen' moet
   terugkeren naar dát beeld, inclusief de rondjes die `seedVoorwaarden` er net
   in heeft gezet. Gebruikt bij het openen én bij het opnieuw ophalen. */
function documentZetten(doc, bron) {
  STAAT.doc = doc;
  STAAT.bron = bron;
  // Wat eruit gehaald wordt bewaren we voor het label rechtsonder.
  STAAT.markeringenEruit = filterMarkeringen(STAAT.doc);
  bouwStaats();
  seedVoorwaarden(STAAT.kaart ? STAAT.kaart.elements : []);
  STAAT.voorbeeld = JSON.stringify(STAAT.doc);
  STAAT.markerTotaal = markersVoor(STAAT.kaart ? STAAT.kaart.elements : [], [], []).length;
}

/* Het label met de markeringentelling. Hoort bij het document dat nu geladen
   is, dus ook bij het opnieuw ophalen. */
function toonMarkeringenLabel() {
  el("label-fouten").textContent =
    `${(STAAT.markeringenEruit || []).length} unavailable-markeringen uit de editor gehaald — ` +
    `${STAAT.markerTotaal} komen bij Exporteren terug op de plek van het item`;
}

/* Of er aan het document veranderd is sinds het laden of het laatst ophalen.
   `voorbeeld` is de exacte JSON van wat er binnenkwam, dus elk verschil is een
   bewerking van u. */
function isGewijzigd() {
  return !!STAAT.voorbeeld && JSON.stringify(STAAT.doc) !== STAAT.voorbeeld;
}

/* Wanneer is deze editor voor het laatst bijgewerkt? Zo ziet u of uw browser niet
   nog een oude versie vasthoudt — na een wijziging moet u hard verversen (Ctrl+F5).
   `document.lastModified` komt uit de kop die Home Assistant meestuurt; is die er
   niet, dan zeggen we niets in plaats van iets onzinnigs. */
function editorStempel() {
  const d = new Date(document.lastModified);
  if (!isFinite(d.getTime()) || d.getFullYear() < 2000) return "";
  const datum = d.toLocaleDateString("nl-NL", { day: "numeric", month: "long" });
  const tijd = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  return ` · editor van ${datum} ${tijd}`;
}

async function laad() {
  // Altijd het háldige bestand: zonder `t=` kan de browser een oude kopie
  // terugserveren en zou het herladen van de pagina de statussen — en de rest —
  // van gisteren tonen terwijl u die bestanden vandaag hebt ververst. De ⟳-knop
  // deed dit al voor statussen.json; een herladen moet hetzelfde opleveren.
  const t = Date.now();
  const [doc, ent, ico, zon, stat, app, vwp] = await Promise.all([
    fetch(`plattegrond.json?t=${t}`).then(r => r.json()),
    fetch(`entiteiten.json?t=${t}`).then(r => r.json()),
    fetch(`iconen.json?t=${t}`).then(r => r.json()),
    // zones.json is een aanvulling. Ontbreekt het bestand, dan werkt de editor
    // gewoon door op de handmatige aanwijzingen en de naam.
    fetch(`zones.json?t=${t}`).then(r => (r.ok ? r.json() : null)).catch(() => null),
    // statussen.json ook. Zonder dat bestand kent de editor geen enkele waarde:
    // de labels tonen dan de entity-id en de voorwaarden staan op hun aan-tak.
    fetch(`statussen.json?t=${t}`).then(r => (r.ok ? r.json() : null)).catch(() => null),
    // apparaten.json: nodig om op apparaat te kunnen zoeken en om te zien
    // welk apparaat al op de kaart staat. Zonder bestand blijft de
    // entitelijst gewoon werken.
    fetch(`apparaten.json?t=${t}`).then(r => (r.ok ? r.json() : null)).catch(() => null),
    // voorwerpen.json: de bibliotheek met tekeningen, per kamer gegroepeerd.
    // Ontbreekt hij, dan blijft de rest van de editor gewoon werken.
    fetch(`voorwerpen/voorwerpen.json?t=${t}`).then(r => (r.ok ? r.json() : null)).catch(() => null),
  ]);
  STAAT.doc = doc;
  STAAT.voorwerpen = vwp;
  bouwVoorwerpStijl();
  STAAT.entiteiten = ent.entiteiten;
  STAAT.namen = Object.fromEntries((ent.entiteiten || []).map(e => [e.id, e.naam]));
  // Suggesties voor de entity-velden van de inspectie. Eén lijst, één keer
  // gevuld: 3185 <option>-jes opnieuw bouwen bij elke selectie is zonde.
  const suggesties = document.createElement("datalist");
  suggesties.id = "entiteiten-ids";
  for (const e of STAAT.entiteiten) {
    const o = document.createElement("option");
    o.value = e.id;
    if (e.naam && e.naam !== e.id) o.label = e.naam;
    suggesties.appendChild(o);
  }
  document.body.appendChild(suggesties);
  // het icon dat de entity zelf draagt (helpers, sensoren met een eigen icoon)
  STAAT.entityIconen = Object.fromEntries(
    (ent.entiteiten || []).filter(e => e.icon).map(e => [e.id, e.icon])
  );
  STAAT.iconen = { ...ICONEN_EXTRA, ...(ico.iconen || {}) };
  STAAT.perDomein = ico.per_domein || {};
  if (zon && zon.entities) {
    STAAT.zones = zon.entities;
    STAAT.zonesGeladen = true;
  }
  // Welke kamer bij welke HA-area hoort. Nodig om de zonekiezer te laten zien
  // wat er op dít verdiep thuishoort: zone -> area -> floor.
  STAAT.zoneArea = (zon && zon.zone_naar_area) || {};
  STAAT.states = (stat && stat.states) || {};
  STAAT.eenheden = (stat && stat.eenheden) || {};
  STAAT.snapshotBron = (stat && stat._bron) || "";
  STAAT.herkend = new Set(await laadHerkend());
  // Het zoekcorpus per apparaat: naam, registernaam, fabrikant, model, area,
  // het id, alle entity-ids én alle entity-namen. In het bestand staat dat
  // niet — dat zou 440 keer dezelfde tekst duplication zijn, en dit is één
  // voorbereiding in plaats van een zoektocht per toetsaanslag.
  STAAT.apparaten = ((app && app.apparaten) || []).map(a => {
    const delen = [
      a.naam, a.apparaat, a.fabrikant, a.model, a.area, a.id,
      ...(a.entities || [])
    ];
    for (const x of (a.entities || [])) {
      const n = (STAAT.namen && STAAT.namen[x]) || "";
      if (n) delen.push(n);
    }
    return { ...a, zoek: delen.join(" ").toLowerCase() };
  });

  // Welke entiteiten géén apparaat hebben: de helpers, groepen en templates.
  // Automations, scripts, scènes, zones, personen en trackers horen daar niet
  // bij — die staan alleen onder 'entities', behalve de personen want die
  // hebben een eigen knop. Zonder deze lijst zou het helpers-knopje leeg zijn.
  const metApparaat = new Set(STAAT.apparaten.flatMap(a => a.entities || []));
  const nietHelper = new Set(
    ["person", "zone", "device_tracker", "automation", "script", "scene"]);
  STAAT.helpers = new Set(
    STAAT.entiteiten.map(e => e.id)
      .filter(id => !metApparaat.has(id) && !nietHelper.has(id.split(".")[0])));

  // De editor werkt standaard op de momentopname. Is er al een token (dat
  // komt er bij de eerste keer wegschrijven), dan begint hij op de háldige
  // stand — anders ziet u niet wat u zojuist in Home Assistant heeft
  // aangepast, en zou Herstellen die aanpassing weer teruggedraaid hebben.
  const live = await haDashboardOphalen();
  if (live.config) {
    STAAT.doc = live.config;
    STAAT.bron = "live uit Home Assistant, net opgehaald";
  } else {
    // De datum komt uit `_bron` van het bestand dat we net lazen. Die was
    // vastgezet op "4 oktober" — na het verversen van de momentopname zou elke
    // melding dus de verkeerde datum tonen.
    const van = (STAAT.doc && STAAT.doc._bron) || STAAT.bron;
    STAAT.bron = live.reden === "geen token"
      ? van
      : `${van} — ophalen uit Home Assistant lukte niet: ${live.reden}`;
  }

  documentZetten(STAAT.doc, STAAT.bron);
  // Pas ná `documentZetten` weten we welke verdieping open is, en daar hangen de
  // handmatige zonevormen aan — vandaar deze volgorde.
  zoneKadersLaad();
  laadLiveIconen();
  ruimVerlatenVerdiepingenOp();
  bouwZonekiezer();
  bouwVerdiepkiezer();
  tekenGereedschap();
  greepZet("pan");
  pasVlakAan();
  tekenAlles();
  // De lijst links is nu gevuld en daarmee is er een schuifbalk in het
  // werkgebied. Dat maakt het venster net smaller, dus de eerste maat was een
  // tikje te groot. Opnieuw meten kost niets en scheelt een verschuiving.
  pasVlakAan();
  meld(
    `${aantal()} elementen, ${STAAT.bron}${editorStempel()}. ` +
    `${zoneHerstelMelding}${zoneOpslagTekst()}. ` +
    `Standaard staat Pan aan: slepen verplaatst het beeld. ` +
    `Zet op Select om elementen te schuiven; daar kiest u er meerdere. ` +
    `Sneltoetsen: H en S wisselen, ctrl+scroll zoomt, pijltjestoetsen verplaatsen.`
  );
  el("label-herkend").textContent =
    `★ ${STAAT.herkend.size} entities stonden eerder op deze plattegrond`;
  el("label-condities").textContent = snapshotLabel();
  toonMarkeringenLabel();
}

/* ---------- zones ----------

   De Gelijkvloer is opgesplitst in acht kamers. Uw zonenamen komen overeen met
   de areas die al in Home Assistant bestaan: Garage, Hal vooraan, Hal
   achteraan, Toilet, Keuken, Waskot, Woonkamer en Tussenverdiep. "Living" en
   "Woonkamer" zijn in Home Assistant samengevoegd tot Woonkamer.

   De toewijzing komt in vier trappen, van sterk naar zwak:

     1. handmatig  — ZONE_VAST, voor wat de area níet kan weten
     2. HA-area    — zones.json, uit het apparaatregister van Home Assistant
     3. naam       — de friendly name, of de bestandsnaam van de afbeelding
     4. geërfd     — de kamer van de `conditional` waarin het element staat

   De inspectie toont per element welke trap het was, zodat een kamerverkeering
   meteen te herkennen is. Nieuwe apparaten krijgen daardoor automatisch de
   juiste kamer, zolang u ze maar aan een area hangt.

   Alles wat niet in een kamer thuishoort — personen, de klok, de
   verdieplabels, de energie- en zwembadmeters en de twee buitencamera's — krijgt
   geen zone en blijft daarom altijd zichtbaar, ook als u inzoomt op één kamer. */

const ZONES = [
  { id: "garage", naam: "Garage" },
  { id: "hal_vooraan", naam: "Hal vooraan" },
  { id: "hal_achteraan", naam: "Hal achteraan" },
  { id: "toilet", naam: "Toilet" },
  { id: "keuken", naam: "Keuken" },
  { id: "waskot", naam: "Waskot" },
  { id: "living", naam: "Woonkamer" },
  { id: "tussenverdiep", naam: "Tussenverdiep" },
];
const ZONE_NAAM = Object.fromEntries(ZONES.map(z => [z.id, z.naam]));

/* Handmatige aanwijzingen. Alles wat de HA-area al weet staat niet hier, maar in
   zones.json — dat is de waarheid en die weegt zwaarder dan de naam. Alleen wat
   de area níet kan geven staat hier: de hulpschakelaars van de plattegrond
   hebben geen eigen apparaat en dus geen area. */
const ZONE_VAST = {
  "sensor.charger_status": "garage",                               // laadpaal, staat als losse entity
  "cover.garage_door": "garage",                                    // losse entity, geen apparaat
  "input_boolean.bmw_in_tha_house": "garage",                      // hulpschakelaar
  "input_boolean.renault_in_garage": "garage",                     // hulpschakelaar
  "input_boolean.2d_ff_garage": "garage",                          // hulpschakelaar
  "input_boolean.lamp_hal_vooraan": "hal_vooraan",                 // hulpschakelaar
  "input_boolean.lamp_hal_achteraan": "hal_achteraan",             // hulpschakelaar
  "input_boolean.lamp_toilet": "toilet",                           // hulpschakelaar

  /* De enige plek waar u de area bewust overruled: het rolluik van het
     achterraam staat in de HA-area op "Hal achteraan", maar hoort volgens u bij
     de keuken. Omdat ZONE_VAST vóór de area gaat, blijft dit bij de keuken. */
  "cover.rfy_090301_1": "keuken",
};

/* Uit de friendly name. Werkt ook voor lampen die nog niet in de tabel staan. */
const ZONE_UIT_NAAM = [
  [/garage/i, "garage"],
  [/hal\s*achter/i, "hal_achteraan"],
  [/hal\s*voor/i, "hal_vooraan"],
  [/toilet/i, "toilet"],
  [/keuken|koffie/i, "keuken"],
  [/waskot|wasmachine/i, "waskot"],
  [/living|lg\s*tv|haard/i, "living"],
  [/vaulte|tussenverdiep/i, "tussenverdiep"],
];

/* Uit de bestandsnaam van de afbeelding: de sfeerlichten en de autobladen. */
const ZONE_UIT_BEELD = [
  [/garage/i, "garage"],
  [/renault_in_garage|bmw_in_garage/i, "garage"],
  [/licht_keuken/i, "keuken"],
  [/sfeerlicht_living|licht_living/i, "living"],
  [/sfeerlicht_haard/i, "living"],
  [/sfeerlicht_vaulte/i, "tussenverdiep"],
];

function zoneUitNaam(naam) {
  if (!naam) return null;
  for (const [patroon, zone] of ZONE_UIT_NAAM) if (patroon.test(naam)) return zone;
  return null;
}

/* De zone van één element. `erf` is de zone van de `conditional` waarin het
   staat; die erft het kind, want een kind van "geveldeur dicht" hoort in de
   kamer van die geveldeur.

   Volgorde van gezag: handmatig (ZONE_VAST) → HA-area (zones.json) → de naam →
   de kamer van de ouder. `ZONE_BRON` zegt welke van die vier het was, zodat de
   inspectie kan tonen waaróm een element in een kamer staat. */
let ZONE_BRON = "";

function zoneVoorEnt(ent, erf) {
  if (!ent) return erf;
  if (ZONE_VAST[ent]) { ZONE_BRON = "handmatig"; return ZONE_VAST[ent]; }
  if (STAAT.zones[ent]) { ZONE_BRON = "HA-area"; return STAAT.zones[ent]; }
  const uitNaam = zoneUitNaam(STAAT.namen ? STAAT.namen[ent] : "");
  if (uitNaam) { ZONE_BRON = "naam"; return uitNaam; }
  if (ent.startsWith("input_boolean.lamp_")) {
    const uitSjabloon = zoneUitNaam(ent.replace("input_boolean.lamp_", ""));
    if (uitSjabloon) { ZONE_BRON = "naam"; return uitSjabloon; }
  }
  ZONE_BRON = erf ? "geërfd" : "geen";
  return erf;
}

function zoneVan(e, erf = null) {
  const ent = e.entity;
  if (ent) return zoneVoorEnt(ent, erf);
  if (e.type === "image") {
    const img = e.image || (e.state_image ? e.state_image.on : "");
    if (typeof img === "string") {
      const ref = img.match(/states\['([a-z_]+\.[a-z0-9_]+)'\]/);
      if (ref) {
        const uitRef = zoneVoorEnt(ref[1], erf);
        if (uitRef) return uitRef;
      }
      for (const [patroon, zone] of ZONE_UIT_BEELD)
        if (patroon.test(img)) { ZONE_BRON = "beeldnaam"; return zone; }
    }
  }
  ZONE_BRON = erf ? "geërfd" : "geen";
  return erf;
}

/* Zet de zone in de boom, zodat tekenen, lijst en inspectie hem allemaal zien. */
function markeerZones() {
  const loop = (lijst, erf) => {
    for (const e of lijst || []) {
      if (e.type === "conditional") {
        const c = (e.conditions || [])[0];
        e.__zone = zoneVan({ entity: c && c.entity }, erf);
        e.__bron = ZONE_BRON;
        loop(e.elements, e.__zone);
      } else {
        e.__zone = zoneVan(e, erf);
        e.__bron = ZONE_BRON;
      }
    }
  };
  loop(STAAT.kaart ? STAAT.kaart.elements : [], null);
}

/* Alles wat in deze zone hoort, plus alles zonder zone. */
function zichtbaarVoorZone(zone) {
  return e => !zone || !e.__zone || e.__zone === zone;
}

/* Het vlak waarop deze zone ligt, om erop in te zoomen.

   Alleen de items van déze zone bepalen het vlak. De items zonder zone blijven
   wel zichtbaar — de klok en de personen moeten niet verdwijnen als u op één
   kamer inzoomt — maar die liggen over de hele plattegrond en zouden het vlak
   naar het midden van het huis trekken. Elke zone zou dan hetzelfde beeld krijgen.

   Een zone van twee items levert een vlak van een paar procent, en daarop
   inzoomen betekent één icoon op 400% — precies wat u niet wilt, want dan is de
   kamercontext weg. Daarom heeft het zonevlak een ondergrens: nooit kleiner dan
   een derde van de plattegrond. */
const ZONE_VLAK_MIN = { b: 34, h: 30 };

/* ---------- handmatige zonekaders ----------

   De kaders zijn normaal afgeleid: de omtrek van de items die in die zone
   staan. Dat klopt bijna nooit met de kamer zelf — een zone van twee items is
   een hokje van een paar procent, en één item dat verkeerd staat schuift de
   hele omtrek mee. Daarom kunt u in de stand "zones verschuiven" het kader
   zelf neerzetten.

   Die aanpassing hoort bij de editor, niet bij het dashboard: de zone-laag
   bestaat in Home Assistant niet en mag in de export dus ook niet opduiken.
   Vandaar dezelfde plek als de ⚙-instellingen — de browser. Leeg laten is de
   standaard: dan volgt het kader weer gewoon de items. */

const ZONE_KADER_SLEUTEL = "prototype.zonekaders";
const ZONE_MODUS_SLEUTEL = "prototype.zonemodus";   // rechthoek of polygoon
const ZONE_KADER_MIN = 4;              // procent; een nul-breed hokje is niets

/* Een opgeslagen vorm is een lijst hoekpunten in procent: `[[x, y], …]` in de
   volgorde waarin ze omgetrokken worden. De oude opslag (een rechthoek als
   `{l, t, b, h}`) wordt bij het laden omgezet, zodat er overal één vorm is. */
function puntenUitKader(k) {
  if (!k) return null;
  if (Array.isArray(k.punten)) {
    const p = k.punten.filter(pt => Array.isArray(pt) && pt.length === 2 &&
      Number.isFinite(+pt[0]) && Number.isFinite(+pt[1]));
    return p.length >= 3 ? p.map(pt => [+pt[0], +pt[1]]) : null;
  }
  if (["l", "t", "b", "h"].every(sleutel => Number.isFinite(parseFloat(k[sleutel])))) {
    return rechthoekPunten({ l: +k.l, t: +k.t, b: +k.b, h: +k.h });
  }
  return null;
}

/* Een rechthoek als contour: vier hoeken, linksboven en clockwise. */
/* Eén hoek van een rechthoek slepen in de rechthoek-modus: de tegenoverliggende
   hoek blijft staan, de hoek die u vasthebt gaat met u mee en de andere twee
   blijven in lijn. De punten worden altijd opnieuw opgebouwd, zodat het
   resultaat hoe dan ook een nette, linksom-rechtsom geordende rechthoek is. */
function rechthoekSleep(beg, i, p) {
  const xs = beg.map(q => q[0]), ys = beg.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const links = beg[i][0] - x0 <= x1 - beg[i][0];
  const boven = beg[i][1] - y0 <= y1 - beg[i][1];
  const m = ZONE_KADER_MIN;
  let l = x0, r = x1, t = y0, b = y1;
  if (links) l = Math.min(Math.max(p[0], 0), r - m);
  else r = Math.max(Math.min(p[0], 100), l + m);
  if (boven) t = Math.min(Math.max(p[1], 0), b - m);
  else b = Math.max(Math.min(p[1], 100), t + m);
  return [[l, t], [r, t], [r, b], [l, b]];
}

function rechthoekPunten(v) {
  const l = +v.l - +v.b / 2, t = +v.t - +v.h / 2;
  return [[l, t], [l + +v.b, t], [l + +v.b, t + +v.h], [l, t + +v.h]];
}

/* Waar de vormen van een verdieping onder hangen. Views hebben niet altijd een
   `path` (het gelijkvloers niet), dus de titel is de tweede keus. */
function zoneSleutel(view) {
  return String((view && (view.path || view.title)) || "onbekende verdieping");
}

/* De vormen van de verdieping die nu open is. Vroeger hing alles aan de
   zonnaam — dan zou de keuken op het gelijkvloers het kader van de keuken op
   de eerste verdiep overnemen. */
function zoneVormen() {
  const sleutel = zoneSleutel(STAAT.view);
  if (!STAAT.zoneKader[sleutel]) STAAT.zoneKader[sleutel] = {};
  return STAAT.zoneKader[sleutel];
}

const ZONE_KADER_KOPIE = ZONE_KADER_SLEUTEL + ".kopie";
let zoneHerstelMelding = "";       // invult als de kopie moest redderen

/* Hoeveel zonevormen er in zo'n opslag-object zitten, over alle verdiepingen. */
function zoneVormenTelling(obj) {
  let n = 0;
  for (const binnen of Object.values(obj || {})) {
    if (binnen && typeof binnen === "object") n += Object.keys(binnen).length;
  }
  return n;
}

/* Eén zin voor in de startmelding. Staat er "0 zonevormen", dan is de opslag
   leeg — en dan weet u meteen of u te maken heeft met een lege opslag (dan
   wordt de kopie teruggzet) of met een tekening die ze niet pakt. Alleen
   verdiepingen met wél vormen tellen mee; een leeg bakje is geen verdieping. */
function zoneOpslagTekst() {
  const verd = Object.values(STAAT.zoneKader)
    .filter(v => v && typeof v === "object" && Object.keys(v).length).length;
  return `${zoneVormenTelling(STAAT.zoneKader)} zonevormen op ${verd} ` +
    `verdieping${verd === 1 ? "" : "en"}`;
}

function zoneKadersLaad() {
  try {
    const r = JSON.parse(localStorage.getItem(ZONE_KADER_SLEUTEL));
    STAAT.zoneKader = (r && typeof r === "object" && !Array.isArray(r)) ? r : {};
  } catch (_) { STAAT.zoneKader = {}; }
  // Oude opslag hing nog plat aan de zonnaam ({zoneId: vorm}). Die hoorde bij
  // de eerste verdieping die de editor ooit bewerkte — het gelijkvloers.
  if (Object.values(STAAT.zoneKader).some(v => v && v.punten)) {
    STAAT.zoneKader = { [zoneSleutel(STAAT.view)]: STAAT.zoneKader };
  }
  // Niets over, maar wél een kopie: die terugzetten. Alleen bij écht leeg — een
  // opgeruimde opslag mag niet stilletjes terugkeren, en bij een halve opslag
  // gokken we niet.
  let hersteld = false;
  if (!zoneVormenTelling(STAAT.zoneKader)) {
    try {
      const kopie = JSON.parse(localStorage.getItem(ZONE_KADER_KOPIE) || "null");
      if (kopie && typeof kopie === "object" && zoneVormenTelling(kopie)) {
        STAAT.zoneKader = kopie;
        hersteld = true;
        zoneHerstelMelding = `${zoneVormenTelling(kopie)} zonevormen hersteld uit de kopie. `;
      }
    } catch (_) { /* kapotte kopie: negeren */ }
  }
  zoneVormenOpschoon();
  // Het herstel meteen vastleggen (anders leegt de opslag pas bij de eerste
  // vormwijziging), en een kopie maken als die er nog niet is — zo hoeft u
  // niet eerst iets te wijzigen voordat het vangnet er ligt.
  if (hersteld) zoneKadersBewaar();
  else zoneKopieBijwerken();
}

function zoneKadersBewaar() {
  zoneKadersBewaarLokaal();
  // En naar de server, zodat het niet aan deze computer blijft hangen.
  zonesNaarHABinnenkort();
}

/* De cache: localStorage + de nooit-krimpende kopie. Dit is wat de editor
   gebruikt als Home Assistant even niet antwoordt. */
function zoneKadersBewaarLokaal() {
  try { localStorage.setItem(ZONE_KADER_SLEUTEL, JSON.stringify(STAAT.zoneKader)); }
  catch (_) { /* geen opslag — dan blijft het bij deze sessie */ }
  zoneKopieBijwerken();
}

/* Een vangnet dat nooit krimpt: alleen groter of gelijk overschrijven. Als er
   ooit iets de opslag leegmaakt — zoals de opruimer die verdiepingen weggooide
   die er nog wél waren — blijft het grootste bekende aantal vormen bewaard,
   en dat wordt bij een lege opslag teruggezet. */
function zoneKopieBijwerken() {
  try {
    const kopie = localStorage.getItem(ZONE_KADER_KOPIE);
    const oud = kopie === null ? -1 : zoneVormenTelling(JSON.parse(kopie));
    if (zoneVormenTelling(STAAT.zoneKader) >= oud) {
      localStorage.setItem(ZONE_KADER_KOPIE, JSON.stringify(STAAT.zoneKader));
    }
  } catch (_) { /* geen opslag of kapotte kopie */ }
}

/* Kapotte vormen eruit (een NaN van een eerdere versie, een halve sleutel) en
   de oude rechthoeken om naar punten — anders zou de rest twee vormen kennen.
   Zowel het laden als het importeren gaat hier doorheen. */
function zoneVormenOpschoon() {
  for (const binnen of Object.values(STAAT.zoneKader)) {
    if (!binnen || typeof binnen !== "object") continue;
    for (const id of Object.keys(binnen)) {
      const p = puntenUitKader(binnen[id]);
      if (!p) { delete binnen[id]; continue; }
      binnen[id] = { punten: p };
    }
  }
}

/* Zonevormen exporteren en importeren.

   De opslag zit in localStorage: per browser, per computer, per adres. Dat is
   precies waarom werk en thuis niet vanzelf hetzelfde zijn, en waarom een
   leeggelopen opslag niet terug te halen is. Een bestandje maakt er iets van
   dat u kunt meenemen, bewaren en terugzetten. */
function zonesExporteer() {
  const json = JSON.stringify(STAAT.zoneKader);
  const naam = `zonevormen-${new Date().toISOString().slice(0, 10)}.json`;
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = naam;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  meld(`${zoneVormenTelling(STAAT.zoneKader)} zonevormen geëxporteerd naar "${naam}".`,
       "serieus");
}

async function zonesImporteer(bestand) {
  let data;
  try { data = JSON.parse(await bestand.text()); }
  catch (_) { meld("Dat bestand is geen geldige JSON — niets veranderd.", "fout"); return; }
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    meld("Dat bestand bevat geen zonevormen — niets veranderd.", "fout");
    return;
  }
  const n = zoneVormenTelling(data);
  if (!n) {
    meld("Dat bestand bevat geen zonevormen — niets veranderd.", "fout");
    return;
  }
  const ok = await vraagVenster({
    kop: "Zonevormen importeren?",
    uitleg: `Het bestand bevat ${n} zonevormen; de editor heeft er nu ` +
      `${zoneVormenTelling(STAAT.zoneKader)}. Importeren vervangt alles wat er nu staat — ` +
      "met ↶ maakt u het weer ongedaan. Er wordt meteen een kopie gemaakt, zoals bij " +
      "elke opslag.",
    okTekst: "Importeren",
    cancelTekst: "Annuleren",
  });
  if (!ok) { meld("Niets veranderd — import geannuleerd."); return; }

  const vooraf = huidigeStaat();
  onthoud(vooraf);
  STAAT.zoneKader = data;
  zoneVormenOpschoon();
  zoneKadersBewaar();
  tekenAlles();
  meld(`${zoneVormenTelling(STAAT.zoneKader)} zonevormen ingevoerd uit "${bestand.name}". ` +
       `De kopie is bijgewerkt en het gaat naar Home Assistant; ↶ maakt het ongedaan.`, "serieus");
}

el("knop-zones-export").onclick = zonesExporteer;
el("knop-zones-import").onclick = () => el("zones-bestand").click();
el("zones-bestand").onchange = ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";                      // hetzelfde bestand nogmaals kiezen moet kunnen
  if (f) zonesImporteer(f);
};

/* -------------------- de zonevormen horen op de server --------------------

   Ze stonden in localStorage: per browser, per computer, per adres. Werk en
   thuis liepen dus uit elkaar, en een leeggelopen opslag was niet terug te
   halen. Daarom staan ze nu in Home Assistant zelf, naast de layout van
   dezelfde plattegrond, via `/api/floorplan_layout/zones`.

   localStorage blijft als cache: valt HA even weg, dan werkt de editor door en
   schrijft hij het later weer bij. Het bestand op de server is de waarheid. */
let zoneBron = "onbekend";           // voor het label bij de knoppen
let zonesSchrijfTimer = null;
let zonesSchrijfFoutGemeld = false;

function zonesEindpunt() {
  const inst = haInstelling();
  if (!inst.url || !inst.token) return null;
  return `${inst.url.replace(/\/+$/, "")}/api/floorplan_layout/zones`;
}

function zonesBronZet(tekst) {
  zoneBron = tekst;
  const vak = el("zones-bron");
  if (vak) vak.textContent = tekst;
}

async function zonesVanHA() {
  const url = zonesEindpunt();
  if (!url) return { reden: "geen ⚙-instellingen" };
  const inst = haInstelling();
  try {
    const r = await metTijdslimiet(fetch(url, {
      headers: { Authorization: `Bearer ${inst.token}` },
    }), 10000);
    if (!r.ok) return { reden: `HTTP ${r.status}` };
    const data = await r.json().catch(() => null);
    return { zones: (data && data.zones) || null };
  } catch (e) {
    return { reden: (e && e.message) || String(e) };
  }
}

async function zonesNaarHA(kader) {
  const url = zonesEindpunt();
  if (!url) return false;
  const inst = haInstelling();
  try {
    const r = await metTijdslimiet(fetch(url, {
      method: "PUT",
      headers: {
