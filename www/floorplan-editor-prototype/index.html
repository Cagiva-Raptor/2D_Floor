      o.value = x.id;
      o.textContent =
        (STAAT.herkend.has(x.primair) ? "★ " : "") + x.naam +
        `  ·  ${x.entities.length} entit${x.entities.length === 1 ? "y" : "ies"}` +
        (op ? "  ✓ op de kaart" : "");
    } else {
      o.value = x.id;
      o.textContent = (STAAT.herkend.has(x.id) ? "★ " : "") + x.naam + "  ·  " + x.id;
    }
    keuze.appendChild(o);
  }
  // De eerste keuze meteen selecteren. Een <select> met size heeft anders geen
  // voorselectie, en dan zegt Toevoegen "kies eerst een entity" terwijl er
  // maar één keuze zichtbaar is. Dat is precies de ergernis die we hier weg
  // willen hebben.
  if (zichtbaar.length) keuze.selectedIndex = 0;
  keuze.onchange = () => kiesUitLijst();
  kiesUitLijst();
}

/* Na het kiezen in de lijst verschijnt de knop die bij de lijst hoort. Bij
   een apparaat komt er nog de entity-keuze bij: één apparaat kan zes
   entities hebben en u wilt er één op de kaart. */
/* De tooltip van een keuzelijst: de volledige tekst van wat er gekozen is. In
   de lijst zelf wordt een lange naam afgekapt; zweven boven de lijst toont de
   rest, zonder dat er een blok onder hoeft te staan dat bij elke beweging van
   hoogte verandert. */
function lijstTitel(kies) {
  if (!kies) return;
  const optie = kies.selectedIndex >= 0 ? kies.options[kies.selectedIndex] : null;
  kies.title = optie ? optie.textContent.trim() : "";
}

el("keuze-entity").onchange = () => lijstTitel(el("keuze-entity"));

function kiesUitLijst() {
  lijstTitel(el("lijst-entiteiten"));
  const apparaten = STAAT.toev === "apparaten";
  const voorwerpen = STAAT.toev === "voorwerpen";
  el("keuze-apparaat").classList.toggle("zoniet", !apparaten);
  // Bij de voorwerpen is er geen entiteit om te kiezen: dat zijn tekeningen.
  el("keuze-entiteit").classList.toggle("zoniet", apparaten || voorwerpen);
  if (apparaten) {
    const a = (STAAT.apparaten || []).find(x => x.id === el("lijst-entiteiten").value);
    const vak = el("keuze-entity");
    vak.innerHTML = "";
    if (!a) { el("keuze-naam").textContent = ""; return; }
    el("keuze-naam").textContent =
      `${a.naam} — ${a.apparaat}${a.area ? " · " + a.area : ""}`;
    for (const id of a.entities) {
      const o = document.createElement("option");
      o.value = id;
      const naam = STAAT.namen[id];
      o.textContent = id + (naam && naam !== id ? `  —  ${naam}` : "");
      vak.appendChild(o);
    }
    vak.selectedIndex = 0;
    lijstTitel(vak);
  }
}

/* ------------------------- voorwerpen -------------------------

   Bedden, kasten, lampen, ventilatoren en meer: losse tekeningen die u op de
   kaart zet. Ze staan als bestand in `voorwerpen/<stijl>/<naam>.svg` en worden
   een gewoon `image`-element — dus Home Assistant tekent ze net zo goed als de
   editor, er is geen nieuw elementtype voor nodig, en u kunt de bestanden zelf
   bijwerken. `voorwerpen.json` vertelt welke er zijn, per kamer gegroepeerd. */

function voorwerpStijl() {
  const stijlen = (STAAT.voorwerpen && STAAT.voorwerpen.stijlen) || [];
  let gekozen = STAAT.voorwerpStijl;
  if (!gekozen) {
    try { gekozen = localStorage.getItem("prototype.voorwerpstijl"); } catch (_) { gekozen = null; }
  }
  return stijlen.some(s => s.id === gekozen) ? gekozen : (stijlen[0] && stijlen[0].id) || "lijn";
}

function voorwerpVan(id) {
  if (!id || !STAAT.voorwerpen) return null;
  for (const groep of STAAT.voorwerpen.groepen || []) {
    const v = (groep.voorwerpen || []).find(x => x.id === id);
    if (v) return v;
  }
  return null;
}

function voorwerpPad(v, stijl) {
  return `/local/floorplan-editor-prototype/voorwerpen/${stijl}/${v.id}.svg`;
}

function voegVoorwerpToe(id, positie) {
  if (!STAAT.kaart) {
    meld("Deze verdieping heeft nog geen kaart — maak er eerst een met de + naast 'verdiep'.",
         "fout");
    return null;
  }
  const v = voorwerpVan(id);
  if (!v) { meld("Kies eerst een voorwerp.", "fout"); return null; }
  const stijl = voorwerpStijl();
  if (!(v.stijlen || []).includes(stijl)) {
    meld(`"${v.naam}" heeft geen versie in die stijl — kies een andere stijl.`, "fout");
    return null;
  }
  // Dezelfde plek-logica als bij een entiteit: het opgegeven punt, anders het
  // midden. `left`/`top` zijn het midden van het element.
  const l = positie ? Math.min(100, Math.max(0, Math.round(+positie.l * 100) / 100)) : 50;
  const t = positie ? Math.min(100, Math.max(0, Math.round(+positie.t * 100) / 100)) : 50;
  const nieuw = {
    type: "image",
    image: voorwerpPad(v, stijl),
    style: { left: l + "%", top: t + "%", width: v.breedte || "8%" },
  };
  // Staat hetzelfde voorwerp al ergens op een kaart, dan nemen we die maat over:
  // een bed op de 1e verdieping hoort even groot te zijn als op het gelijkvloers.
  const bron = stijlBron(nieuw.image);
  if (bron && bron.e !== nieuw) stijlVan(nieuw, bron.e);
  onthoud();
  STAAT.kaart.elements.push(nieuw);
  bouwStaats();
  tekenAlles();
  tekenZoeklijst();
  selecteer(nieuw);
  meld(
    `${v.naam} toegevoegd ${positie ? `op ${l}% / ${t}%` : "in het midden"}` +
    (bron && bron.eigen ? ", in de maat van hetzelfde voorwerp op deze verdieping." : ".") +
    ` Versleep het, of stel de breedte bij (dubbelklik op het element).`
  );
  return nieuw;
}

function voegToe(id, toelichting, positie) {
  if (!STAAT.kaart) {
    meld("Deze verdieping heeft nog geen kaart — maak er eerst een met de + naast 'verdiep'.",
         "fout");
    return;
  }
  if (!id) { meld("Kies eerst wat u wilt toevoegen."); return; }
  const domein = id.split(".")[0];
  // Waar het neerkomt: de opgegeven plek (slepen uit de lijst), anders het
  // midden. `left`/`top` zijn het midden van het element — zo staat het in de
  // echte kaart ook, dus de losplek is meteen de juiste plek.
  const l = positie ? Math.min(100, Math.max(0, Math.round(+positie.l * 100) / 100)) : 50;
  const t = positie ? Math.min(100, Math.max(0, Math.round(+positie.t * 100) / 100)) : 50;
  const nieuw = {
    type: "state-icon",
    entity: id,
    style: { left: l + "%", top: t + "%", "font-size": "1.5vw", color: "white" },
  };
  if (STAAT.perDomein[domein] && !GEEN_DOMEIN_GOK.has(domein)) nieuw.icon = STAAT.perDomein[domein];
  // Staat deze entiteit al ergens op een kaart, dan nemen we dat element meteen
  // als voorbeeld. Zo krijgt de klok op de 1e verdieping dezelfde look als die op
  // het gelijkvloers, zonder dat u daar iets voor hoeft te doen — het is één en
  // hetzelfde ding op twee verdiepingen.
  const bron = stijlBron(id);
  let vanwaar = "";
  if (bron) {
    const gedaan = stijlVan(nieuw, bron.e);
    if (gedaan) {
      vanwaar = ` Soort en stijl overgenomen van ` +
        (bron.eigen ? "het element op deze verdieping" : `"${naamVan(bron.e)}" op ${bron.verdiep}`) +
        ` (${gedaan.type}${gedaan.acties.length ? ", met " + gedaan.acties.join(" en ") : ""}).`;
    }
  }
  // En anders het echte icoon van de entiteit erachteraan: Home Assistant weet de
  // device_class (een thermometer bij een temperatuursensor) en dat kan de
  // momentopname niet. Komt het antwoord, dan vervangt het wat er nu staat.
  // Nemen we een bestaand element over, dan slaan we dit over: dat icoon is al het
  // goede, en een label hoort helemaal geen icoon te krijgen.
  if (!bron) icoonVanHA(id).then(icoon => {
    if (icoon) {
      nieuw.icon = icoon;
      STAAT.iconenLive[id] = icoon;              // onthouden voor de volgende keer
      bewaarLiveIconen();
    } else if (icoon === "") {
      STAAT.iconenLive[id] = "";
      bewaarLiveIconen();
    }
    if (icoon === null || nieuw.icon === icoon) return;
    tekenAlles();
    tekenZoeklijst();
    tekenInspector();
  });
  onthoud();
  STAAT.kaart.elements.push(nieuw);
  bouwStaats();
  tekenAlles();
  tekenZoeklijst();
  selecteer(nieuw);
  meld(
    `${id} toegevoegd ${positie ? `op ${l}% / ${t}%` : "in het midden"}.` + vanwaar +
    ` Versleep het, of zet links en boven op een getal. ` +
    `In de inspectie past u het icoon aan; een voorwaarde zet u met een ` +
    `rechtermuisklik op het element.` +
    (toelichting ? " " + toelichting : "")
  );
  return nieuw;
}

/* Het apparaat zelf: het entity dat het gezicht ervan is, meestal het licht
   of de schakelaar. De rest van het apparaat blijft bereikbaar via de
   entity-keuze eronder. */
function voegApparaatToe() {
  const a = (STAAT.apparaten || []).find(x => x.id === el("lijst-entiteiten").value);
  if (!a) { meld("Kies eerst een apparaat."); return; }
  voegToe(a.primair, `Dit is het gezicht van "${a.naam}"; kies hieronder een ander entity als u iets anders wilt.`);
}

/* Slepen uit de lijst naar de plattegrond.

   Een <select> is geen betrouwbare sleepbron (de browser wil er zelf tekst uit
   slepen), dus doen we het zelf: ingedrukt houden en bewegen → een chipje volgt
   de muis; loslaten boven het vlak → daar toevoegen. Alleen écht bewegen telt
   als slepen — een gewone klik blijft een gewone klik, zodat de lijst kiezen
   onveranderd werkt.

   Twee dingen die hierin zitten omdat ze anders misgaan:
   - het gekozen item wordt op de pointer-positie bepaald, niet op `.value`:
     een lijstvak verplaatst de selectie pas ná de gebeurtenis, dus op dat
     moment staat er nog de vorige keuze;
   - na een sleep wordt de selectie teruggezet op wat u sleepte, want tijdens
     het bewegen loopt de lijstvak-selectie met de muis mee.
   De plek bepaalt alleen de positie — de zone van een element komt uit Home
   Assistant (area) en niet uit waar u het neerzet. */
/* Slepen uit een lijst naar de plattegrond. Werkt voor beide lijsten: die van
   links (apparaten óf entiteiten, net wat er gekozen is) en de entity-keuze
   onder een apparaat. Het is dezelfde handeling, dus het is ook dezelfde code. */
function maakLijstSleepbaar(lijst, altijdEntiteit) {
  if (!lijst) return;
  lijst.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  if (!lijst.options.length) return;

  // Welk item staat er onder de vinger? Via dezelfde hulp als de rechtermuisklik,
  // die de kopjes van de groepen meetelt — `.value` is hier nog niet bijgewerkt.
  const optie = optieOnderAanwijzer(lijst, ev);
  const id = optie && optie.value;
  if (!id) return;

  const apparaten = !altijdEntiteit && STAAT.toev === "apparaten";
  const apparaat = apparaten ? (STAAT.apparaten || []).find(x => x.id === id) : null;
  const naam = apparaat ? apparaat.naam : (STAAT.namen && STAAT.namen[id]) || id;
  const x0 = ev.clientX, y0 = ev.clientY;
  let bezig = false;
  let ghost = null;

  const beweeg = e => {
    if (!bezig) {
      if (Math.hypot(e.clientX - x0, e.clientY - y0) < 7) return;   // nog een klik
      bezig = true;
      document.body.classList.add("sleept");
      ghost = document.createElement("div");
      ghost.id = "sleep-ghost";
      ghost.textContent = naam;
      document.body.appendChild(ghost);
    }
    ghost.style.left = (e.clientX + 14) + "px";
    ghost.style.top = (e.clientY + 10) + "px";
  };

  const einde = e => {
    document.removeEventListener("pointermove", beweeg);
    document.removeEventListener("pointerup", einde);
    document.removeEventListener("pointercancel", einde);
    if (ghost) ghost.remove();
    document.body.classList.remove("sleept");
    if (!bezig) return;                       // gewone klik: gewoon kiezen
    // De lijstvak-selectie liep met de muis mee; terug naar wat u sleepte.
    lijst.value = id;
    lijst.dispatchEvent(new Event("change", { bubbles: true }));

    const vlak = el("vlak");
    const r = vlak.getBoundingClientRect();
    const binnen = r.width >= 10 &&
      e.clientX >= r.left && e.clientX <= r.right &&
      e.clientY >= r.top && e.clientY <= r.bottom;
    if (!binnen) {
      meld(`Gelost buiten de plattegrond — "${naam}" is niet toegevoegd.`, "fout");
      return;
    }
    const positie = {
      l: (e.clientX - r.left) / r.width * 100,
      t: (e.clientY - r.top) / r.height * 100,
    };
    if (STAAT.toev === "voorwerpen") {
      voegVoorwerpToe(id, positie);
    } else if (apparaat) {
      voegToe(apparaat.primair,
        `Vanuit de lijst gesleept; dit is het gezicht van "${apparaat.naam}".`, positie);
    } else {
      voegToe(id, "Vanuit de lijst gesleept.", positie);
    }
  };

  document.addEventListener("pointermove", beweeg);
  document.addEventListener("pointerup", einde);
  document.addEventListener("pointercancel", einde);
  });
}

maakLijstSleepbaar(el("lijst-entiteiten"), false);
maakLijstSleepbaar(el("keuze-entity"), true);

/* Welke optie staat er onder de muis? Nodig voor slepen, de rechtermuisklik en
   de dubbelklik, want `.value` is op dat moment nog niet bijgewerkt.

   Niet met een vaste rijhoogte: sinds de voorwerpenlijst groepen heeft, zit er
   tussen twee groepen een kopje van een andere hoogte, en dan wees een vaste
   rijhoogte het verkeerde voorwerp aan. `offsetTop` van een `<option>` telt die
   kopjes wél mee — met de eerste rij als nulpunt, zodat het niet uitmaakt waar
   de lijst op de pagina staat. */
function optieOnderAanwijzer(lijst, ev) {
  if (!lijst || !lijst.options.length) return null;
  const vak = lijst.getBoundingClientRect();
  const nul = lijst.options[0].offsetTop;             // de eerste rij = nulpunt
  const y = ev.clientY - vak.top + lijst.scrollTop;
  let dichtst = lijst.options[0];
  let kleinste = Infinity;
  for (const o of lijst.options) {
    const boven = o.offsetTop - nul;
    const hoog = o.offsetHeight || 18;
    if (y >= boven && y < boven + hoog) return o;
    const afstand = y < boven ? boven - y : y - (boven + hoog);
    if (afstand < kleinste) { kleinste = afstand; dichtst = o; }
  }
  // Op een groepskopje of naast de lijst: dan de dichtstbijzijnde rij.
  return dichtst;
}

/* Rechtermuisklik op een regel in een keuzelijst: dezelfde voorwaardeklussen, en
   staat de entiteit nog niet op de kaart, dan kunt u hem hier meteen neerzetten —
   desgewenst in één beweging mét een voorwaarde. */
function lijstContextMenu(lijst, ev) {
  const optie = optieOnderAanwijzer(lijst, ev);
  if (!optie || !optie.value) return;
  ev.preventDefault();
  const id = optie.value;
  // Een voorwerp is geen entiteit: één regel, en meteen in de gekozen stijl.
  if (lijst === el("lijst-entiteiten") && STAAT.toev === "voorwerpen") {
    const v = voorwerpVan(id);
    contextMenu(ev, v ? v.naam : id, [{
      tekst: "Toevoegen aan de kaart",
      uitleg: "in de gekozen stijl, met de maat van hetzelfde voorwerp elders",
      doe: () => voegVoorwerpToe(id),
    }]);
    return;
  }
  const apparaat = (lijst === el("lijst-entiteiten") && STAAT.toev === "apparaten")
    ? (STAAT.apparaten || []).find(x => x.id === id)
    : null;
  const ent = apparaat ? apparaat.primair : id;
  const naam = apparaat ? apparaat.naam : (STAAT.namen[id] || id);
  const gevonden = elementenMetEntiteit(ent);
  const items = [];
  if (gevonden.length) {
    items.push(...elementMenuItems(gevonden[0]));
    items.push({ tekst: "Selecteren", doe: () => selecteer(gevonden[0]) });
    if (gevonden.length > 1) {
      items.push({ klein: `${gevonden.length} elementen met deze entiteit — het eerste wordt gebruikt` });
    }
  } else {
    items.push({ tekst: "Toevoegen aan de kaart", doe: () => voegToe(ent) });
    items.push({
      tekst: "Toevoegen mét een als … dan …",
      uitleg: "komt op de kaart en wordt meteen in een voorwaarde gezet",
      doe: () => {
        const nieuw = voegToe(ent);
        if (nieuw) voorwaardeToevoegen(nieuw);
      },
    });
  }
  contextMenu(ev, naam, items);
}
for (const lijst of [el("lijst-entiteiten"), el("keuze-entity")]) {
  if (!lijst) continue;
  lijst.addEventListener("contextmenu", ev => lijstContextMenu(lijst, ev));
  // Dubbelklik in de lijst: staat de entiteit op de kaart, dan de inspectie
  // openen. Staat hij er nog niet, dan is er niets om te tonen.
  lijst.addEventListener("dblclick", ev => {
    const o = optieOnderAanwijzer(lijst, ev);
    if (!o || !o.value) return;
    const apparaat = (lijst === el("lijst-entiteiten") && STAAT.toev === "apparaten")
      ? (STAAT.apparaten || []).find(x => x.id === o.value)
      : null;
    const ent = apparaat ? apparaat.primair : o.value;
    const gevonden = elementenMetEntiteit(ent);
    if (!gevonden.length) return;
    selecteer(gevonden[0]);
    inspectorZet(true);
  });
}

/* ---------- knoppen en toetsen ---------- */

el("variant").onchange = ev => { STAAT.variant = ev.target.value; tekenAlles(); pasVlakAan(); };
/* Elk vinkje tekent alleen opnieuw wat het aanraakt, zodat de rest van het
   beeld rustig blijft. `alleen kaders` en `grote naamvakjes` vervangen de
   inhoud en gaan daarom over het hele vlak. */
// Deze stand mag blijven staan: u kiest rechthoek of polygoon per klus, maar
// wilt hem niet elke keer opnieuw aanzetten.
try {
  const modus = localStorage.getItem(ZONE_MODUS_SLEUTEL);
  if (modus !== null) STAAT.weergave.zoneRechthoek = modus === "1";
} catch (_) { /* geen opslag */ }
const weergaveVinkjes = {
  "w-icoon": "icoon",
  "w-afbeelding": "afbeelding",
  "w-camera": "cameraBeelden",
  "w-zonebewerk": "zoneBewerken",
  "w-zone-rechthoek": "zoneRechthoek",
  "w-alleenkaders": "alleenKaders",
  "w-naamvak": "naamvak",
};
for (const [id, sleutel] of Object.entries(weergaveVinkjes)) {
  const vinkje = el(id);
  vinkje.checked = STAAT.weergave[sleutel];
  vinkje.onchange = () => { STAAT.weergave[sleutel] = vinkje.checked; tekenAlles(); };
}
// En die ene stand bewaren, zonder de gewone koppeling hierboven te verliezen.
const modusVinkje = el("w-zone-rechthoek");
const gewoneKoppeling = modusVinkje.onchange;
modusVinkje.onchange = ev => {
  gewoneKoppeling(ev);
  try { localStorage.setItem(ZONE_MODUS_SLEUTEL, STAAT.weergave.zoneRechthoek ? "1" : "0"); }
  catch (_) { /* geen opslag */ }
};
el("w-kaders").checked = STAAT.zoneLaag.aan;
el("w-zonebewerk").disabled = !STAAT.zoneLaag.aan;
el("w-kaders").onchange = ev => {
  STAAT.zoneLaag.aan = ev.target.checked;
  // Zonder kaders valt er niets te verschuiven: de knop uit en de stand ook,
  // anders blijft er een vinkje staan dat niets doet.
  const bewerk = el("w-zonebewerk");
  bewerk.disabled = !ev.target.checked;
  if (!ev.target.checked && bewerk.checked) {
    bewerk.checked = false;
    STAAT.weergave.zoneBewerken = false;
  }
  tekenZoneLagen();
};
el("toon-achtergrond").onchange = tekenAlles;
el("toon-groepen").onchange = tekenAlles;
el("zoek-entiteit").oninput = tekenZoeklijst;
el("toon-ongebruikt").onchange = tekenZoeklijst;
el("toon-verdiep").onchange = tekenZoeklijst;
el("filter").oninput = tekenLijst;

/* Welke van de vier lijsten er staat. Apparaten is de standaard, want op een
   plattegrond denkt u in lampen en apparaten, niet in entity-ids. De knoppen
   zelf staan in het HTML en tonen alleen een icoon; tekenGereedschap vult ze. */
const MODI = [
  ["wijz-apparaten", "apparaten"],
  ["wijz-entities", "entities"],
  ["wijz-persons", "persons"],
  ["wijz-helpers", "helpers"],
  ["wijz-voorwerpen", "voorwerpen"],
];
function toevModus(manus) {
  STAAT.toev = manus;
  for (const [id, m] of MODI) el(id).classList.toggle("aan", m === manus);
  // De stijlkeuze hoort alleen bij de voorwerpen.
  el("voorwerp-stijl-vak").classList.toggle("verborgen", manus !== "voorwerpen");
  tekenZoeklijst();
}
for (const [id, m] of MODI) el(id).onclick = () => toevModus(m);

/* De stijlkeuze voor de voorwerpen, gevuld uit voorwerpen.json. */
function bouwVoorwerpStijl() {
  const sel = el("voorwerp-stijl");
  if (!sel) return;
  sel.innerHTML = "";
  for (const s of (STAAT.voorwerpen && STAAT.voorwerpen.stijlen) || []) {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.naam;
    sel.appendChild(o);
  }
  sel.value = voorwerpStijl();
}
el("voorwerp-stijl").onchange = ev => {
  STAAT.voorwerpStijl = ev.target.value;
  try { localStorage.setItem("prototype.voorwerpstijl", STAAT.voorwerpStijl); } catch (_) { /* geen opslag */ }
  tekenZoeklijst();
  meld(`Voorwerpen worden nu getekend als "${ev.target.options[ev.target.selectedIndex].textContent}".`);
};

el("knop-toevoegen").onclick = voegApparaatToe;
el("knop-toevoegen-los").onclick = () => {
  const id = el("lijst-entiteiten").value;
  if (STAAT.toev === "voorwerpen") voegVoorwerpToe(id);
  else voegToe(id);
};
el("knop-toevoegen-entity").onclick = () => voegToe(el("keuze-entity").value);
/* De zone-laag: aan of uit, hoe dik de kadeer, welke kleur. */
el("zone-dikte").oninput = ev => { STAAT.zoneLaag.dikte = +ev.target.value; tekenZoneLagen(); };
el("zone-kleur").oninput = ev => { STAAT.zoneLaag.kleur = ev.target.value; tekenZoneLagen(); };

/* Waarvan de voorwaarden hun tak krijgen. 'handmatig' laat zien wat u zelf
   omklapt, 'uit de statussen' volgt de snapshot en toont dus wat de kaart van
  avond laat zien. */
el("condities").onchange = ev => {
  STAAT.condities = ev.target.value;
  document.body.classList.toggle("uitstatussen", STAAT.condities === "statussen");
  el("label-condities").textContent =
    STAAT.condities === "statussen" ? snapshotLabel() : "u bepaalt zelf de tak";
  tekenAlles();
};

/* ---------- het gereedschap: pan of select ---------- */

/* Pan is de stand waarin een sleep het beeld verplaatst en een element nooit
   van plek verandert. Dat is de veilige stand, dus die staat er standaard op. */
function greepZet(stand) {
  STAAT.greep = stand === "select" ? "select" : "pan";
  el("greep-pan").classList.toggle("aan", STAAT.greep === "pan");
  el("greep-select").classList.toggle("aan", STAAT.greep === "select");
  el("greep-pan").setAttribute("aria-pressed", String(STAAT.greep === "pan"));
  el("greep-select").setAttribute("aria-pressed", String(STAAT.greep === "select"));
  // De klasse op het vlak bepaalt de cursor: in de selectiestand wijst een
  // verschuifbaar element naar een kruis, in de panstand naar een handje.
  el("vlak").classList.toggle("knijp", STAAT.greep === "select");
  meldSelektie();
}

el("greep-pan").onclick = () => greepZet("pan");
el("greep-select").onclick = () => greepZet("select");

/* Een sleep op het vlak verplaatst het beeld. De selectiestand laat het aan het
   element zelf over, maar alleen als dat element kan schuiven — anders (een
   100%-brede laag, of het lege vlak) pánt dit ook. */
el("vlak").addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  if (ev.target.closest("input, select, textarea, button")) return;
  const doos = ev.target.closest(".el");
  const kandidaat = doos ? doos.__element : null;
  if (STAAT.greep === "select" && kandidaat && !doos.classList.contains("niet-verplaatsbaar")) return;
  ev.preventDefault();
  panVast(ev, kandidaat, ev.shiftKey || ev.ctrlKey || ev.metaKey);
});

/* In de bewerkstand hoort één zone actief te zijn: dat is de enige die
   hoekpunten en bediening krijgt. Bij het aanzetten neemt u de zojuist gekozen
   kamer mee als die er is, bij uitzetten is er niets meer om te bewerken.
   Deze handler vervangt die van de algemene lus hierboven. */
el("w-zonebewerk").onchange = ev => {
  STAAT.weergave.zoneBewerken = ev.target.checked;
  STAAT.zoneBewerkt = ev.target.checked ? (STAAT.zone || null) : null;
  tekenAlles();
};

/* De zonekiezer. Bij het wisselen van kamer springt het beeld naar die kamer
   toe, want anders ziet u een stukje van een kamer zonder context. */
function bouwZonekiezer() {
  const keuze = el("zone");
  keuze.innerHTML = "";
  const alles = document.createElement("option");
  alles.value = "";
  alles.textContent = "alle zones";
  keuze.appendChild(alles);
  // Alleen de kamers die bij dit verdiep horen — zone -> HA-area -> floor, en die
  // koppeling zet u in het ⚙-venster achter "verdiep". Zonder koppeling, of als
  // de gegevens er nog niet zijn, blijft de volledige lijst staan: dan is er
  // niets om eerlijk op te filteren. Nieuwe kamers maakt u in Home Assistant
  // zelf (als gebied, mét verdiep) — die verschijnen dan vanzelf hier.
  const gekoppeld = verdiepInstelling(STAAT.view).floor || "";
  const gebied = STAAT.vloeren && STAAT.vloeren.gebied;
  for (const z of zonesVanVerdiep()) {
    const o = document.createElement("option");
    o.value = z.id;
    o.textContent = z.naam;
    keuze.appendChild(o);
  }
  // Een gekozen kamer die niet meer in de lijst hoort: weg. Anders staat er een
  // selectie die niet bestaat en zoomt de knop op niets.
  if (STAAT.zone && ![...keuze.options].some(o => o.value === STAAT.zone)) STAAT.zone = null;
  keuze.value = STAAT.zone || "";
  if (gekoppeld && !gebied) verdiepDataOphalen();
}

el("zone").onchange = () => {
  STAAT.zone = el("zone").value || null;
  // Wie een kamer kiest terwijl hij ze aan het bijwerken is, bedoelt dat kader:
  // dat is dan het enige dat hoekpunten krijgt.
  if (STAAT.weergave.zoneBewerken) STAAT.zoneBewerkt = STAAT.zone || null;
  tekenAlles();
  if (!STAAT.zone) {
    // Terug naar het overzicht: ook het beeld weer terug, anders blijft u op 200%
    // naar een kader staan kijken waar de hele plattegrond in hoort.
    zoomZet(1);
    return;
  }
  const vlak = vlakVanZone(STAAT.zone);
  if (!vlak) return;
  zoomZet(zoomVoorZone(vlak));
  centreerOpVlak(vlak);
};
/* De verdiepkeuze. Elke view uit het document is een tabblad in HA. Een view
   zonder kaart — een leeg tabblad of een `sections`-lay-out — is te kiezen maar
   niets te bewerken; de reden staat in de optie en de + ernaast maakt er een
   kaart in. Grijs zou betekenen dat je er nooit meer bij komt. */
function bouwVerdiepkiezer() {
  const keuze = el("verdiep");
  if (!keuze) return;
  keuze.innerHTML = "";
  (STAAT.doc.views || []).forEach((view, i) => {
    const kaart = bewerkbareKaart(view);
    const secties = Array.isArray(view.sections) && view.sections.length > 0;
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = kaart
      ? `${view.title || "zonder naam"} — ${kaart.elements.length} elementen`
      : `${view.title || "zonder naam"} — ${secties ? "sections-lay-out" : "leeg"}, nog geen kaart`;
    keuze.appendChild(o);
  });
  keuze.value = String(STAAT.viewIndex);
  const weg = el("knop-verdiep-min");
  if (weg) weg.disabled = (STAAT.doc.views || []).length <= 1 || STAAT.viewIndex < 0;
}

el("verdiep").onchange = () => {
  const i = parseInt(el("verdiep").value, 10);
  if (!Number.isInteger(i) || i === STAAT.viewIndex) return;
  // Wisselen is geen documentbewerking: er is niets vast te leggen. Alleen de
  // tekening, de boom en de inspectie gaan mee.
  STAAT.viewIndex = i;
  onthoudVerdiep();
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  STAAT.zoneBewerkt = null;
  STAAT.zone = null;
  bouwStaats();
  bouwZonekiezer();
  bouwVerdiepkiezer();
  zoomZet(1);
  tekenAlles();
  // Ook de lijst links opnieuw: die filtert op het geopende verdiep ("huidig
  // verdiep"), en zonder deze regel blef de lijst van het vorige verdiep staan.
  tekenZoeklijst();
  toonPositie(null);
  const kaart = bewerkbareKaart(STAAT.doc.views[i]);
  meld(`Verdieping "${STAAT.doc.views[i].title || i}" open — ` +
       (kaart ? `${kaart.elements.length} elementen.` : "geen kaart om te bewerken."));
};

/* Een verdieping een kaart geven, of een nieuwe toevoegen. Zonder kaart valt
   er niets te bewerken — dat is precies waarom de lege tabbladen grijs staan.
   Heeft de geopende verdieping nog geen kaart, dan vullen we díe (de naam en
   het pictogram blijven zoals ze zijn); anders komt er een tabblad bij. */
async function verdiepToevoegen() {
  const views = STAAT.doc.views || [];
  const huidig = (STAAT.viewIndex >= 0 && views[STAAT.viewIndex]) || null;
  const leeg = huidig && !bewerkbareKaart(huidig);
  const kop = leeg ? `Verdieping "${huidig.title}" een kaart geven` : "Verdieping toevoegen";
  const uitleg = leeg
    ? `Deze verdieping heeft nog geen kaart, dus er valt niets te bewerken. Er komt ` +
      (Array.isArray(huidig.sections)
        ? "een kaart in de plaats van de sections-lay-out — er zit verder niets in, "
        : "een kaart in, ")
    : "Er komt een tabblad bij, met een lege kaart erin op de afbeelding die u kiest. " +
      "De bestandsnaam hoort in dezelfde map te liggen als de achtergrond van het " +
      "gelijkvloers; heeft u die nog niet, laat dit dan op home.png staan. "
  const invul = await vraagVenster({
    kop,
    uitleg: uitleg + "De afbeelding is een bestandsnaam uit de map van de " +
      "plattegrondafbeeldingen. U kunt dit met ↶ ongedaan maken.",
    velden: [
      { sleutel: "afbeelding", label: "Afbeelding (bestandsnaam)", waarde: "home.png" },
      ...(leeg ? [] : [{ sleutel: "titel", label: "Naam van het tabblad", waarde: "Nieuw verdiep" }]),
    ],
    okTekst: leeg ? "Kaart maken" : "Toevoegen",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Niet gedaan — er verandert niets."); return false; }
  const afb = (invul.afbeelding || "").trim().replace(/['"]/g, "") || "home.png";

  // De variabelen van een bestaande kaart: die leveren `vars[0]`, de map van de
  // achtergrondafbeeldingen, waar de afbeeldingsuitdrukking naar verwijst.
  const bron = views.find(bewerkbareKaart);
  const variabelen = (() => {
    for (const c of (bron && bron.cards) || []) {
      if (Array.isArray(c.variables)) return c.variables.slice();
    }
    return [];
  })();
  const kaart = {
    type: "custom:config-template-card",
    variables: variabelen,
    entities: [],
    hold_action: "none",
    tap_action: "none",
    card: {
      type: "picture-elements",
      image: "${vars[0] + '" + afb + "'}",
      elements: [],
      tap_action: { action: "none" },
    },
  };

  onthoud();
  let doel;
  if (leeg) {
    doel = huidig;
    // Een sections-lay-out krijgt een kaart in plaats van de (lege) secties;
    // anders blijft HA op de secties letten en zien we de kaart niet.
    if (Array.isArray(doel.sections)) delete doel.sections;
    if (!Array.isArray(doel.cards)) doel.cards = [];
    doel.cards.push(kaart);
  } else {
    const titel = (invul.titel || "").trim() || "Nieuw verdiep";
    doel = { title: titel, type: "panel", icon: "mdi:home-floor-3", cards: [kaart] };
    views.push(doel);
    STAAT.viewIndex = views.length - 1;
    onthoudVerdiep();
  }
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  STAAT.zoneBewerkt = null;
  STAAT.zone = null;
  bouwStaats();
  bouwZonekiezer();
  bouwVerdiepkiezer();
  zoomZet(1);
  tekenAlles();
  tekenZoeklijst();
  toonPositie(null);
  meld(`Kaart gemaakt op "${doel.title || "zonder naam"}" — leeg, u kunt er elementen in ` +
       `zetten. De afbeelding is ${afb}; ↶ draait dit ongedaan.`, "serieus");
  return true;
}

/* Een verdieping schrappen. Met bevestiging, want het tabblad en alles erop
   verdwijnen — en pas ná het opslaan in Home Assistant is het definitief. */
async function verdiepVerwijderen() {
  const views = STAAT.doc.views || [];
  const i = STAAT.viewIndex;
  if (i < 0 || views.length <= 1) {
    meld("Dit is de enige verdieping — die kan niet weg.", "fout");
    return false;
  }
  const view = views[i];
  const kaart = bewerkbareKaart(view);
  const n = kaart ? kaart.elements.length : 0;
  const ok = await vraagVenster({
    kop: `Verdieping "${view.title || i}" schrappen?`,
    uitleg: `Het tabblad en alles erop verdwijnen uit het document: ${n} elementen. ` +
      "De andere verdiepingen blijven ongemoeid. Met ↶ kunt u dit nog ongedaan " +
      "maken; definitief wordt het pas als u in Home Assistant opslaat.",
    okTekst: "Ja, schrappen",
    cancelTekst: "Blijven zoals het is",
  });
  if (!ok) { meld("Niet geschrapt."); return false; }
  onthoud();
  views.splice(i, 1);
  STAAT.viewIndex = Math.max(0, Math.min(i, views.length - 1));
  onthoudVerdiep();
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  STAAT.zoneBewerkt = null;
  STAAT.zone = null;
  bouwStaats();
  bouwZonekiezer();
  bouwVerdiepkiezer();
  zoomZet(1);
  tekenAlles();
  tekenZoeklijst();
  toonPositie(null);
  meld(`Verdieping "${view.title || i}" geschrapt — ${views.length} over. ↶ brengt hem terug.`, "serieus");
  return true;
}

/* De instellingen van het geopende verdiep: aan welke Home Assistant-floor dit
   tabblad hoort (daarmee filtert de lijst "huidig verdiep"), en per variant
   welke achtergrondafbeelding erbij hoort. Dit is de enige plek waar die
   koppeling gemaakt wordt — geen titel-afleiding, geen giswerk. */
el("knop-verdiep-inst").onclick = async () => {
  const view = (STAAT.doc.views || [])[STAAT.viewIndex];
  if (!view) { meld("Eerst een verdieping kiezen.", "fout"); return; }
  const huidig = verdiepInstelling(view);
  const sleutel = verdiepSleutel(view);

  meld("Floors van Home Assistant ophalen…");
  const vloeren = await vloerenLijst();
  const lijst = Array.isArray(vloeren) ? vloeren : [];
  if (!lijst.length) {
    meld("De floors van Home Assistant zijn niet bereikbaar — u kunt nu alleen de " +
      "afbeeldingen instellen. Koppelen lukt later, als de ⚙-instellingen kloppen.", "fout");
  }
  const opties = [{ waarde: "", label: "— geen koppeling —" }]
    .concat(lijst.map(f => ({ waarde: f.floor_id, label: f.name })));

  // Wat er écht in elke variantmap ligt. Zes kleine `HEAD`-vragen — en dan staat
  // er bij het veld meteen of die naam daar te vinden is. Zonder dit werd een
  // bestand dat alleen in `day/` ligt 's nachts een lege achtergrond waar niets
  // bij gezegd werd.
  const huidigeNamen = VARIANTEN.map(v => String((huidig.afbeeldingen || {})[v] || "").trim());
  const staatEr = await Promise.all(VARIANTEN.map((v, i) => variantBestaat(v, huidigeNamen[i])));

  const velden = [
    { sleutel: "floor", label: "Hoort bij welke Home Assistant-floor?",
      type: "keuze", opties: opties, waarde: huidig.floor || "" },
  ];
  for (const [i, v] of VARIANTEN.entries()) {
    velden.push({
      sleutel: "afb-" + v,
      label: `Achtergrond voor ${v}`,
      waarde: huidigeNamen[i],
      placeholder: "bestandsnaam, bijvoorbeeld 1e_verdiep.png",
      // Alleen iets zeggen als er iets mis is; klopt het, dan zegt de stilte genoeg.
      letOp: !huidigeNamen[i] || staatEr[i] === true ? null
        : staatEr[i] === false
          ? `✗ ${huidigeNamen[i]} ligt niet in ${v}/ — de kaart vraagt hem daar wel`
          : `kon niet controleren of ${huidigeNamen[i]} in ${v}/ ligt`,
    });
  }
  velden.push({
    sleutel: "vulVanuit",
    label: "Ontbrekende varianten vullen met de foto van",
    type: "keuze",
    opties: [{ waarde: "", label: "— niet vullen —" }].concat(VARIANTEN),
    waarde: "",
  });
  velden.push({ sleutel: "opladenNaar", label: "Ophalen: de foto gaat naar variant",
    type: "keuze", opties: VARIANTEN, waarde: STAAT.variant });
  velden.push({ sleutel: "opladenBestand", label: "…en het bestand is (png, jpg, webp)",
    type: "file", accept: "image/png,image/jpeg,image/webp" });

  const invul = await vraagVenster({
    kop: `Instellingen van "${view.title || view.path || "verdiep"}"`,
    uitleg: "De koppeling bepaalt wat de toggle 'huidig verdiep' in de lijst links " +
      "toont: alleen apparaten en entiteiten die bij die Home Assistant-floor horen. " +
      "Zonder koppeling toont de lijst alles — dat is een instelling, geen fout. " +
      "De afbeeldingen gelden per variant (day, night, …) en gaan vóór wat de kaart " +
      "noemt; een foto die u hieronder ophaalt gaat naar de map van die variant en " +
      "de naam komt er meteen bij te staan. Ligt een naam niet in de map van die " +
      "variant, dan staat dat erbij — en met 'ontbrekende varianten vullen' zet u " +
      "dezelfde foto in één keer overal.",
    velden: velden,
    okTekst: "Zetten",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Instellingen niet gewijzigd — niets ingevuld."); return; }

  const afbeeldingen = { ...(huidig.afbeeldingen || {}) };
  for (const v of VARIANTEN) {
    const naam = (invul["afb-" + v] || "").trim().replace(/['"]/g, "");
    if (naam) afbeeldingen[v] = naam; else delete afbeeldingen[v];
  }

  const bestand = invul.opladenBestand;
  if (bestand) {
    const variant = (invul.opladenNaar || STAAT.variant || "day").trim();
    meld(`"${bestand.name}" ophalen naar Home Assistant (map ${variant}/)…`);
    if (!await uploadAfbeelding(bestand, `first_floor/${variant}/${bestand.name}`)) return;
    afbeeldingen[variant] = bestand.name;    // de melding is al gedaan
  }

  // En desgewenst in één beweging hetzelfde beeld in de varianten die het nog
  // niet hebben — dat scheelt vijf keer hetzelfde bestand ophalen.
  let gevuld = "";
  const vulVanuit = (invul.vulVanuit || "").trim();
  if (vulVanuit) {
    const naamBron = String(afbeeldingen[vulVanuit] || "").trim();
    if (!naamBron) {
      meld(`Voor ${vulVanuit} staat geen bestandsnaam — er is niets gevuld.`, "fout");
      return;
    }
    const uitkomst = await kopieerNaarOntbrekendeVarianten(vulVanuit, naamBron, afbeeldingen);
    if (uitkomst === null) return;           // misgegaan, er is al gemeld
    gevuld = uitkomst;
  }

  const alles = verdiepInstellingen();
  alles[sleutel] = { floor: (invul.floor || "").trim(), afbeeldingen };
  bewaarVerdiepInstellingen(alles);

  // De koppeling kan veranderd zijn: het oude oordeel vergeten, en opnieuw
  // ophalen en tekenen. Zonder dit bleef een eerdere conclusie staan.
  STAAT.vloeren = null;
  STAAT.vloerenBelofte = null;
  pasVlakAan();
  tekenAlles();
  tekenZoeklijst();
  const namen = Object.keys(afbeeldingen);
  meld(`Instellingen van "${view.title || sleutel}" bewaard` +
    (alles[sleutel].floor ? ` — gekoppeld aan ${alles[sleutel].floor}.`
      : " — geen koppeling, dus de lijst toont alles.") +
    (namen.length ? ` Afbeeldingen voor: ${namen.join(", ")}.` : "") +
    gevuld, "serieus");
};

el("knop-verdiep-plus").onclick = verdiepToevoegen;
el("knop-verdiep-min").onclick = verdiepVerwijderen;

/* Het inspectievenster: zwevend boven de kaart, standaard dicht. Openen doet u
   met een dubbelklik (boom, lijst of kaart); sluiten met het kruisje — de
   selectie blijft dan gewoon staan. */
function inspectorZet(open) {
  const p = el("inspector-paneel");
  if (!p) return;
  p.classList.toggle("verborgen", !open);
  // Bij het openen weer binnen `main` passen: het venster kan verplaatst zijn en
  // het scherm kan intussen smaller geworden zijn.
  if (open) paneelPlekKlem();
  // De kaart krijgt meer of minder breedte, dus opnieuw meten en tekenen.
  pasVlakAan();
  tekenAlles();
}
el("inspector-sluit").onclick = () => inspectorZet(false);

/* Welk tabblad van het inspectievenster openstaat. Het blijft staan waar u het
   liet: dubbelklikt u met het YAML-tabblad open op het volgende element, dan
   ziet u meteen weer de YAML — meestal bent u even in dezelfde dingen bezig. */
function inspectieTab(naam) {
  const p = el("inspector-paneel");
  if (!p) return;
  for (const t of p.querySelectorAll(".tabbladen .tab")) {
    const aan = t.dataset.tab === naam;
    t.classList.toggle("aan", aan);
    t.setAttribute("aria-selected", aan ? "true" : "false");
  }
  for (const v of p.querySelectorAll(".tabpaneel")) {
    v.classList.toggle("verborgen", v.id !== "tabpaneel-" + naam);
  }
}
for (const t of document.querySelectorAll("#inspector-paneel .tabbladen .tab")) {
  t.onclick = () => inspectieTab(t.dataset.tab);
}

/* ------------------- het inspectievenster verplaatsen -------------------

   De titelbalk is de greep. Het venster blijft daarbij binnen `main`: dus nooit
   over het menu, en nooit half buiten beeld — ook niet als het venster daarna
   kleiner wordt. De plek wordt onthouden in deze browser, zodat het staat waar u
   het liet; dubbelklikken op de titel zet het terug op de vaste plek. */

const PANEEL_SLEUTEL = "prototype.inspectiepaneel";

/* Zet het venster op een plek binnen `main`, of terug op zijn vaste plek als er
   geen plek is opgegeven. */
function paneelPlekZetten(l, t) {
  const p = el("inspector-paneel");
  const main = document.querySelector("main");
  if (!p || !main) return;
  if (l === undefined || t === undefined) {
    p.style.left = "";
    p.style.top = "";
    p.style.right = "";
    return;
  }
  const m = main.getBoundingClientRect();
  const breed = p.offsetWidth;
  const hoog = Math.min(p.offsetHeight, m.height);
  p.style.right = "auto";
  p.style.left = Math.round(Math.min(Math.max(0, l), Math.max(0, m.width - breed))) + "px";
  p.style.top = Math.round(Math.min(Math.max(0, t), Math.max(0, m.height - hoog))) + "px";
}

/* Terug in het vak. Nodig als het venster kleiner wordt, of als een balk erbij
   komt en `main` dus smaller wordt. */
function paneelPlekKlem() {
  const p = el("inspector-paneel");
  if (!p || p.classList.contains("verborgen")) return;
  const l = parseFloat(p.style.left);
  const t = parseFloat(p.style.top);
  if (Number.isNaN(l) || Number.isNaN(t)) return;   // staat nog op zijn vaste plek
  paneelPlekZetten(l, t);
}

function paneelPlekBewaren() {
  const p = el("inspector-paneel");
  const main = document.querySelector("main");
  if (!p || !main) return;
  const m = main.getBoundingClientRect();
  const r = p.getBoundingClientRect();
  try {
    localStorage.setItem(PANEEL_SLEUTEL, JSON.stringify({
      l: Math.round(r.left - m.left), t: Math.round(r.top - m.top),
    }));
  } catch (e) {
    // Opslag vol of geblokkeerd: dan geldt de plek alleen voor deze sessie.
  }
}

function paneelPlekTerug() {
  const p = el("inspector-paneel");
  if (!p) return;
  let bewaard = null;
  try { bewaard = JSON.parse(localStorage.getItem(PANEEL_SLEUTEL) || "null"); } catch (e) { bewaard = null; }
  if (!bewaard || typeof bewaard.l !== "number" || typeof bewaard.t !== "number") return;
  p.style.right = "auto";
  p.style.left = bewaard.l + "px";
  p.style.top = bewaard.t + "px";
}

(function maakPaneelSleepbaar() {
  const p = el("inspector-paneel");
  const main = document.querySelector("main");
  const kop = p && p.querySelector(".kop");
  if (!p || !main || !kop) return;
  kop.onpointerdown = ev => {
    if (ev.target.closest("button")) return;         // het kruisje is geen greep
    ev.preventDefault();
    const m = main.getBoundingClientRect();
    const r = p.getBoundingClientRect();
    const greep = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    // Vanaf hier met `left`/`top` werken: met `right` erbij zou het venster op
    // zijn oude plek blijven staan.
    p.style.right = "auto";
    p.style.left = (r.left - m.left) + "px";
    p.style.top = (r.top - m.top) + "px";
    kop.classList.add("sleept");
    // Pointer-capture houdt de beweging bij de greep, ook als de aanwijzer
    // buiten het venster komt. Lukt dat niet, dan luisteren we op het venster
    // zelf — anders stopt het slepen zodra u de titelbalk verlaat.
    let vast = true;
    try { kop.setPointerCapture(ev.pointerId); } catch (e) { vast = false; }
    const doel = vast ? kop : window;
    const beweeg = e2 =>
      paneelPlekZetten(e2.clientX - greep.x - m.left, e2.clientY - greep.y - m.top);
    const stop = () => {
      kop.classList.remove("sleept");
      doel.removeEventListener("pointermove", beweeg);
      doel.removeEventListener("pointerup", stop);
      doel.removeEventListener("pointercancel", stop);
      paneelPlekBewaren();
    };
    doel.addEventListener("pointermove", beweeg);
    doel.addEventListener("pointerup", stop);
    doel.addEventListener("pointercancel", stop);
  };
  // Dubbelklikken op de titel: terug naar de vaste plek rechtsboven.
  kop.ondblclick = ev => {
    if (ev.target.closest("button")) return;
    paneelPlekZetten();
    try { localStorage.removeItem(PANEEL_SLEUTEL); } catch (e) { /* niets */ }
    meld("Het inspectievenster staat weer rechtsboven.");
  };
})();

paneelPlekTerug();

/* Een foto van uw computer naar de plaatjesmap van Home Assistant.

   Rechtstreeks kan het niet: een webpagina mag geen bestanden op de server
   zetten. De integratie (floorplan_layout) heeft daar een smal PUT-endpoint
   voor — alleen png/jpg/webp, alleen binnen de plaatjesmap, nooit groter dan
   20 MB. Lukt het niet (endpoint nog niet geladen, geen token, verkeerd
   adres), dan zet u de foto er zelf via Samba; de editor blijft werken. */
async function uploadAfbeelding(bestand, pad) {
  const inst = haInstelling();
  if (!inst.url || !inst.token) {
    meld("Uploaden kan niet: er staan nog geen instellingen (⚙) — adres en " +
         "long-lived access token.", "fout");
    return false;
  }
  const url = `${inst.url.replace(/\/+$/, "")}` +
    `/api/floorplan_layout/afbeelding/${encodeURI(pad)}`;
  let r;
  try {
    r = await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${inst.token}`,
        "Content-Type": bestand.type || "image/png",
      },
      body: bestand,
    });
  } catch (e) {
    meld(`Uploaden mislukt: ${e}. Het endpoint verschijnt pas als de integratie ` +
         `"floorplan_layout" opnieuw geladen is (instellingen → apps → herladen).`, "fout");
    return false;
  }
  if (!r.ok) {
    // Eén keer de body lezen, dan kijken of er een melding in zit. Komt er iets
    // anders terug (bijvoorbeeld een kale foutpagina), dan tonen we dát — een
    // "HTTP 500" zonder uitleg laat je anders uren in de log zoeken.
    let reden = `HTTP ${r.status}${r.statusText ? " " + r.statusText : ""}`;
    try {
      const tekst = (await r.text()).replace(/\s+/g, " ").trim();
      let bericht = null;
      try { bericht = (JSON.parse(tekst) || {}).message || null; } catch (_) { /* geen JSON */ }
      reden = bericht || (tekst ? `${reden} — ${tekst.slice(0, 160)}` : reden);
    } catch (_) { /* geen body te lezen */ }
    meld(`Uploaden mislukt: ${reden}`, "fout");
    return false;
  }
  const antwoord = await r.json().catch(() => ({}));
  // De foto staat er nu in de oude vorm: een verse stempel, anders toont de
  // browser de versie die hij nog kent.
  beeldStempelZet(pad);
  meld(`"${antwoord.bestand || pad}" ligt nu in de plaatjesmap ` +
       `(${antwoord.bytes || bestand.size} bytes).`, "serieus");
  return true;
}

/* De varianten die de werkbalk al kent — uitgelezen in plaats van overgetypt,
   zodat er nooit twee lijstjes naast elkaar kunnen gaan leven. */
const VARIANTEN = [...document.querySelectorAll("#variant option")].map(o => o.value);

/* Ligt dat bestand écht in de map van deze variant? Een `HEAD` op precies de URL
   die de kaart gebruikt: 200 of 404. Nodig omdat de kaart de map per tijdstip
   kiest — een naam die alleen in `day/` ligt, geeft 's nachts een lege
   achtergrond zonder dat iemand zegt waarom. `null` = geen uitsluitsel. */
async function variantBestaat(variant, naam) {
  if (!variant || !naam || isUitdrukking(naam)) return null;
  const url = `/local/jdi_custom_images/floorplans/first_floor/` +
    `${encodeURIComponent(variant)}/${encodeURIComponent(naam)}`;
  try {
    const r = await fetch(url, { method: "HEAD", cache: "no-store" });
    return r.ok;
  } catch (e) {
    return null;
  }
}

/* De foto van de ene variant in alle mappen zetten waar hij nog niet ligt: één
   handeling in plaats van zes keer hetzelfde bestand ophalen. Geeft een zin terug
   voor de melding, of null als het misging (dan is er al gemeld). */
async function kopieerNaarOntbrekendeVarianten(bronVariant, naamBron, afbeeldingen) {
  if (isUitdrukking(naamBron)) {
    meld(`${bronVariant} staat op een uitdrukking in plaats van een bestandsnaam — ` +
         `er is niets gevuld.`, "fout");
    return null;
  }
  const bronUrl = `/local/jdi_custom_images/floorplans/first_floor/` +
    `${encodeURIComponent(bronVariant)}/${encodeURIComponent(naamBron)}`;
  let blob = null;
  try {
    const r = await fetch(bronUrl, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    blob = await r.blob();
  } catch (e) {
    meld(`De foto van ${bronVariant} kon niet opgehaald worden (${e}) — ` +
         `er is niets gevuld.`, "fout");
    return null;
  }
  let gedaan = 0;
  for (const v of VARIANTEN) {
    if (v === bronVariant) continue;
    const naam = String(afbeeldingen[v] || naamBron).trim() || naamBron;
    if (await variantBestaat(v, naam)) continue;         // ligt er al
    const bestand = new File([blob], naam, { type: blob.type || "image/png" });
    if (!await uploadAfbeelding(bestand, `first_floor/${v}/${naam}`)) return null;
    afbeeldingen[v] = naam;
    gedaan++;
  }
  return gedaan
    ? ` De foto van ${bronVariant} is in ${gedaan} variant${gedaan === 1 ? "" : "en"} gezet.`
    : ` Alle varianten hadden die foto al.`;
}

/* De achtergrondafbeelding van de geopende verdieping: een bestandsnaam die er
   al ligt, of een foto die we nu zelf kunnen ophalen. */
el("knop-verdiep-afb").onclick = async () => {
  const view = (STAAT.doc.views || [])[STAAT.viewIndex];
  const kaart = bewerkbareKaart(view);
  if (!kaart) {
    meld("Deze verdieping heeft nog geen kaart — maak er eerst een met de + naast 'verdiep'.",
         "fout");
    return;
  }
  const invul = await vraagVenster({
    kop: `Achtergrond van "${view.title}"`,
    uitleg: "De afbeelding hoort in /config/www/jdi_custom_images/floorplans/" +
      "first_floor/<variant>/. Kiest u hieronder een bestand van uw computer, dan gaat " +
      "het via Home Assistant die map in; anders zet u de foto er zelf (Samba, SFTP of " +
      "een bestandsbeheer-add-on) en vult u alleen de naam in. De verhouding moet ongeveer " +
      "die van de plattegrond blijven (nu ± 2:1), anders schuiven de posities van alle " +
      "elementen mee. De wijziging geldt pas ná 💾.",
    velden: [
      { sleutel: "afbeelding", label: "Naam van een bestand dat er al ligt",
        waarde: afbeeldingVan(kaart) || "home.png" },
      { sleutel: "bestand", label: "of: een foto van uw computer (png, jpg, webp)",
        type: "file", accept: "image/png,image/jpeg,image/webp" },
      { sleutel: "variant", label: "Naar welke map (variant)? — geldt bij het ophalen",
        type: "keuze", opties: VARIANTEN, waarde: STAAT.variant },
    ],
    okTekst: "Zetten",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Niets veranderd."); return; }

  const huidig = afbeeldingVan(kaart);
  const variant = (invul.variant || STAAT.variant || "").trim();
  let naam = (invul.afbeelding || "").trim().replace(/['"]/g, "");
  let waarLigtHet = "";
  const bestand = invul.bestand;
  if (bestand) {
    naam = bestand.name;
    const pad = `first_floor/${variant}/${naam}`;
    meld(`"${naam}" ophalen naar Home Assistant (map ${variant}/)…`);
    if (!await uploadAfbeelding(bestand, pad)) return;   // de melding is al gedaan
    // De editor toont de map die in de werkbalk staat. Ligt het bestand in een
    // andere, dan volgt het dashboard die vanzelf (via sensor.img_path_2d), maar
    // ziet u hier nog een leeg vlak — dus we zeggen er eerlijk bij waar het ligt.
    if (variant && variant !== STAAT.variant) {
      waarLigtHet = ` Het bestand ligt in ${variant}/; de editor toont ${STAAT.variant}/, ` +
        `dus de achtergrond hier blijft leeg tot die map actief is.`;
    }
  }
  if (!naam) { meld("Niets veranderd — geen bestandsnaam en geen bestand gekozen."); return; }
  if (naam === huidig) { meld("Niets veranderd — dezelfde naam."); return; }

  onthoud();
  kaart.image = "${vars[0] + '" + naam + "'}";
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  bouwStaats();
  pasVlakAan();
  tekenAlles();
  tekenZoeklijst();
  meld(`Achtergrond van "${view.title}" is nu ${naam}` +
       (huidig ? ` (was ${huidig})` : "") + waarLigtHet +
       ". Nog niet in Home Assistant — dat gebeurt bij 💾.", "serieus");
};

/* De twee linker balken hangen elk aan een eigen knop in de menubalk. De knop
   blijft 'aan' zolang de balk te zien is, zodat altijd duidelijk is wat er
   achter een lege plek verborgen zit. Het vlak moet mee omdat de maat van het
   werkgebied verandert — een gewone window-resize krijgt die melding niet. */
function balkZet(knopId, selector) {
  const balk = document.querySelector(selector);
  const knop = el(knopId);
  if (!balk || !knop) return;
  const weg = balk.classList.toggle("verborgen");
  knop.classList.toggle("aan", !weg);
  knop.setAttribute("aria-pressed", String(!weg));
  pasVlakAan();
  // Een balk erbij of eraf maakt `main` smaller of breder — het inspectievenster
  // moet dan mee binnen het vak blijven.
  paneelPlekKlem();
  tekenAlles();
}
el("knop-balk-toevoegen").onclick =
  () => balkZet("knop-balk-toevoegen", "aside.toevoegen");
el("knop-balk-lijst").onclick =
  () => balkZet("knop-balk-lijst", "aside.lijst");

/* Het kruisje op de balk zelf doet precies hetzelfde als de knop in de
   gereedschapsbalk — dezelfde weg, dus ook dezelfde stand van dat knopje. */
el("sluit-toevoegen").onclick = () => el("knop-balk-toevoegen").click();
el("sluit-lijst").onclick = () => el("knop-balk-lijst").click();

/* De statussen zijn een momentopname uit statussen.json; die wordt eenmaal bij
   het opstarten gehaald. Met deze knop haalt u ze opnieuw op — met een
   `t=` erbij, want anders bewaart de browser het oude bestand.

   Alleen opnieuw tekenen is níét genoeg: in de stand 'handmatig' (de
   standaard) lezen de boom én de `if`-structuren `c.__aan`, en die staat op de
   stand van het moment van openen. Vandaar dat de snapshot opnieuw wordt
   ingezaaid — met uitzondering van de rondjes die u zélf hebt omgedraaid. */
el("knop-refresh").onclick = async () => {
  const knop = el("knop-refresh");
  knop.disabled = true;
  try {
    const r = await fetch("statussen.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const stat = await r.json();
    STAAT.states = (stat && stat.states) || {};
    STAAT.eenheden = (stat && stat.eenheden) || {};
    STAAT.snapshotBron = (stat && stat._bron) || "";
    const n = Object.keys(STAAT.states).length;
    el("label-condities").textContent = snapshotLabel();
    const bijgewerkt = seedVoorwaarden(STAAT.kaart ? STAAT.kaart.elements : []);
    tekenAlles();
    if (!n) {
      meld("statussen.json is leeg of ontbreekt — labels tonen de entity-id.");
    } else {
      meld(`Statussen opnieuw opgehaald: ${n} states.` +
        (bijgewerkt
          ? ` ${bijgewerkt} voorwaarde${bijgewerkt === 1 ? "" : "n"} omgedraaid; ` +
            `uw eigen omkeringen zijn daarmee teruggezet.`
          : ""));
    }
  } catch (e) {
    meld("Statussen ophalen mislukt: " + e, "fout");
  } finally {
    knop.disabled = false;
  }
};

/* Het dashboard zelf ophalen: opnieuw beginnen op de háldige stand uit Home
   Assistant. Dit is de knop die u zoekt als u in HA iets heeft verplaatst;
   de ⟳-knop ernaast blijft alleen voor de statussen. */
el("knop-haaldashboard").onclick = async () => {
  if (isGewijzigd()) {
    const d = verschilDashboards(JSON.parse(STAAT.voorbeeld), STAAT.doc);
    const ok = await vraagVenster({
      kop: "Opnieuw ophalen uit Home Assistant?",
      uitleg: "Uw onopgeslagen bewerkingen gaan verloren: het document wordt " +
              "vervangen door wat er nú in Home Assistant staat.",
      lijsten: verschilLijsten(d, {
        gewijzigd: "uw aanpassingen (gaan verloren)",
        weg: "verwijderd door u",
        bij: "toegevoegd door u (gaat verloren)",
      }),
      links: `bron ${d.live} elementen · nu ${d.nieuw} in de editor`,
      okTekst: "Ja, opnieuw ophalen",
      cancelTekst: "Blijven zoals het is",
    });
    if (!ok) { meld("Niet opnieuw opgehaald — uw bewerkingen blijven staan."); return; }
  }

  const knop = el("knop-haaldashboard");
  knop.disabled = true;
  // Zelfde idee als bij het wegschrijven: bij een verbindingsfout krijgt u het
  // instellingenvenster met het adres erin, en gaat het opnieuw proberen.
  for (let poging = 0; poging < 3; poging++) {
    try {
      meld("Dashboard ophalen uit Home Assistant…");
      const live = await haDashboardOphalen();
      if (!live.config) {
        if (live.reden === "geen token") {
          const inst = await vraagInstelling(haInstelling());
          if (!inst) {
            meld("Nog geen token ingevuld: de editor blijft op de momentopname.", "fout");
            return;
          }
          continue;
        }
        const fout = "Dashboard ophalen mislukt: " + live.reden;
        if (isInstellingsfout(live.reden)) {
          const opnieuw = await vraagInstelling(haInstelling(), foutUitleg(fout));
          if (opnieuw) continue;
        }
        meld(fout, "fout");
        return;
      }
      documentZetten(live.config, "live uit Home Assistant, net opgehaald");
      STAAT.geselecteerd = null;
      STAAT.selektie.clear();
      STAAT.verborgen.clear();
      tekenAlles();
      tekenZoeklijst();
      toonPositie(null);
      toonMarkeringenLabel();
      meld(`Dashboard opgehaald: ${aantal()} elementen, ${STAAT.bron}.`, "serieus");
      return;
    } catch (e) {
      meld("Dashboard ophalen mislukt: " + (e && e.message ? e.message : e), "fout");
      return;
    } finally {
      knop.disabled = false;
    }
  }
  meld("Afgebroken: drie keer geen verbinding met Home Assistant.", "fout");
};

/* Instellingen te allen tijde te wijzigen — niet alleen als er iets misgaat
   (⚠ uw token kan vervallen: dan vervangt u het hier gewoon). Het tokenveld
   komt leeg; leeg laten betekent het huidige behouden. */
el("knop-instellingen").onclick = async () => {
  const huidig = haInstelling();
  const inst = await vraagInstelling(
    huidig,
    huidig.token
      ? "Er staan al instellingen opgeslagen. Wat u invult overschrijft dat; " +
        "laat het tokenveld leeg om het huidige te behouden."
      : "Nog geen instellingen: vul hieronder het adres en een token in.",
    "Bewaren");
  if (!inst) { meld("Instellingen niet gewijzigd — niets ingevuld."); return; }

  const wijzig = [];
  if (huidig.url !== inst.url) wijzig.push(`adres → ${inst.url}`);
  if (huidig.token !== inst.token) wijzig.push("token vervangen");
  if (huidig.pad !== inst.pad) wijzig.push(`dashboard → ${inst.pad}`);
  // Nu er een token is kunnen de camerabeelden voor het eerst opgehaald
  // worden; opnieuw tekenen zodat ze meteen verschijnen in plaats van pas bij
  // uw volgende handeling.
  // Hetzelfde geldt voor de verdiepdata: was die eerder mislukt omdat er nog
  // geen instellingen stonden, dan blijft dat oordeel anders voor altijd
  // staan. Oordeel vergeten, en opnieuw proberen.
  STAAT.vloeren = null;
  STAAT.vloerenBelofte = null;
  tekenZoeklijst();
  tekenAlles();
  meld(wijzig.length
    ? `Instellingen bewaard — ${wijzig.join(" · ")}. Test het met de wolk-knop.`
    : "Instellingen ongewijzigd gelaten.", "serieus");
};

el("knop-ongedaan").onclick = ongedaanMaken;
el("knop-zoom-in").onclick = () => zoomStap(1);
el("knop-zoom-uit").onclick = () => zoomStap(-1);
el("knop-zoom-pas").onclick = () => { STAAT.zoom = 1; zoomZet(1); };

/* Herstellen grijpt in op het hele document, dus eerst laten zien wat er
   verloren gaat. Zonder dit venster zou één verkeerde klik al uw
   verschuivingen weggooien. */
el("knop-herstellen").onclick = async () => {
  if (!isGewijzigd()) {
    meld("Er is niets om ongedaan te maken — u staat al op de bron.");
    return;
  }
  const d = verschilDashboards(JSON.parse(STAAT.voorbeeld), STAAT.doc);
  const ok = await vraagVenster({
    kop: "Terug naar de bron?",
    uitleg: `Uw bewerkingen worden ongedaan gemaakt en het document wordt ` +
            `weer precies wat er in ${STAAT.bron} staat.`,
    lijsten: verschilLijsten(d, {
      gewijzigd: "uw aanpassingen (worden teruggedraaid)",
      weg: "verwijderd door u (komt terug)",
      bij: "toegevoegd door u (verdwijnt)",
    }),
    links: `bron ${d.live} elementen → nu ${d.nieuw} elementen in de editor`,
    okTekst: "Ja, herstellen",
    cancelTekst: "Blijven zoals het is",
  });
  if (!ok) { meld("Niet hersteld — uw bewerkingen blijven staan."); return; }

  STAAT.doc = JSON.parse(STAAT.voorbeeld);
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  STAAT.verborgen.clear();
  bouwStaats();
  bouwVerdiepkiezer();
  pasVlakAan();
  tekenAlles();
  toonPositie(null);
  meld(`Terug op ${STAAT.bron}.`);
};
/* Twee knoppen, één inhoud: `exportDoc()` levert hetzelfde document, alleen de
   vorm verschilt. JSON is precies de vorm waarin dit bestand binnenkwam (wat HA
   in `.storage` bewaart); YAML is voor wie in YAML-mode werkt en het bestand in
   `ui-lovelace.yaml` houdt. */
function download(tekst, naam, mime) {
  const blob = new Blob([tekst], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = naam;
  a.click();
  URL.revokeObjectURL(a.href);
}
const exportMelding = vorm =>
  `Bestand gedownload als ${vorm}: ${aantal()} elementen van u, plus ` +
  `${STAAT.markerTotaal} unavailable-markeringen op de plek van het item. ` +
  `Het is alleen een bestand — Home Assistant is niet aangeraakt. ` +
  `Zeg het als u wilt dat ik het terugzet in het dashboard.`;

el("knop-export").onclick = () => {
  download(JSON.stringify(exportDoc(), null, 2),
           "2d-floorplan.bewerkt.json", "application/json");
  meld(exportMelding("JSON"), "serieus");
};

el("knop-export-yaml").onclick = () => {
  download(documentYAML(exportDoc()),
           "2d-floorplan.bewerkt.yaml", "application/yaml");
  meld(exportMelding("YAML"), "serieus");
};

/* ---------- wegschrijven naar het echte dashboard ----------

   De twee exportknoppen leveren een bestand op. Deze derde knop zet exact
   hetzelfde neer in Home Assistant zelf. Dat kan niet zonder toestemming van
   HA: de pagina heeft een token nodig (profiel → Long-Lived Access Tokens).
   Dat token komt alleen in `localStorage` te staan — het wordt nergens in een
   bestand gezet, niet in de broncode en niet in een export.

   Er wordt nooit blind overschreven: eerst het live dashboard ophalen, dan de
   verschillen tonen, en pas na uw "ja" gaat het op. Daarna wordt het opgeslagen
   resultaat opnieuw opgehaald en vergeleken, zodat u leest wat er écht staat. */
const DASHBOARD_PAD = "2d-floorplan";
const HA_SLEUTEL = "prototype.ha";

function haInstelling() {
  try { return JSON.parse(localStorage.getItem(HA_SLEUTEL)) || {}; }
  catch (_) { return {}; }
}
function haBewaar(w) {
  try { localStorage.setItem(HA_SLEUTEL, JSON.stringify(w)); } catch (_) { /* geen opslag */ }
  // Een ander adres of een nieuw token maakt de opgehaalde camerabeelden
  // ongeldig: opnieuw proberen bij de volgende tekenbeurt.
  cameraBeelden.clear();
}

/* Eén venster voor alle drie de vragen (instellingen, bevestiging, resultaat).
   Geeft de ingevulde velden terug bij "verder", een leeg object bij een
   bevestiging zonder velden, en `null` bij annuleren. */
function vraagVenster(opts) {
  return new Promise(af => {
    const buiten = document.createElement("div");
    buiten.className = "bevestig";
    const venster = document.createElement("div");
    venster.className = "venster";

    const h = document.createElement("h3");
    h.textContent = opts.kop;
    venster.appendChild(h);
    if (opts.uitleg) {
      const p = document.createElement("div");
      p.textContent = opts.uitleg;
      p.style.fontSize = "12.5px";
      p.style.lineHeight = "1.5";
      venster.appendChild(p);
    }

    const velden = {};
    for (const v of opts.velden || []) {
      const blok = document.createElement("label");
      blok.className = "veld";
      const naam = document.createElement("span");
      naam.textContent = v.label;
      const invoer = v.type === "keuze"
        ? document.createElement("select")
        : document.createElement("input");
      if (v.type === "keuze") {
        // Een keuzelijst: de opgegeven opties, en de waarde die er standaard
        // uitkomt. De terugwaarde is de gekozen optie. Opties mogen een
        // gewone waarde zijn of `{waarde, label}` als tonen en bewaren
        // verschillend zijn — bij floors is de id lelijk en de naam leesbaar.
        for (const o of v.opties || []) {
          const optie = document.createElement("option");
          const keuze = (o && typeof o === "object") ? o : { waarde: o, label: o };
          optie.value = keuze.waarde === undefined ? "" : keuze.waarde;
          optie.textContent = keuze.label === undefined ? String(optie.value) : keuze.label;
          invoer.appendChild(optie);
        }
        if (v.waarde) invoer.value = v.waarde;
      } else {
        invoer.type = v.type || "text";
        // Een bestandsveld mag géén `value` krijgen — de browser houdt dat tegen,
        // en terecht: anders kon elke pagina zeggen welk bestand er van uw schijf
        // mee zou gaan.
        if (invoer.type !== "file") invoer.value = v.waarde || "";
        if (v.placeholder) invoer.placeholder = v.placeholder;
        if (v.accept) invoer.accept = v.accept;
      }
      if (v.letOp) {
        const letop = document.createElement("span");
        letop.className = "let-op";
        letop.textContent = v.letOp;
        blok.append(naam, invoer, letop);
      } else {
        blok.append(naam, invoer);
      }
      velden[v.sleutel] = invoer;
      venster.appendChild(blok);
    }

    for (const l of opts.lijsten || []) {
      const blok = document.createElement("div");
      const titel = document.createElement("div");
      titel.textContent = l.titel;
      titel.style.fontSize = "12px";
      titel.style.color = "var(--tekst-dim)";
      const pre = document.createElement("pre");
      pre.textContent = (l.regels || []).join("\n");
      if (l.klasse) pre.className = l.klasse;
      blok.append(titel, pre);
      venster.appendChild(blok);
    }

    const rij = document.createElement("div");
    rij.className = "rij";
    if (opts.links) {
      const l = document.createElement("span");
      l.className = "links";
      l.textContent = opts.links;
      rij.appendChild(l);
    }
    const nee = document.createElement("button");
    nee.textContent = opts.cancelTekst || "Annuleren";
    const ja = document.createElement("button");
    ja.className = "primary";
    ja.textContent = opts.okTekst || "Verder";
    rij.append(nee, ja);
    venster.appendChild(rij);
    buiten.appendChild(venster);
    document.body.appendChild(buiten);

    const weg = waarde => { buiten.remove(); af(waarde); };
    nee.onclick = () => weg(null);
    buiten.onclick = ev => { if (ev.target === buiten) weg(null); };
    ja.onclick = () => {
      const uit = {};
      for (const k in velden) {
        // Bij een bestandsveld is de waarde het bestand zelf (of null), niet de
        // naam die de browser erbij verzint.
        uit[k] = velden[k].type === "file"
          ? (velden[k].files && velden[k].files[0]) || null
          : velden[k].value;
      }
      weg(uit);
    };
    const eerste = (opts.velden || [])[0];
    if (eerste) velden[eerste.sleutel].focus();
  });
}

/* Wat er mis is met een adres, in gewone taal. `https://…:8123` is bijna
   altijd een vergissing: poort 8123 hoort bij lokale http-toegang, en bij
   https (Nabu Casa, een proxy) hoort de poort weg — dan is het 443. */
function adresWaarschuwing(url) {
  if (!url) return "";
  if (/^https:\/\//i.test(url) && /:8123\/?$/.test(url)) {
    return "Poort 8123 hoort bij lokale toegang (http://…:8123). Bij https — " +
           "zoals Nabu Casa — laat u de poort weg; dan is het 443.";
  }
  if (/^http:\/\//i.test(url) && /:443\/?$/.test(url)) {
    return "Poort 443 hoort bij https. Voor lokale toegang: http://…:8123.";
  }
  return "";
}

/* Fouten die alleen u kunt oplossen: een verkeerd adres, of een token dat
   Home Assistant niet meer accepteert. Voor die twee opent de editor dit
   venster in plaats van alleen te melden dat het mislukt is. */
function isInstellingsfout(e) {
  const m = String((e && e.message) || e);
  return /geen verbinding|gesloten|geen antwoord|websocket|network|fetch|token geweigerd|unauthorized|401/i.test(m);
}

/* Wat er in gewone taal over te zeggen is — en wat u dan moet doen. */
function foutUitleg(fout) {
  if (/token geweigerd|unauthorized|401/i.test(fout)) {
    return `${fout}. Dat betekent: plak hieronder een nieuw token uit uw profiel ` +
           `→ Long-Lived Access Tokens; het huidige wordt niet meer geaccepteerd.`;
  }
  return `${fout} Controleer hieronder het adres en de poort — met ` +
         `"Bewaren en opnieuw proberen" gaat het meteen verder.`;
}

/* Het instellingenvenster. Ook gewoon te openen via de ⚙-knop, niet alleen
   als er iets misgaat.

   Het tokenveld komt leeg: wat er al staat blijft staan als u het leeg laat,
   en u typt er een nieuw in om het te vervangen. Zo hoeft het opgeslagen
   token nooit in het venster te verschijnen. */
function vraagInstelling(huidig, toelichting, okTekst) {
  const url = (huidig && huidig.url) || location.origin;
  const opgeslagen = (huidig && huidig.token) || "";
  const waarschuw = adresWaarschuwing(url);
  return vraagVenster({
    kop: "Instellingen voor Home Assistant",
    uitleg: (toelichting ? toelichting + " " : "") +
      "Een token maakt u aan in Home Assistant: uw profiel → Long-Lived Access " +
      "Tokens. Het blijft alleen in deze browser staan en komt niet in een " +
      "bestand noch in een export.",
    velden: [
      { sleutel: "url", label: "Home Assistant-adres",
        waarde: url, letOp: waarschuw || undefined },
      { sleutel: "token", label: "Long-Lived Access Token",
        waarde: "", type: "password",
        placeholder: opgeslagen ? "(opgeslagen — laat leeg om te behouden)"
                                : "plak hier het token",
        letOp: opgeslagen
          ? "Laat dit veld leeg om het huidige token te behouden; typ er een " +
            "nieuw in om het te vervangen."
          : undefined },
      { sleutel: "pad", label: "url_path van het dashboard",
        waarde: (huidig && huidig.pad) || DASHBOARD_PAD },
    ],
    okTekst: okTekst || "Bewaren en opnieuw proberen",
  }).then(v => {
    if (!v || !v.url.trim()) return null;
    const token = v.token.trim() || opgeslagen;
    if (!token) return null;
    const inst = {
      url: v.url.trim().replace(/\/+$/, ""),
      token,
      pad: v.pad.trim() || DASHBOARD_PAD,
    };
    haBewaar(inst);
    return inst;
  });
}

/* Eén WebSocket-verbinding met HA: eerst aanmelden, dan commando's sturen. */
function haVerbind(url, token) {
  return new Promise((los, af) => {
    const adres = url.replace(/\/+$/, "").replace(/^http/, "ws") + "/api/websocket";
    const ws = new WebSocket(adres);
    let volgend = 1;
    const wacht = new Map();
    let klaar = false;
    const fout = e => { if (!klaar) { klaar = true; af(e); } };

    ws.onerror = () => fout(new Error("geen verbinding met " + adres));
    ws.onclose = () => fout(new Error("verbinding met " + adres + " gesloten"));
    ws.onmessage = ev => {
      let m;
      try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type === "auth_required") {
        ws.send(JSON.stringify({ type: "auth", access_token: token }));
        return;
      }
      if (m.type === "auth_invalid") return fout(new Error("token geweigerd door Home Assistant"));
      if (m.type === "auth_ok") { klaar = true; los(het); return; }
      if (m.type !== "result") return;
      const p = wacht.get(m.id);
      if (!p) return;
      wacht.delete(m.id);
      if (m.success) p.los(m.result);
      else p.af(new Error((m.error && m.error.message) || "onbekende fout van HA"));
    };

    const het = {
      stuur: (type, data) => new Promise((los2, af2) => {
        const id = volgend++;
        wacht.set(id, { los: los2, af: af2 });
        ws.send(JSON.stringify({ id, type, ...data }));
      }),
      dicht: () => { try { ws.close(); } catch (_) { /* al dicht */ } },
    };
  });
}

/* Niet eindeloos wachten: als Home Assistant niet antwoordt gaat de editor
   gewoon verder op de momentopname, in plaats van vast te lopen bij het
   openen. De catch voorkomt een onbehandelde afwijzing als de tijdlimiet
   eerder wint. */
function metTijdslimiet(p, ms) {
  p.catch(() => {});
  return Promise.race([
    p,
    new Promise((_, af) =>
      setTimeout(() => af(new Error(`geen antwoord binnen ${ms / 1000} s`)), ms)),
  ]);
}

/* Het dashboard ophalen zoals het nú in Home Assistant staat. Dit is de bron
   waarop de editor hoort te starten: zonder dit zou Herstellen teruggaan naar
   de momentopname van 4 oktober, en zou weggeschrijven uw eigen verschuivingen
   in Home Assistant ongedaan maken.

   Geeft `{ config }` bij succes, of `{ reden }` als het niet lukt. "geen token"
   is geen fout maar de offline stand: dan werkt de editor gewoon op de
   momentopname, zoals voorheen. */
async function haDashboardOphalen() {
  const inst = haInstelling();
  if (!inst.url || !inst.token) return { reden: "geen token" };
  let ha = null;
  try {
    ha = await metTijdslimiet(haVerbind(inst.url, inst.token), 8000);
    const r = await metTijdslimiet(
      ha.stuur("lovelace/config", { url_path: inst.pad || DASHBOARD_PAD }), 8000);
    const cfg = r && r.config ? r.config : r;
    if (!cfg || !Array.isArray(cfg.views)) throw new Error("het antwoord bevat geen views");
    return { config: cfg };
  } catch (e) {
    return { reden: (e && e.message) || String(e) };
  } finally {
    if (ha) ha.dicht();
  }
}

/* Objecten met dezelfde inhoud maar een andere sleutelvolgorde zijn hetzelfde
   object — HA geeft ze vaak in een andere volgorde terug dan wij ze maken.
   Zonder dit zou het verschilvenster tientallen "verschillen" tonen die er
   niet zijn. De volgorde in lijsten blijft wél tellen: die is betekenisvol. */
function gesorteerd(v) {
  if (Array.isArray(v)) return v.map(gesorteerd);
  if (v && typeof v === "object") {
    const uit = {};
    for (const k of Object.keys(v).sort()) uit[k] = gesorteerd(v[k]);
    return uit;
  }
  return v;
}

/* Elk element als eigen regel, mét wat eronder hangt (ook het `card:`-vlak van
   de config-template-card en de `cards:`/`sections:` van een view). Alleen de
   eigen instellingen tellen mee — de kinderen en het eventuele commentaar
   niet, anders is geen enkel verschil meer te zien. */
function exportRijen(bron) {
  const uit = [];
  const takken = lijst => {
    for (const e of lijst || []) {
      if (!e || typeof e !== "object") continue;
      const eigen = {};
      for (const k in e) if (k !== "elements" && k !== "card") eigen[k] = e[k];
      const c = (e.conditions && e.conditions[0]) || {};
      uit.push({
        s: JSON.stringify(gesorteerd(eigen)),
        type: String(e.type || "?").replace("custom:", ""),
        naam: String(c.entity || e.entity || e.title || e.image || e.icon || "?").slice(0, 64),
      });
      takken(e.elements);
      if (e.card) takken(Array.isArray(e.card) ? e.card : [e.card]);
      takken(e.cards);
      takken(e.sections);
      takken(e.badges);
    }
  };
  if (Array.isArray(bron)) takken(bron);
  else if (bron && Array.isArray(bron.views)) {
    // De views zelf zijn geen elementen; wél wat ze bevatten.
    for (const v of bron.views) { takken(v.cards); takken(v.sections); takken(v.badges); }
  }
  return uit;
}

function telRijen(rijen) {
  const t = new Map();
  for (const r of rijen) t.set(r.s, (t.get(r.s) || 0) + 1);
  return t;
}

/* Wat er aan één element veranderd is, per eigenschap — met oud en nieuw erbij.
   Een object met één veranderd property is géén ander element, dus dit hoort
   bij elkaar gepaard te worden en niet als "verdwijnt" én "bijkomt" te
   verschijnen. */
function toonWaarde(v) {
  const j = JSON.stringify(v);
  if (j === undefined) return "(niet aanwezig)";
  return j.length > 2 && j[0] === '"' && j[j.length - 1] === '"' ? j.slice(1, -1) : j;
}
function regelsVoor(a, b, pad, uit) {
  const sleutels = [...new Set([...Object.keys(a), ...Object.keys(b)])];
  for (const k of sleutels) {
    const av = a[k], bv = b[k];
    const za = av && typeof av === "object" && !Array.isArray(av);
    const zb = bv && typeof bv === "object" && !Array.isArray(bv);
    const naam = pad ? `${pad}.${k}` : k;
    if (za && zb) { regelsVoor(av, bv, naam, uit); continue; }
    if (JSON.stringify(av) === JSON.stringify(bv)) continue;
    uit.push(`${naam}: ${toonWaarde(av)} → ${toonWaarde(bv)}`);
  }
}

/* Het verschil tussen twee dashboards.

   Stap 1 is dezelfde als altijd: welke elementen staan in de één en niet in de
   ander. Stap 2 is wat er miste: elementen die aan beide kanten voorkomen maar
   één eigenschap veranderd hebben, worden *gekoppeld* en als "gewijzigd"
   getoond met de precieze regel.

   Die koppeling gaat op type + naam (entity of icoon), en binnen zo'n groep op
   de kleinste inhoudelijke afstand. Zonder die tweede stap zouden 43 identieke
   `mdi:close-circle`-markeringen door elkaar heen gepaard raken en zou één
   verschoven markering als veertig wijzigingen verschijnen. */
function verschilDashboards(huidig, nieuw) {
  const L = exportRijen(huidig), N = exportRijen(nieuw);
  const tl = telRijen(L), tn = telRijen(N);
  const namen = new Map();
  for (const r of L) if (!namen.has(r.s)) namen.set(r.s, r);
  for (const r of N) if (!namen.has(r.s)) namen.set(r.s, r);
  const weg = [], bij = [];
  for (const [s, n] of tl) for (let i = n - (tn.get(s) || 0); i > 0; i--) weg.push(namen.get(s));
  for (const [s, n] of tn) for (let i = n - (tl.get(s) || 0); i > 0; i--) bij.push(namen.get(s));

  const obj = r => (r._o || (r._o = JSON.parse(r.s)));
  const groep = rijen => {
    const g = new Map();
    for (const r of rijen) {
      const k = r.type + "|" + r.naam;
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(r);
    }
    return g;
  };
  const gewijzigd = [], overWeg = [], overBij = [];
  const GL = groep(weg), GN = groep(bij);
  for (const [k, gr] of GL) {
    const gn = GN.get(k) || [];
    const kandidaten = [];
    for (let i = 0; i < gr.length; i++) {
      for (let j = 0; j < gn.length; j++) {
        const regels = [];
        regelsVoor(obj(gr[i]), obj(gn[j]), "", regels);
        kandidaten.push({ i, j, regels });
      }
    }
    // Kleinste afstand eerst: dan pakt een identiek paar geen verplaatst paar
    // op, en blijft er precies één paar over dat de echte wijziging toont.
    kandidaten.sort((a, b) => a.regels.length - b.regels.length);
    const gi = new Set(), ni = new Set();
    for (const p of kandidaten) {
      if (gi.has(p.i) || ni.has(p.j)) continue;
      gi.add(p.i); ni.add(p.j);
      if (p.regels.length) gewijzigd.push({ rij: gr[p.i], regels: p.regels });
    }
    for (let i = 0; i < gr.length; i++) if (!gi.has(i)) overWeg.push(gr[i]);
    for (let j = 0; j < gn.length; j++) if (!ni.has(j)) overBij.push(gn[j]);
  }
  for (const [k, gr] of GN) if (!GL.has(k)) overBij.push(...gr);

  gewijzigd.sort((a, b) => (a.rij.naam + a.rij.type).localeCompare(b.rij.naam + b.rij.type));
  return { live: L.length, nieuw: N.length, gewijzigd, weg: overWeg, bij: overBij };
}

/* De drie groepen als vensterlijsten. Lege groepen verdwijnen uit beeld, zodat
   u alleen ziet wat er speelt. Gebruikt door zowel het schrijfvenster als het
   bevestigen voor Herstellen. */
function verschilLijsten(d, titels) {
  const t = Object.assign(
    { gewijzigd: "gewijzigd", weg: "verdwijnt", bij: "bijkomt" }, titels || {});
  const uit = [];
  if (d.gewijzigd.length) {
    const regels = [];
    for (const g of d.gewijzigd) {
      regels.push(beknop(g.rij));
      for (const r of afkappen(g.regels, 4)) regels.push("      " + r);
    }
    uit.push({ titel: `${t.gewijzigd} (${d.gewijzigd.length})`,
               regels: afkappen(regels, 40), klasse: "gewijzigd" });
  }
  if (d.weg.length) {
    uit.push({ titel: `${t.weg} (${d.weg.length})`,
               regels: afkappen(d.weg.map(beknop), 12), klasse: "weg" });
  }
  if (d.bij.length) {
    uit.push({ titel: `${t.bij} (${d.bij.length})`,
               regels: afkappen(d.bij.map(beknop), 12), klasse: "bij" });
  }
  if (!uit.length) uit.push({ titel: "verschillen", regels: ["(geen)"] });
  return uit;
}

function nietsTeMelden(d) {
  return !d.gewijzigd.length && !d.weg.length && !d.bij.length;
}
