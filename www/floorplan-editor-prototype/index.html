   en pas bij het loslaten in de geschiedenis belanden. Zonder argument neemt
   hij de stand van nu — zoals bij een gewone documentbewerking. */
function onthoud(vooraf) {
  STAAT.ongedaan.push(vooraf || huidigeStaat());
  if (STAAT.ongedaan.length > 40) STAAT.ongedaan.shift();
}

function ongedaanMaken() {
  const vorig = STAAT.ongedaan.pop();
  if (!vorig) { meld("Niets om ongedaan te maken."); return; }
  STAAT.doc = JSON.parse(vorig.doc);
  STAAT.zoneKader = JSON.parse(vorig.zone || "{}");
  zoneKadersBewaar();
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  bouwStaats();
  // De keuzelijst toont titels en aantallen die net veranderd kunnen zijn, en
  // de achtergrondfoto hoort bij de verdieping die nu open is.
  bouwVerdiepkiezer();
  pasVlakAan();
  tekenAlles();
  toonPositie(null);
}

/* ---------- lijst links ---------- */

function tekenLijst() {
  const houder = el("boom");
  const filter = el("filter").value.trim().toLowerCase();
  const mag = zichtbaarVoorZone(STAAT.zone);
  // Met een filter actief klapt de boom overal open: een treffer die diep
  // verstopt zit is met een dichte tak niet te vinden.
  const filterOpen = !!filter;
  houder.innerHTML = "";
  const maak = (lijst, container) => {
    for (const e of lijst || []) {
      if (!mag(e)) continue;
      if (filter && !(past(e, filter) || (e.elements && bevatDiep(e.elements, filter)))) continue;

      const kinderen = e.elements && e.elements.length ? e.elements : null;
      const open = filterOpen || takOpen(e);
      const tak = document.createElement("div");
      tak.className = "tak";
      tak.appendChild(maakKnoop(e, kinderen ? open : null));
      container.appendChild(tak);
      if (!kinderen) continue;

      const blok = document.createElement("div");
      blok.className = "kinderen" + (open ? "" : " dicht");
      if (e.conditions) {
        const dan = document.createElement("div");
        dan.className = "dan";
        const chip = document.createElement("span");
        chip.className = "dan-knop";
        const icoon = svgIcoon("mdi:arrow-right-bold", "currentColor", 12);
        if (icoon) chip.appendChild(icoon);
        chip.appendChild(document.createTextNode("dan"));
        const aantal = document.createElement("span");
        aantal.className = "aantal";
        aantal.textContent =
          `${kinderen.length} ${kinderen.length === 1 ? "element" : "elementen"}`;
        dan.append(chip, aantal);
        blok.appendChild(dan);
      }
      tak.appendChild(blok);
      maak(kinderen, blok);
    }
  };
  maak(STAAT.kaart ? STAAT.kaart.elements : [], houder);
}

/* Standaard staat een tak open als zijn voorwaarde waar is, en dicht als ze dat
   niet is — dat is precies wat je wilt zien: de onbruikbare takken verdwijnen,
   de actieve blijven staan. Klikt u zelf het schuifje, dan weegt die keuze zwaarder
   en onthoudt de editor hem per element (zwakke map: het randje verdwijnt mee
   met het element, dus na Herstellen geldt de standaard weer). */
function takOpen(e) {
  if (!e.elements || !e.elements.length) return true;
  if (STAAT.open.has(e)) return STAAT.open.get(e);
  const c = e.conditions && e.conditions[0];
  // Zelfde bron als het rondje en als de grijze op de kaart: wat nu niet
  // waar is, klapt dicht. Zie `seedVoorwaarden` voor waar dat 'nu' vandaan komt.
  return c ? takAan(c) : true;
}

/* De rondjes staan in de stand 'handmatig' allemaal aan — anders is er niets
   om handmatig mee te beginnen. Maar dan zou bij het openen elke tak open zijn
   en zou de plattegrond tonen wat Home Assistant juist verbergt, want 7 van de
   9 voorwaarden zijn op dit moment niet waar. Daarom zet ik het rondje bij het
   laden één keer op de snapshot: wat daar niet waar is begint uit (tak dicht,
   element gedimd), de rest staat open. Daarna kunt u elk rondje alsnog zelf
   omdraaien; die keuze weegt zwaarder.

   Hetzelfde gebeurt opnieuw bij elke ⟳ én bij het herladen van de pagina: alle
   statussen, zonder uitzondering. Een omkering is een blik op dit moment en
   geen instelling — bij de volgende verversing wint de snapshot weer. Geeft het
   aantal terug dat er veranderde. */
function seedVoorwaarden(lijst, teller = { n: 0 }) {
  for (const e of lijst || []) {
    for (const c of e.conditions || []) {
      const w = conditieWaar(c);
      if (w !== null) {
        if (c.__aan !== w) teller.n++;
        c.__aan = w;
      }
    }
    if (e.elements) seedVoorwaarden(e.elements, teller);
  }
  return teller.n;
}

/* Alles boven een gekozen element openklappen. Zonder dit is kiezen op de
   plattegrond nutteloos zodra er één dichte tak boven het element zit: de lijst
   zou dan stilzwijgend niets laten zien. */
function openTotWortel(e) {
  let n = e;
  while (n) {
    if (n.elements && n.elements.length) STAAT.open.set(n, true);
    const i = STAAT.tak.get(n);
    n = i ? i.ouder : null;
  }
}

function past(e, f) {
  return naamVan(e).toLowerCase().includes(f) ||
    String(e.entity || "").toLowerCase().includes(f) ||
    String(e.type).includes(f);
}

function bevatDiep(lijst, f) {
  return (lijst || []).some(e => past(e, f) || bevatDiep(e.elements, f));
}

/* Eén regel in de boom. `open` is `null` bij een blad — geen schuifje — anders
   de stand van de tak. De regel wordt niet zelf opgehangen: dat doet de
   aanroeper, want een regel hoort nu bij een tak met de kinderen eronder. */
function maakKnoop(e, open) {
  const r = document.createElement("div");
  r.className = "knoop";
  const sleutel = sleutelVan(e);
  if (STAAT.verborgen.has(sleutel)) r.classList.add("verborgen");
  if (STAAT.selektie.has(e)) r.classList.add("geselecteerd");
  if (voorwaardeUit(e)) r.classList.add("uit");

  const c = e.conditions && e.conditions[0];
  const niet = !!c && c.state_not !== undefined;
  const opTekst = !c ? "" : (c.state !== undefined ? "is" : (niet ? "is niet" : "?"));
  const waarde = !c ? "" : String(niet ? c.state_not : (c.state === undefined ? "?" : c.state));
  const aan = !!c && takAan(c);

  // Schuifje voor de kinderen. Bladeren krijgen een lege plek in dezelfde maat,
  // zodat de ogen en de namen onder elkaar blijven uitlijnen.
  if (open === null || open === undefined) {
    const plek = document.createElement("span");
    plek.className = "knopje plek";
    plek.setAttribute("aria-hidden", "true");
    r.appendChild(plek);
  } else {
    const schuif = document.createElement("button");
    schuif.className = "knopje schuif";
    schuif.title = open ? "dichtklappen" : "uitklappen";
    const icoon = svgIcoon(open ? "mdi:chevron-down" : "mdi:chevron-right", "currentColor", 13);
    if (icoon) schuif.appendChild(icoon);
    else schuif.textContent = open ? "▾" : "▸";
    schuif.onclick = ev => {
      ev.stopPropagation();
      STAAT.open.set(e, !open);
      tekenLijst();
    };
    r.appendChild(schuif);
  }

  // Oog: zichtbaar of verborgen op de plattegrond.
  const oog = document.createElement("button");
  oog.className = "knopje" + (STAAT.verborgen.has(sleutel) ? "" : " aan");
  oog.textContent = STAAT.verborgen.has(sleutel) ? "○" : "◉";
  oog.title = STAAT.verborgen.has(sleutel)
    ? "verborgen op de plattegrond — klik om te tonen"
    : "zichtbaar op de plattegrond — klik om te verbergen";
  oog.onclick = ev => {
    ev.stopPropagation();
    if (STAAT.verborgen.has(sleutel)) STAAT.verborgen.delete(sleutel);
    else STAAT.verborgen.add(sleutel);
    tekenAlles();
  };
  r.appendChild(oog);

  // De voorwaarde als knop met icoon en kleur, in plaats van een kaal woordje.
  // Groen = de tak staat aan, rood = de tak staat uit.
  if (c) {
    const uitSnapshot = STAAT.condities === "statussen" && conditieWaar(c) !== null;
    const als = document.createElement("button");
    als.className = "knopje als " + (aan ? "waar" : "onwaar");
    const icoon = svgIcoon("mdi:call-split", "currentColor", 12);
    if (icoon) als.appendChild(icoon);
    als.appendChild(document.createTextNode("als"));
    als.title = uitSnapshot
      ? `voorwaarde uit de snapshot: ${c.entity} is ${stateOf(c.entity)} — zet 'voorwaarden' op handmatig om zelf te kiezen`
      : `voorwaarde: ${c.entity} ${opTekst} ${waarde} — klik om de tak om te draaien`;
    als.onclick = ev => {
      ev.stopPropagation();
      // In de stand 'uit de statussen' is deze knop niet van de gebruiker.
      // Niet CSS afdwingen: `pointer-events: none` houdt een echte klik tegen,
      // maar een programmatische klik gaat er gewoon langs, en dan zou er
      // stilletjes een tak omzetten die de snapshot bepaalt.
      if (STAAT.condities === "statussen") return;
      c.__aan = c.__aan === false;
      // De tak volgt wat u zojuist koos — de standaard kwam anders uit de
      // snapshot en die zegt over het omgedraaide rondje helemaal niets.
      STAAT.open.set(e, c.__aan !== false);
      tekenAlles();
    };
    r.appendChild(als);
  } else {
    const t = document.createElement("span");
    t.className = "knopje";
    t.textContent = "·";
    t.title = "geen voorwaarde";
    r.appendChild(t);
  }

  const s = document.createElement("span");
  s.className = "soort";
  s.textContent = e.type.replace("custom:", "");
  r.appendChild(s);

  if (c) {
    // Het statement zelf: [entiteit] [is] [waarde]. De volledige entity-id
    // staat in de titel, want die is in een balk van 300px niet te lezen.
    if (e.name) {
      const nm = document.createElement("span");
      nm.className = "naam";
      nm.textContent = String(e.name);
      nm.title = String(e.name);
      r.appendChild(nm);
    }
    const cond = document.createElement("span");
    cond.className = "cond";
    const ent = document.createElement("code");
    ent.textContent = String(c.entity).split(".").pop();
    ent.title = String(c.entity);
    const op = document.createElement("span");
    op.className = "op";
    op.textContent = opTekst;
    const wa = document.createElement("code");
    wa.className = aan ? "waar" : "onwaar";
    wa.textContent = waarde;
    cond.append(ent, op, wa);
    r.appendChild(cond);
  } else {
    const n = document.createElement("span");
    n.className = "etiket";
    n.textContent = naamVan(e);
    r.appendChild(n);
  }

  r.onclick = ev => selecteer(e, ev.shiftKey || ev.ctrlKey || ev.metaKey);
  // Dubbelklik: het inspectievenster openen. Enkel klikken selecteert alleen —
  // het paneel komt niet vanzelf, dat houdt de kaart vrij.
  r.ondblclick = ev => {
    ev.preventDefault();
    ev.stopPropagation();
    selecteer(e);
    inspectorZet(true);
  };
  // Rechtermuisklik: de zeldzame dingen — een voorwaarde maken, wijzigen of
  // weghalen — zonder daar een paneel voor open te houden.
  r.oncontextmenu = ev => {
    ev.preventDefault();
    ev.stopPropagation();
    // Eerst het menu, dan selecteren: selecteren tekent de boom opnieuw en dat
    // scrollt de lijst — en dat mag het menu niet meteen weer weghalen.
    contextMenu(ev, naamVan(e), elementMenuItems(e));
    selecteer(e);
  };
  r.onmouseenter = () => markeer(e, true);
  r.onmouseleave = () => markeer(e, false);
  return r;
}

function markeer(e, aan) {
  el("vlak").querySelectorAll(".el").forEach(doos => {
    if (doos.__element !== e) return;
    doos.style.outline = aan ? "1px dashed var(--accent)" : "";
    doos.style.outlineOffset = aan ? "3px" : "";
  });
}

/* ---------- selecteren en het paneel rechts ---------- */

/* Kiezen. Zonder `toevoegen` wordt het precies één element; mét toevoegen
   (shift, ctrl of cmd) komt het erbij of gaat het er weer af. De inspectie
   rechts toont altijd één element, ook als u er meerdere kiest — anders zou het
   paneel moeten verzinnen welke van de vier u bedoelde. */
function selecteer(e, toevoegen) {
  if (e == null) {
    STAAT.selektie.clear();
    STAAT.geselecteerd = null;
  } else if (toevoegen) {
    if (STAAT.selektie.has(e)) STAAT.selektie.delete(e);
    else STAAT.selektie.add(e);
    const eerst = STAAT.selektie.values().next();
    STAAT.geselecteerd = STAAT.selektie.has(e) ? e : (eerst.done ? null : eerst.value);
  } else {
    STAAT.selektie.clear();
    STAAT.selektie.add(e);
    STAAT.geselecteerd = e;
  }
  // Kiest u iets anders, dan stopt het schalen of draaien vanzelf.
  if (STAAT.grepen && !STAAT.selektie.has(STAAT.grepen.e)) STAAT.grepen = null;
  el("vlak").querySelectorAll(".el").forEach(doos => {
    doos.classList.toggle("geselecteerd", doos.__element && STAAT.selektie.has(doos.__element));
  });
  // De boom klapt de takken boven het gekozen element open, anders ziet u in
  // de lijst niet waar het staat.
  openTotWortel(STAAT.geselecteerd);
  tekenLijst();
  tekenInspector();
  toonPositie(STAAT.geselecteerd, false);
  meldSelektie();
  const knop = el("boom").querySelector(".knoop.geselecteerd");
  if (knop) knop.scrollIntoView({ block: "nearest" });
}

/* Zo zegt de editor wat er aan de hand is. Eén element, of meerdere. */
function meldSelektie() {
  const n = STAAT.selektie.size;
  if (n <= 1) return;
  const deel = STAAT.geselecteerd ? ` · inspectie: ${naamVan(STAAT.geselecteerd)}` : "";
  meld(`${n} elementen gekozen — sleep er één om ze allemaal te verplaatsen${deel}`);
}

/* Alle plekken in het document waar een entiteit voorkomt — niet alleen het
   element dat u aanwijst, maar ook de voorwaarde eromheen, de abonnementslijst
   van de config-template-card en elke uitdrukking als `states['…']`.

   De markering (de rode kring) staat er bewust niet bij: die wordt bij het
   exporteren uit het element afgeleid en volgt dus vanzelf mee. */

/* Een entiteit als woord, niet als deel van een langere. `lamp_living` mag
   `lamp_living_rechts` niet raken, en `sensor.p1_totaal` ook niet
   `sensor.p1_totaal_dag`. */
function bevatEntiteit(tekst, id) {
  for (let i = tekst.indexOf(id); i >= 0; i = tekst.indexOf(id, i + 1)) {
    const vooraf = i === 0 ? "" : tekst[i - 1];
    const erna = i + id.length >= tekst.length ? "" : tekst[i + id.length];
    if (!/[a-z0-9_.]/i.test(vooraf) && !/[a-z0-9_.]/i.test(erna)) return true;
  }
  return false;
}

function vervangEntiteit(tekst, bron, doel) {
  let uit = "", i = 0;
  for (;;) {
    const p = tekst.indexOf(bron, i);
    if (p < 0) return uit + tekst.slice(i);
    const vooraf = p === 0 ? "" : tekst[p - 1];
    const erna = p + bron.length >= tekst.length ? "" : tekst[p + bron.length];
    const grens = !/[a-z0-9_.]/i.test(vooraf) && !/[a-z0-9_.]/i.test(erna);
    uit += tekst.slice(i, p) + (grens ? doel : bron.slice(0, 1));
    i = p + (grens ? bron.length : 1);
  }
}

function verwijzingenNaar(id) {
  const uit = [];
  if (!id) return uit;
  const loop = (node, pad) => {
    if (Array.isArray(node)) {
      node.forEach((v, i) => {
        if (v === id) {
          uit.push({ pad: `${pad}[${i}]`, soort: "abonnement",
                     detail: "entities van de kaart", node: null });
        } else loop(v, `${pad}[${i}]`);
      });
      return;
    }
    if (!node || typeof node !== "object") return;
    if (node.entity === id) {
      uit.push({ pad: `${pad}.entity`, soort: "eigen entity",
                 detail: node.type || "", node });
    }
    for (const c of node.conditions || []) {
      if (c && c.entity === id) {
        uit.push({ pad: `${pad}.conditions`, soort: "voorwaarde",
                   detail: `is ${c.state}`, node });
      }
    }
    for (const k of Object.keys(node)) {
      if (k === "entity" || k === "conditions") continue;
      const v = node[k];
      if (typeof v === "string" && v !== id && bevatEntiteit(v, id)) {
        uit.push({ pad: `${pad}.${k}`, soort: "uitdrukking", detail: k, node });
      } else {
        loop(v, `${pad}.${k}`);
      }
    }
  };
  loop(STAAT.doc.views, "views");
  return uit;
}

function vervangVerwijzingen(bron, doel) {
  let aantal = 0;
  const loop = (node) => {
    if (Array.isArray(node)) {
      for (let i = 0; i < node.length; i++) {
        if (node[i] === bron) { node[i] = doel; aantal++; }
        else loop(node[i]);
      }
      return;
    }
    if (!node || typeof node !== "object") return;
    if (node.entity === bron) { node.entity = doel; aantal++; }
    for (const c of node.conditions || []) {
      if (c && c.entity === bron) { c.entity = doel; aantal++; }
    }
    for (const k of Object.keys(node)) {
      if (k === "entity" || k === "conditions") continue;
      const v = node[k];
      if (typeof v === "string" && v !== bron && bevatEntiteit(v, bron)) {
        node[k] = vervangEntiteit(v, bron, doel); aantal++;
      } else {
        loop(v);
      }
    }
  };
  loop(STAAT.doc.views);
  // De onbereikbaar-markeringen staan juist níét in het document: de editor
  // haalt ze eruit en zet ze bij exporteren weer terug. Zonder deze regel zou u
  // de camera vervangen en zou het rode kruis blijven kijken naar de oude
  // entiteit — het enige dat dan nog naar het oude id verwijst.
  loop(STAAT.markeringenEruit || []);
  return aantal;
}

/* De knop [Verwijzingen vervangen] heeft drie dingen nodig: een oude entiteit,
   een nieuwe, en ergens om te vervangen. Zolang een van de eerste twee ontbreekt
   kan er niets gebeuren, dus blijft de knop grijs in plaats van dat hij na
   klikken "vul zowel de oude als de nieuwe entiteit in" gaat zeggen. */
function vervangKnopStatus() {
  const knop = el("i-vervang-knop");
  if (!knop) return;
  const z = el("i-zoek"), n = el("i-vervang");
  knop.disabled = !(z && z.value.trim() && n && n.value.trim());
}

/* De lijst vullen — of legen als er niets te zien is. De knop ernaast laat
   meteen zien hoeveel plekken er vervangen gaan worden. */
function toonVerwijzingen() {
  const houder = el("i-plekken");
  const knop = el("i-vervang-knop");
  if (!houder) return;
  const bron = (el("i-zoek").value || "").trim();
  const plekken = verwijzingenNaar(bron);
  houder.innerHTML = "";

  if (!bron) {
    houder.innerHTML = `<div class="leeg">Vul een entiteit in om te zien waar die voorkomt.</div>`;
  } else if (!plekken.length) {
    houder.innerHTML = `<div class="leeg">${bron} komt nergens in dit document voor</div>`;
  } else {
    for (const p of plekken) {
      const rij = document.createElement("div");
      rij.className = "plek";
      const sleutel = document.createElement("span");
      sleutel.className = "tag";
      sleutel.textContent = p.node ? (sleutelVan(p.node) || "—") : "—";
      rij.appendChild(sleutel);
      rij.appendChild(
        document.createTextNode(p.soort + (p.detail ? ` · ${p.detail}` : "")));
      rij.title = p.pad;
      if (p.node && STAAT.tak.has(p.node)) {
        rij.onclick = () => selecteer(p.node);
      } else {
        rij.classList.add("niet-klikbaar");
      }
      houder.appendChild(rij);
    }
    if (plekken.some(p => p.soort === "eigen entity")) {
      const n = document.createElement("div");
      n.className = "legenda";
      n.textContent = "De rode markering volgt het element en staat niet als plek hierboven.";
      houder.appendChild(n);
    }
  }
  if (knop) knop.textContent = `Verwijzingen vervangen (${plekken.length})`;
  vervangKnopStatus();
}

/* Het element uit de lijst halen waarin het staat. Dit is de knop
   [Verwijderen] in de inspectie — en de Delete/Backspace-toets in de editor
   doet precies hetzelfde, zodat er niet twee versies van "weg" bestaan.

   De bevestiging gaat naar de meldingsbalk zodra de inspectie verdwenen is:
   na het verwijderen is er niets geselecteerd, dus het paneel toont weer "klik
   op een element" en is er geen veld meer om in te schrijven. (Stond die regel
   er niet, dan crashte de knop op `null.textContent`.) */
/* ------------------------- rechtermuisklik-menu -------------------------

   De inspectie is voor het gewone werk; het zeldzame — een voorwaarde maken,
   wijzigen of weghalen — hoort in een menu dat je oproept wanneer je het nodig
   hebt, niet in een paneel dat altijd openstaat. Eén menu tegelijk, en het
   sluit bij een klik ernaast, bij Escape, bij scrollen en bij een nieuwe klik. */
function sluitContextMenu() {
  const oud = document.getElementById("contextmenu");
  if (oud) oud.remove();
}

function contextMenu(ev, kop, items) {
  sluitContextMenu();
  const m = document.createElement("div");
  m.id = "contextmenu";
  m.oncontextmenu = e => e.preventDefault();
  if (kop) {
    const k = document.createElement("div");
    k.className = "kop";
    k.textContent = kop;
    m.appendChild(k);
  }
  for (const it of items || []) {
    if (!it) continue;
    if (it.scheiding) {
      const s = document.createElement("div");
      s.className = "scheiding";
      m.appendChild(s);
      continue;
    }
    if (it.klein) {
      const t = document.createElement("div");
      t.className = "klein";
      t.textContent = it.klein;
      m.appendChild(t);
      continue;
    }
    const b = document.createElement("button");
    b.textContent = it.tekst;
    if (it.uitleg) b.title = it.uitleg;
    if (it.uit) { b.disabled = true; b.classList.add("uit"); }
    else b.onclick = () => { sluitContextMenu(); it.doe(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  contextNetOpen = Date.now();
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(ev.clientX, window.innerWidth - r.width - 8)) + "px";
  m.style.top = Math.max(4, Math.min(ev.clientY, window.innerHeight - r.height - 8)) + "px";
}

// Sluiten zodra u ergens anders klikt of scrolt. Binnen het menu zelf niet:
// anders verdwijnt het vóór de klik op een regel aankomt.
window.addEventListener("pointerdown", ev => {
  const m = document.getElementById("contextmenu");
  if (m && !m.contains(ev.target)) sluitContextMenu();
}, true);
window.addEventListener("keydown", ev => { if (ev.key === "Escape") { sluitContextMenu(); grepenWeg(); } }, true);
let contextNetOpen = 0;

window.addEventListener("scroll", () => {
  // Niet meteen na het openen: het menu zelf laat de lijst opnieuw tekenen, en
  // die scroll is geen handeling van de gebruiker. Zonder deze marge sloot het
  // menu zichzelf nog voordat u het zag.
  if (Date.now() - contextNetOpen > 300) sluitContextMenu();
}, true);
window.addEventListener("resize", sluitContextMenu);

/* De voorwaarde van een element: die van het element zelf (als het de wikkel
   is) of van de `conditional` eromheen. Zonder deze blik naar boven zou je een
   voorwaarde alleen kunnen bewerken door de wikkel te selecteren. */
function voorwaardeVan(e) {
  if (!e) return null;
  if (e.conditions && e.conditions[0]) return e.conditions[0];
  const i = STAAT.tak.get(e);
  const ouder = i && i.ouder;
  if (ouder && ouder.type === "conditional" && ouder.conditions && ouder.conditions[0]) {
    return ouder.conditions[0];
  }
  return null;
}

/* De voorwaarde van een bestaand element aanpassen: entiteit, drempel, en of het
   omgekeerd is (let op dat de waarde er níét is). Er wordt niets opnieuw
   gewikkeld — de wikkel blijft staan waar hij staat. */
async function voorwaardeBewerken(e) {
  const c = voorwaardeVan(e);
  if (!c) { voorwaardeToevoegen(e); return; }
  const omgekeerd = c.state_not !== undefined;
  const invul = await vraagVenster({
    kop: "Voorwaarde wijzigen",
    uitleg: `Nu: ${voorwaardeTekst(c)}.`,
    velden: [
      { sleutel: "entity", label: "als deze entiteit…", waarde: c.entity || "" },
      { sleutel: "state", label: "…deze waarde heeft",
        waarde: omgekeerd ? c.state_not : (c.state ?? "") },
      { sleutel: "omgekeerd", label: "omgekeerd — let op dat de waarde er NIET is",
        type: "keuze",
        opties: [{ waarde: "", label: "nee" }, { waarde: "ja", label: "ja (niet …)" }],
        waarde: omgekeerd ? "ja" : "" },
    ],
    okTekst: "Aanpassen",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Niets veranderd."); return; }
  const ent = (invul.entity || "").trim();
  const waarde = (invul.state || "").trim();
  if (!ent || !waarde) {
    meld("Entiteit en waarde zijn allebei nodig — er is niets veranderd.", "fout");
    return;
  }
  onthoud();
  c.entity = ent;
  if (invul.omgekeerd === "ja") { c.state_not = waarde; delete c.state; }
  else { c.state = waarde; delete c.state_not; }
  bouwStaats();
  tekenAlles();
  selecteer(e);
  meld(`De voorwaarde is nu "${voorwaardeTekst(c)}". ↶ draait het terug.`, "serieus");
}

/* Welke regels het menu voor dit element toont. */
function voorwaardeMenuItems(e) {
  const c = voorwaardeVan(e);
  if (c) {
    return [
      { tekst: "Voorwaarde wijzigen…",
        uitleg: "entiteit, waarde en omgekeerd aanpassen",
        doe: () => voorwaardeBewerken(e) },
      { klein: `nu: ${voorwaardeTekst(c)}` },
      { tekst: "Voorwaarde weghalen",
        uitleg: "het element blijft staan; de als…dan-wikkel verdwijnt (bij een wikkel: alles erin blijft)",
        doe: () => voorwaardeWegnemen(e) },
    ];
  }
  return [
    { tekst: "Als … dan … toevoegen…",
      uitleg: "dit element alleen tonen als een entiteit deze waarde heeft",
      doe: () => voorwaardeToevoegen(e) },
  ];
}

/* De elementen op de huidige kaart die deze entiteit gebruiken. */
function elementenMetEntiteit(ent) {
  const uit = [];
  const loop = lijst => {
    for (const e of lijst || []) {
      if (!e || typeof e !== "object") continue;
      if (e.entity === ent) uit.push(e);
      loop(e.elements);
    }
  };
  if (STAAT.kaart) loop(STAAT.kaart.elements);
  return uit;
}

/* ------------------- de stijl van een ander element overnemen -------------------

   Een `state-label` met Quicksand, 120%, vet, een transparante achtergrond en een
   `rotate` is niet met de velden van de inspectie te maken: het is een blok stijl
   dat u ooit in het dashboard zelf hebt gezet. In plaats van dat overtypen neemt
   u het over van het element dat al goed staat — het soort, de hele `style` en de
   acties komen mee; uw entiteit en uw plek op de kaart blijven. */

const KOPIEER_ACTIES = ["tap_action", "hold_action", "double_tap_action"];

/* Alle elementen van alle verdiepingen, met de verdieping erbij waar ze staan.
   Ook de elementen binnen een voorwaarde: die hebben net zo goed een stijl. */
function alleElementen() {
  const uit = [];
  (STAAT.doc && STAAT.doc.views || []).forEach((view, i) => {
    const kaart = bewerkbareKaart(view);
    if (!kaart) return;
    const verdiep = view.title || `verdieping ${i + 1}`;
    const loop = lijst => {
      for (const e of lijst || []) {
        if (!e || typeof e !== "object") continue;
        // Een `conditional` is een wikkel zonder eigen stijl: geen voorbeeld om
        // van over te nemen (en er zíjn elementen zitten er wel gewoon in).
        if (e.type !== "conditional") uit.push({ e, verdiep });
        loop(e.elements);
      }
    };
    loop(kaart.elements || []);
  });
  return uit;
}

/* Neemt het soort, de stijl en de acties van `bron` over op `doel`; de plek van
   het doel blijft waar hij is (die heeft u gekozen). Puur: geen geschiedenis,
   geen tekenwerk, geen melding — zo kan het toevoegen hem net zo goed gebruiken
   als het menu. Geeft terug wat er is overgenomen, of null als het niet kon. */
function stijlVan(doel, bron) {
  if (!doel || !bron || doel === bron) return null;
  if (bron.type === "conditional") return null;
  const links = (doel.style || {}).left;
  const boven = (doel.style || {}).top;
  doel.type = bron.type || doel.type;
  // Een eigen, diepe kopie: anders zou een latere wijziging aan het ene element
  // het andere stilletjes meeveranderen.
  doel.style = JSON.parse(JSON.stringify(bron.style || {}));
  if (links === undefined) delete doel.style.left; else doel.style.left = links;
  if (boven === undefined) delete doel.style.top; else doel.style.top = boven;
  // De acties alleen als de bron ze heeft (`none` is er ook een, en die telt).
  const acties = [];
  for (const k of KOPIEER_ACTIES) {
    if (bron[k] === undefined) continue;
    doel[k] = JSON.parse(JSON.stringify(bron[k]));
    acties.push(k);
  }
  if (bron.image !== undefined) doel.image = bron.image;
  if (bron.icon !== undefined) doel.icon = bron.icon;
  // Een `state-label` toont tekst: icoon en afbeelding horen er dan niet meer in
  // (Home Assistant waarschuwt over zulke sleutels).
  if (doel.type === "state-label") { delete doel.icon; delete doel.image; }
  return { type: doel.type, acties };
}

/* Staat deze entiteit al ergens op een kaart? Dan is dat element het voorbeeld.
   Eerst op de verdieping waar u werkt, pas daarna op een andere — daar staat de
   versie die u waarschijnlijk bedoelt. */
function stijlBron(id) {
  if (!id) return null;
  // Een entiteit óf een voorwerp: bij een entiteit is het entity-id de
  // overeenkomst, bij een tekening het bestandspad. Zo krijgt een bed op de 1e
  // verdieping dezelfde maat als het bed op het gelijkvloers.
  const past = e => e && e.type !== "conditional" && (e.entity === id || e.image === id);
  const hier = [];
  const loop = (lijst, uit) => {
    for (const e of lijst || []) {
      if (!e || typeof e !== "object") continue;
      if (past(e)) uit.push(e);
      loop(e.elements, uit);
    }
  };
  if (STAAT.kaart) loop(STAAT.kaart.elements, hier);
  if (hier.length) {
    return { e: hier[0], verdiep: (STAAT.view && STAAT.view.title) || "deze verdieping", eigen: true };
  }
  const elders = alleElementen().filter(k => past(k.e));
  return elders.length ? { e: elders[0].e, verdiep: elders[0].verdiep, eigen: false } : null;
}

function stijlOvernemen(doel, bron) {
  if (!doel || !bron || doel === bron) return;
  if (bron.type === "conditional") {
    meld("Een voorwaarde-wikkel heeft geen eigen stijl om over te nemen — kies een element.", "fout");
    return;
  }
  onthoud();
  const gedaan = stijlVan(doel, bron);
  if (!gedaan) { meld("Niets overgenomen.", "fout"); return; }
  bouwStaats();
  tekenAlles();
  selecteer(doel);
  meld(
    `Soort en stijl overgenomen van "${naamVan(bron)}" (${bron.type})` +
    (gedaan.acties.length ? `, met ${gedaan.acties.join(" en ")}` : "") +
    `. Uw entiteit en uw plek zijn ongewijzigd. ↶ draait het terug.`,
    "serieus"
  );
}

async function kiesStijlBron(doel) {
  const allen = alleElementen();
  const zonderZichzelf = allen.filter(k => k.e !== doel);
  // Eerst de elementen met dezelfde entiteit. Bij "de klok van Gelijkvloer wil
  // ik ook hier" staat de bron dan meteen bovenaan, in plaats van tussen de 87
  // regels van alle verdiepingen.
  const ent = doel && doel.entity;
  const lijst = (zonderZichzelf.length ? zonderZichzelf : allen)
    .slice()
    .sort((a, b) => {
      const sa = ent && a.e.entity === ent ? 0 : 1;
      const sb = ent && b.e.entity === ent ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return `${a.verdiep} ${naamVan(a.e)}`.localeCompare(`${b.verdiep} ${naamVan(b.e)}`, "nl");
    });
  if (!lijst.length) {
    meld("Deze kaart heeft verder geen elementen om een stijl van over te nemen.", "fout");
    return;
  }
  const invul = await vraagVenster({
    kop: "Stijl overnemen",
    uitleg: "Kies het element waarvan dit element het soort en de stijl overneemt. " +
            "Uw entiteit en uw plek op de kaart blijven ongewijzigd; de acties " +
            "(tikken, vasthouden) komen mee als het gekozen element ze heeft.",
    velden: [{
      sleutel: "bron",
      label: "neem over van",
      type: "keuze",
      opties: lijst.map((k, i) => ({
        waarde: String(i),
        label: `${k.verdiep} — ${naamVan(k.e)}` +
               (k.e.entity ? ` (${k.e.entity})` : "") + ` · ${k.e.type}`,
      })),
      waarde: "0",
    }],
    okTekst: "Overnemen",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Niets veranderd."); return; }
  const gekozen = lijst[parseInt(invul.bron, 10)];
  if (!gekozen) { meld("Geen bron gekozen — er is niets veranderd.", "fout"); return; }
  stijlOvernemen(doel, gekozen.e);
}

/* ------------------- schalen en draaien -------------------

   In het rechtermuisklik-menu: "Schaal" en "Draaien". Dan komen er grepen ín het
   element zelf te zitten — op de vier hoeken, in het midden van elke rand, en één
   ronde erboven om te draaien. Omdat ze in het element zitten, bewegen ze mee.

   Schalen gebeurt rond het midden, en dat is geen willekeur: `left` en `top`
   wijzen in Home Assistant het midden van een element aan, dus zo blijft het
   staan waar u het neerzette. Draaien gebeurt om datzelfde midden. Met shift
   erbij blijft bij een hoekpunt de verhouding gelijk (en draait het in stappen
   van 15°). */

const GREEP_RICHTINGEN = ["nw", "n", "ne", "e", "se", "s", "sw", "w"];
const GREEP_CURSOR = {
  nw: "nwse-resize", n: "ns-resize", ne: "nesw-resize", e: "ew-resize",
  se: "nwse-resize", s: "ns-resize", sw: "nesw-resize", w: "ew-resize",
};

function greepModus(e, modus) {
  if (!e) return;
  if (!STAAT.selektie.has(e)) selecteer(e);
  STAAT.grepen = { e, modus };
  tekenAlles();
  meld(modus === "schaal"
    ? "Schaal: sleep een handvat. Met shift erbij blijft de verhouding gelijk. Escape stopt."
    : "Draaien: sleep het ronde handvat. Met shift erbij in stappen van 15°. Escape stopt.");
}

function grepenWeg() {
  if (!STAAT.grepen) return;
  STAAT.grepen = null;
  tekenAlles();
}

function grepenTeken(doos, e, modus) {
  // Staat er een schaal op het element, dan krijgen de grepen de omgekeerde
  // schaal: anders werden ze strepen in plaats van handvatten.
  const s = schaalVan(e.style && e.style.transform);
  const tegenschaal = (s.x !== 1 || s.y !== 1) ? `scale(${1 / s.x}, ${1 / s.y})` : "";
  const maak = (klasse, stijl, uitleg, richting) => {
    const g = document.createElement("div");
    g.className = "greep" + (klasse ? " " + klasse : "");
    for (const [k, v] of Object.entries(stijl)) g.style[k] = v;
    if (tegenschaal) g.style.transform = tegenschaal;
    g.title = uitleg;
    if (richting) g.dataset.richting = richting;
    g.addEventListener("pointerdown", ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();              // niet ook nog het element verslepen
      // De greep houdt de aanwijzer vast, zodat het slepen niet stopt als u
      // buiten het venster komt. Lukt dat niet, dan werkt het ook zonder.
      try { g.setPointerCapture(ev.pointerId); } catch (_) { /* zonder */ }
      if (modus === "draaien") draaiSleep(doos, e);
      else schaalSleep(doos, e, richting);
    });
    doos.appendChild(g);
  };
  if (modus === "draaien") {
    maak("draai", { left: "50%", top: "-24px" }, "sleep om te draaien", null);
    return;
  }
  for (const r of GREEP_RICHTINGEN) {
    const links = r.includes("w") ? "0%" : r.includes("e") ? "100%" : "50%";
    const boven = r.includes("n") ? "0%" : r.includes("s") ? "100%" : "50%";
    const hoek = r.length === 2;                     // nw, ne, se, sw
    const wat = hoek ? "breedte én hoogte"
      : (r === "e" || r === "w") ? "alleen de breedte" : "alleen de hoogte";
    maak(hoek ? "hoek" : "", { left: links, top: boven, cursor: GREEP_CURSOR[r] },
        `schaal ${r} — ${wat} (met shift blijft de verhouding)`, r);
  }
}

/* Een zwevend kaartje met de maat of de hoek, dat de muis volgt. */
function greepLabel(ev) {
  let l = document.getElementById("greep-label");
  if (!l) {
    l = document.createElement("div");
    l.id = "greep-label";
    document.body.appendChild(l);
  }
  l.style.left = (ev.clientX + 14) + "px";
  l.style.top = (ev.clientY + 10) + "px";
  return l;
}

function greepLabelWeg() {
  const l = document.getElementById("greep-label");
  if (l) l.remove();
}

/* Het midden van een element in beeldpunten: `left`/`top` zijn procenten van de
   kaart en wijzen dat midden aan. */
function elementMidden(e, vak) {
  const st = e.style || {};
  return {
    x: vak.left + vak.width * (parseFloat(st.left ?? "50") / 100),
    y: vak.top + vak.height * (parseFloat(st.top ?? "50") / 100),
  };
}

function schaalSleep(doos, e, richting) {
  const st = e.style || (e.style = {});
  const vak = el("vlak").getBoundingClientRect();
  if (vak.width < 10 || !richting) return;
  const midden = elementMidden(e, vak);
  const sleeptBreedte = richting.includes("w") || richting.includes("e");
  const sleeptHoogte = richting.includes("n") || richting.includes("s");
  // De onvervormde maat van het element. `offsetWidth`/`offsetHeight` zijn de
  // opmaakmaten en niet wat een transform ervan maakt, dus dit is de basis.
  const begin = { w: doos.offsetWidth, h: doos.offsetHeight };
  const begintSchaal = schaalVan(st.transform);
  const hoek = rotatieVan(st.transform);
  // Een pictogram, badge of label wordt door zijn lettergrootte geschaald en niet
  // door een breedte of hoogte; tekst rekt nu eenmaal niet.
  const viaLettergrootte = !isAfbeelding(e);
  const beginFont = parseFloat(st["font-size"]) ||
    (begin.h / Math.max(1, window.innerWidth) * 100);
  onthoud();
  let label = null;
  let laatste = { x: begintSchaal.x, y: begintSchaal.y };
  const r2 = n => Math.round(n * 100) / 100;

  /* Waarom een schaal en geen breedte en hoogte: geeft u een afbeelding een eigen
     hoogte, dan zet Home Assistant haar op `object-fit: cover` — die snijdt bij.
     Een `transform` voert de kaart wél uit, dus rekken kan alleen zo. En omdat
     dezelfde transform hier hetzelfde uitpakt, blijft de editor gelijk aan het
     dashboard. */
  const beweeg = ev => {
    const dx = Math.abs(ev.clientX - midden.x) * 2;
    const dy = Math.abs(ev.clientY - midden.y) * 2;
    label = label || greepLabel(ev);
    label.style.left = (ev.clientX + 14) + "px";
    label.style.top = (ev.clientY + 10) + "px";

    if (viaLettergrootte) {
      const basisPx = sleeptBreedte ? begin.w : begin.h;
      const factor = Math.max(0.15, (sleeptBreedte ? dx : dy) / Math.max(1, basisPx));
      st["font-size"] = (beginFont * factor).toFixed(2) + "vw";
      doos.style.fontSize = cssWaarde(st["font-size"]);
      label.textContent = `lettergrootte ${st["font-size"]}`;
      return;
    }

    // De afstand tot het midden is de maat die u ziet; `begin.w`/`begin.h` zijn de
    // onvervormde maten. Het quotiënt is dus meteen de schaal — de bestaande schaal
    // er nog eens mee vermenigvuldigen zou hem dubbel tellen en laten springen.
    let sx = sleeptBreedte ? dx / Math.max(1, begin.w) : begintSchaal.x;
    let sy = sleeptHoogte ? dy / Math.max(1, begin.h) : begintSchaal.y;
    if (ev.shiftKey && sleeptBreedte && sleeptHoogte) sy = sx;
    sx = Math.max(0.05, sx);
    sy = Math.max(0.05, sy);
    laatste = { x: sx, y: sy };
    st.transform = metTransform(st.transform, hoek, sx, sy);
    doos.style.transform = cssWaarde(st.transform);
    // De grepen mogen niet meerekken, anders wordt een handvat een streep en
    // staat het niet meer op de hoek. Ze krijgen de omgekeerde schaal.
    for (const g of doos.querySelectorAll(".greep")) {
      g.style.transform = `scale(${r2(1 / sx)}, ${r2(1 / sy)})`;
    }
    label.textContent = `schaal ${r2(sx)} × ${r2(sy)}` +
      (sleeptBreedte && !sleeptHoogte ? " · hoogte onveranderd"
        : sleeptHoogte && !sleeptBreedte ? " · breedte onveranderd" : "");
  };

  const stop = () => {
    window.removeEventListener("pointermove", beweeg);
    window.removeEventListener("pointerup", stop);
    window.removeEventListener("pointercancel", stop);
    greepLabelWeg();
    tekenAlles();
    selecteer(e);
    meld(viaLettergrootte
      ? `"${naamVan(e)}" staat nu op lettergrootte ${st["font-size"]}. ↶ draait het terug.`
      : `"${naamVan(e)}" geschaald: ${r2(laatste.x)} × ${r2(laatste.y)}` +
        (sleeptBreedte && !sleeptHoogte ? " (alleen de breedte)"
          : sleeptHoogte && !sleeptBreedte ? " (alleen de hoogte)" : "") +
        ". ↶ draait het terug.", "serieus");
  };
  window.addEventListener("pointermove", beweeg);
  window.addEventListener("pointerup", stop);
  window.addEventListener("pointercancel", stop);
}

function draaiSleep(doos, e) {
  const st = e.style || (e.style = {});
  const vak = el("vlak").getBoundingClientRect();
  const midden = elementMidden(e, vak);
  const hoekVan = ev => Math.atan2(ev.clientY - midden.y, ev.clientX - midden.x) * 180 / Math.PI;
  const begin = rotatieVan(st.transform);
  // De aanwijzer ligt bij het begin boven het element: die hoek is het nulpunt,
  // zodat een al gedraaid element gewoon verder draait in plaats van te springen.
  const nul = hoekVan({ clientX: midden.x, clientY: midden.y - 100 });
  onthoud();
  let label = null;

  const beweeg = ev => {
    let graden = begin + (hoekVan(ev) - nul);
    if (ev.shiftKey) graden = Math.round(graden / 15) * 15;
    st.transform = metRotatie(st.transform, graden);
    doos.style.transform = cssWaarde(st.transform);
    label = label || greepLabel(ev);
    label.style.left = (ev.clientX + 14) + "px";
    label.style.top = (ev.clientY + 10) + "px";
    label.textContent = `${Math.round(((graden % 360) + 360) % 360)}°`;
  };

  const stop = () => {
    window.removeEventListener("pointermove", beweeg);
    window.removeEventListener("pointerup", stop);
    window.removeEventListener("pointercancel", stop);
    greepLabelWeg();
    tekenAlles();
    selecteer(e);
    meld(`"${naamVan(e)}" staat nu op ` +
         `${Math.round(((rotatieVan(st.transform) % 360) + 360) % 360)}°. ↶ draait het terug.`, "serieus");
  };
  window.addEventListener("pointermove", beweeg);
  window.addEventListener("pointerup", stop);
  window.addEventListener("pointercancel", stop);
}

/* De hoek uit een `transform`, of 0. */
function rotatieVan(transform) {
  const m = /rotate\(\s*(-?[\d.]+)deg\s*\)/.exec(String(transform || ""));
  return m ? parseFloat(m[1]) : 0;
}

/* De transform zonder een `rotate(...)` erin; leeg als er niets anders stond. */
function zonderRotatie(transform) {
  return String(transform || "").replace(/rotate\(\s*-?[\d.]+deg\s*\)\s*/g, "").trim();
}

/* De schaal uit een `transform`: `scale(s)` of `scale(sx, sy)`. */
function schaalVan(transform) {
  const m = /scale\(\s*([-\d.]+)\s*(?:,\s*([-\d.]+)\s*)?\)/.exec(String(transform || ""));
  if (!m) return { x: 1, y: 1 };
  const x = parseFloat(m[1]);
  const y = m[2] !== undefined ? parseFloat(m[2]) : x;
  return { x: isFinite(x) && x !== 0 ? x : 1, y: isFinite(y) && y !== 0 ? y : 1 };
}

/* Een transform met deze hoek en schaal erin; de rest blijft staan. Zonder eigen
   transform zetten we het centreren erbij: Home Assistant centreert een element
   alleen zolang er geen transform staat — anders verschoof het element. */
function metTransform(transform, graden, sx, sy) {
  const had = String(transform || "").trim();
  const zonder = had.replace(/rotate\(\s*-?[\d.]+deg\s*\)\s*/g, "")
                    .replace(/scale\(\s*[-\d.]+(?:\s*,\s*[-\d.]+)?\s*\)\s*/g, "")
                    .trim();
  const delen = [];
  if (!had) delen.push("translate(-50%, -50%)");
  else if (zonder) delen.push(zonder);
  if (graden !== undefined) delen.push(`rotate(${Math.round(graden)}deg)`);
  if (sx !== undefined && sy !== undefined) {
    const r = n => Math.round(n * 100) / 100;
    if (r(sx) !== 1 || r(sy) !== 1) delen.push(`scale(${r(sx)}, ${r(sy)})`);
  }
  return delen.join(" ");
}

/* Een transform met deze hoek erin, en de schaal die er al in zat. */
function metRotatie(transform, graden) {
  const s = schaalVan(transform);
  return metTransform(transform, graden, s.x, s.y);
}

/* De regels van het rechtermuisklik-menu op een element: de voorwaarde, en het
   overnemen van de stijl van een ander element. */
function elementMenuItems(e) {
  return [
    ...voorwaardeMenuItems(e),
    { scheiding: true },
    {
      tekst: "Schaal",
      uitleg: "handvatten om breder, hoger of allebei te maken — met shift blijft de verhouding gelijk",
      doe: () => greepModus(e, "schaal"),
    },
    {
      tekst: "Draaien",
      uitleg: "een rond handvat om het element te draaien — met shift in stappen van 15°",
      doe: () => greepModus(e, "draaien"),
    },
    { scheiding: true },
    {
      tekst: "Stijl overnemen van ander element…",
      uitleg: "soort, stijl en acties van een ander element overnemen — uw entiteit en plek blijven",
      doe: () => kiesStijlBron(e),
    },
  ];
}

/* De voorwaarde in gewone taal: "als X is on" of "als X niet on is" (de
   omgekeerde tak, die Home Assistant met `state_not` opslaat). */
function voorwaardeTekst(c) {
  if (!c || !c.entity) return "als ?";
  return c.state_not !== undefined
    ? `als ${c.entity} niet ${c.state_not} is`
    : `als ${c.entity} is ${c.state !== undefined ? c.state : "?"}`;
}

/* Een element in een `conditional` zetten: als <entiteit> <drempel> is, dan dit.
   Met de mogelijkheid om meteen de omgekeerde tak erbij te zetten — wat in
   gewone taal "anders" heet. Home Assistant kent géén else: een tweede
   voorwaarde met `state_not` is daar de manier voor, en dat is precies wat dit
   doet. Het element zelf blijft hetzelfde object, dus de sleutel en uw selectie
   veranderen niet. */
async function voorwaardeToevoegen(e) {
  const info = STAAT.tak.get(e);
  if (!info || !info.lijst) {
    meld("Dit element kan hier geen voorwaarde krijgen.", "fout");
    return;
  }
  const invul = await vraagVenster({
    kop: "Als … dan …",
    uitleg: "Dit element komt in een voorwaarde te staan: het is alleen te zien " +
      "als de entiteit deze waarde heeft. Dat is de als…dan van Home Assistant — " +
      "een aparte anders-tak bestaat er niet. Wilt u die wel, laat dan hieronder " +
      "een tweede exemplaar met de omgekeerde waarde maken; dat is in de praktijk " +
      "hetzelfde.",
    velden: [
      { sleutel: "entity", label: "als deze entiteit…",
        waarde: e.entity || "", placeholder: "bijv. binary_sensor.geveldeur" },
      { sleutel: "state", label: "…deze waarde heeft",
        waarde: "on", placeholder: "on, off, open, closed, home, …" },
      { sleutel: "anders", label: "meteen ook de omgekeerde tak (anders)",
        type: "keuze",
        opties: [
          { waarde: "", label: "nee" },
          { waarde: "ja", label: "ja — tweede exemplaar met de tegenovergestelde waarde" },
        ],
        waarde: "" },
    ],
    okTekst: "Toevoegen",
    cancelTekst: "Annuleren",
  });
  if (!invul) { meld("Niets veranderd."); return; }
  const ent = (invul.entity || "").trim();
  const waarde = (invul.state || "").trim();
  if (!ent || !waarde) {
    meld("Een entiteit én een waarde zijn allebei nodig — er is niets veranderd.", "fout");
    return;
  }

  onthoud();
  const wikkel = {
    type: "conditional",
    conditions: [{ entity: ent, state: waarde }],
    elements: [e],
  };
  info.lijst.splice(info.index, 1, wikkel);
  let extra = "";
  if (invul.anders === "ja") {
    const kopie = JSON.parse(JSON.stringify(e));
    const omgekeerd = {
      type: "conditional",
      conditions: [{ entity: ent, state_not: waarde }],
      elements: [kopie],
    };
    info.lijst.splice(info.index + 1, 0, omgekeerd);
    extra = " en de omgekeerde tak (anders) ernaast";
  }
  bouwStaats();
  tekenAlles();
  selecteer(e);
  toonPositie(e, false);
  meld(`${naamVan(e)} valt nu onder "${voorwaardeTekst(wikkel.conditions[0])}"${extra}. ` +
    "↶ draait het terug; 💾 schrijft het naar het dashboard.", "serieus");
}

/* De wikkel weghalen: het element komt weer los te staan. Zaten er meer
   elementen in dezelfde voorwaarde, dan blijft die voor de rest bestaan en
   schuift alleen dit element eruit — anders zou u de anderen kwijtraken. */
function voorwaardeWegnemen(e) {
  const info = STAAT.tak.get(e);
  if (!info || !info.lijst) {
    meld("Dit element kan hier niet weg.", "fout");
    return;
  }
  // Twee gevallen, en ze betekenen iets anders:
  //  - je hebt een element binnen de voorwaarde geselecteerd: dat ene element
  //    komt los te staan, de voorwaarde blijft voor de rest;
  //  - je hebt de wikkel zelf geselecteerd: dan vervalt de voorwaarde voor
  //    alles erin.
  const isWikkel = e.type === "conditional" && e.conditions && e.conditions.length &&
    Array.isArray(e.elements);
  const wikkel = isWikkel ? e : (info.ouder && info.ouder.type === "conditional" ? info.ouder : null);
  if (!wikkel) {
    meld("Dit element zit niet in een voorwaarde.", "fout");
    return;
  }

  onthoud();
  let wat;
  if (isWikkel) {
    info.lijst.splice(info.index, 1, ...wikkel.elements);
    wat = `de voorwaarde ${voorwaardeTekst(wikkel.conditions[0])} is weg — ` +
      `${wikkel.elements.length} element(en) staan weer los`;
  } else {
    const wikkelInfo = STAAT.tak.get(wikkel);
    if (!wikkelInfo || !wikkelInfo.lijst) {
      meld("De voorwaarde kan hier niet weg.", "fout");
      return;
    }
    const i = wikkel.elements.indexOf(e);
    if (i >= 0) wikkel.elements.splice(i, 1);
    if (!wikkel.elements.length) wikkelInfo.lijst.splice(wikkelInfo.index, 1, e);
    else wikkelInfo.lijst.splice(wikkelInfo.index + 1, 0, e);
    wat = `${naamVan(e)} staat weer los — de voorwaarde blijft voor de andere elementen`;
  }
  bouwStaats();
  tekenAlles();
  selecteer(isWikkel ? (wikkel.elements[0] || null) : e);
  toonPositie(isWikkel ? null : e, false);
  meld(`${wat.charAt(0).toUpperCase()}${wat.slice(1)}. ↶ draait het terug.`, "serieus");
}

function verwijderGeselecteerd() {
  const e = STAAT.geselecteerd;
  const zeg = txt => {
    const m = el("i-melding");
    if (m) m.textContent = txt; else meld(txt);
  };
  if (!e) { zeg("selecteer eerst een element"); return false; }
  const info = STAAT.tak.get(e);
  if (!info || !info.lijst) { zeg("dit element kan hier niet weg"); return false; }
  onthoud();
  info.lijst.splice(info.index, 1);
  STAAT.geselecteerd = null;
  STAAT.selektie.clear();
  bouwStaats();
  tekenAlles();
  toonPositie(null);
  zeg("verwijderd — ongedaan kan het terugbrengen");
  return true;
}

function tekenInspector() {
  const doel = el("inspector");
  const e = STAAT.geselecteerd;
  if (!e) {
    doel.innerHTML = `<div class="leeg">Dubbelklik op een element in de boom of op de kaart.</div>`;
    el("yaml").textContent = "—";
    el("yaml").classList.add("leeg");
    return;
  }
  el("yaml").classList.remove("leeg");
  el("yaml").textContent = naarYAML(e, 0);

  const st = e.style || {};
  // De voorwaarde hoort bij de `conditional` erómheen (of bij de wikkel zelf).
  // Bewerken gebeurt met een rechtermuisklik; hier tonen we alleen wat het is.
  const voorwaarde = voorwaardeVan(e);
  const uitSnapshot =
    STAAT.condities === "statussen" && voorwaarde && conditieWaar(voorwaarde) !== null;
  const ruis = !isVerschuifbaar(e);
  const naam = icoonVan(e);
  const { kleur, onbekend } = kleurVan(e, "#ffffff");
  // Het inhoudsveld is er óók als er nog geen icoon staat — juist dán wil je er
  // een kunnen zetten. Eerder verscheen het alleen als er al iets stond, dus
  // precies niet bij het geval waarvoor je het nodig hebt.
  const inhoudHeeft = e.image !== undefined || e.icon !== undefined ||
    e.type === "state-icon" || e.type === "icon";

  // Voor de autocomplete: elk icoon dat deze editor kent (en dus kan tekenen),
  // plus alles wat al ergens in het dashboard gebruikt wordt. Staat het er niet
  // bij, dan mag u het gewoon typen — Home Assistant tekent het wel, alleen de
  // editor laat dan een vraagteken zien.
  const gebruikt = new Set();
  const loopIconen = lijst => {
    for (const x of lijst || []) {
      if (!x || typeof x !== "object") continue;
      if (x.icon) gebruikt.add(String(x.icon));
      loopIconen(x.elements);
      if (x.card) loopIconen(Array.isArray(x.card) ? x.card : [x.card]);
      loopIconen(x.cards);
      loopIconen(x.sections);
      loopIconen(x.badges);
    }
  };
  loopIconen((STAAT.doc && STAAT.doc.views || [])
    .flatMap(v => [].concat(v.cards || [], v.sections || [], v.badges || [])));
  const iconenNamen = [...new Set([...Object.keys(STAAT.iconen), ...gebruikt])].sort();

  doel.innerHTML = `
    <div class="rij">
      <span class="tag">${e.type}</span>
      <span class="tag">zone: ${e.__zone ? `${ZONE_NAAM[e.__zone] || e.__zone} — ${e.__bron}` : "geen — altijd zichtbaar"}</span>
      ${naam && STAAT.iconen[naam] ? `<span class="tag">${naam}</span>` : ""}
      ${!naam && e.entity ? `<span class="tag">icoon: eigen van de entiteit</span>` : ""}
      ${voorwaarde ? `<span class="tag">${voorwaardeTekst(voorwaarde)}</span>` : ""}
      ${uitSnapshot ? `<span class="tag">nu: ${voorwaarde.entity} is ${stateOf(voorwaarde.entity)} — uit de snapshot</span>` : ""}
      ${ruis ? `<span class="tag raar">breedte 100% — niet te verplaatsen</span>` : ""}
      ${onbekend ? `<span class="tag raar">kleur ${onbekend} komt uit een thema dat deze pagina niet leest</span>` : ""}
    </div>
    <div class="vier">
      <label class="veld"><span>entity</span>
        <input id="i-entity" list="entiteiten-ids" autocomplete="off"
               title="Typ voor suggesties uit alle entiteiten. Leeg laten betekent: geen entity."
               value="${e.entity || ""}" placeholder="(geen entity)"></label>
    </div>
    <div class="vier">
      <label class="veld"><span>verwijzingen naar</span>
        <input id="i-zoek" list="entiteiten-ids" autocomplete="off"
               title="Elke plek in dit document waar die entiteit voorkomt. Wijzig het veld om resten van een eerdere wissel op te sporen."
               value="${e.entity || (voorwaarde && voorwaarde.entity) || ""}"></label>
      <label class="veld"><span>vervang alle door</span>
        <input id="i-vervang" list="entiteiten-ids" autocomplete="off"
               title="Vervangt alle plekken hieronder in één keer, inclusief de abonnementslijst. Ongedaan draait het terug."></label>
    </div>
    <div id="i-plekken" class="plekken"></div>
    <div class="rij">
      <button id="i-vervang-knop" class="groeit">Verwijzingen vervangen</button>
    </div>
    ${voorwaarde ? `
      <label><input type="checkbox" id="i-aan" ${takAan(voorwaarde) ? "checked" : ""} ${uitSnapshot ? "disabled" : ""}>
        ${uitSnapshot
          ? "voorwaarde volgt de snapshot — zet 'voorwaarden' op handmatig om zelf te kiezen"
          : "voorwaarde actief — alleen om te bekijken, er verandert niets in het bestand"}</label>` : ""}
    <div class="vier">
      <label class="veld"><span>links (midden)</span>
        <input id="i-links" value="${st.left ?? "50%"}" ${ruis ? "disabled" : ""}></label>
      <label class="veld"><span>boven (midden)</span>
        <input id="i-boven" value="${st.top ?? "50%"}" ${ruis ? "disabled" : ""}></label>
      <label class="veld"><span>breedte</span><input id="i-breedte" value="${st.width ?? ""}"></label>
      <label class="veld"><span>hoogte</span>
        <input id="i-hoogte" placeholder="leeg = eigen verhouding" value="${st.height ?? ""}"></label>
      <label class="veld"><span>rotatie (°)</span>
        <input id="i-rotatie" placeholder="0" value="${st.transform ? rotatieVan(st.transform) : ""}"></label>
      <label class="veld"><span>z-index</span><input id="i-z" value="${st["z-index"] ?? ""}"></label>
    </div>
    <div class="legenda">pijltjestoetsen verplaatsen 0,5% · ctrl+scroll zoomt</div>
    ${inhoudHeeft ? (e.image !== undefined
      ? `<label class="veld"><span>afbeelding (uitdrukking)</span>
          <textarea id="i-inhoud" rows="3">${e.image}</textarea></label>`
      : `<label class="veld"><span>icoon — leeg laten = het eigen icoon van de entiteit</span>
          <input id="i-inhoud" list="iconen-lijst" autocomplete="off"
                 value="${e.icon ?? ""}" placeholder="mdi:thermometer"></label>
        <datalist id="iconen-lijst">${iconenNamen.map(n => `<option>${n}</option>`).join("")}</datalist>`
    ) : ""}
    <div class="rij">
      <button id="i-toepassen" class="primary groeit">Toepassen</button>
      <button id="i-verwijderen" class="gevaarlijk">Verwijderen</button>
    </div>
    <div class="legenda">rechtermuisklik op het element (of in de boom links) voor de voorwaarde</div>
    <div class="rij"><span class="tag" id="i-melding"></span></div>
  `;

  const zeg = txt => { el("i-melding").textContent = txt; };

  if (voorwaarde) el("i-aan").onchange = ev => {
    voorwaarde.__aan = ev.target.checked; tekenAlles();
  };

  const velden = {
    links: el("i-links"), boven: el("i-boven"),
    breedte: el("i-breedte"), hoogte: el("i-hoogte"),
    rotatie: el("i-rotatie"), z: el("i-z"),
  };

  /* Zoeken en in één keer vervangen. Eigen knop, niet `Toepassen`: het veld
     hierboven gaat over dit element, dit over élke plek in het document. */
  const veldZoek = el("i-zoek"), veldNieuw = el("i-vervang");
  if (veldZoek) veldZoek.oninput = toonVerwijzingen;
  if (veldNieuw) veldNieuw.oninput = vervangKnopStatus;
  const vervangKnop = el("i-vervang-knop");
  if (vervangKnop) vervangKnop.onclick = () => {
    const bron = (veldZoek.value || "").trim();
    const doel = (veldNieuw.value || "").trim();
    if (!bron || !doel) { zeg("vul zowel de oude als de nieuwe entiteit in"); return; }
    if (bron === doel) { zeg("oud en nieuw zijn gelijk"); return; }
    const gevonden = verwijzingenNaar(bron).length;
    if (!gevonden) { zeg(`${bron} komt nergens voor`); return; }

    onthoud();
    const gedaan = vervangVerwijzingen(bron, doel);
    bouwStaats();
    tekenAlles();
    toonPositie(e, false);
    const ab = STAAT.abonnement || { toegevoegd: [], weggehaald: [] };
    const abKort = (ab.toegevoegd.length || ab.weggehaald.length)
      ? ` · abonnement ${ab.toegevoegd.length} bij, ${ab.weggehaald.length} af` : "";
    zeg(`${gedaan} verwijzing${gedaan === 1 ? "" : "en"} vervangen: ${bron} → ${doel}${abKort}`);
  };
  toonVerwijzingen();

  el("i-toepassen").onclick = () => {
    // Eerst vastleggen wát er stond. `onthoud` bewaart het héle document, dus
    // zou dit ná de wijziging gebeuren dan brengt Ongedaan u terug naar de
    // gewijzigde stand — wat precies is wat er hiervoor gebeurde.
    onthoud();
    st.left = velden.links.value.trim() || st.left;
    st.top = velden.boven.value.trim() || st.top;
    const b = velden.breedte.value.trim();
    if (b) st.width = b; else delete st.width;
    const h = velden.hoogte.value.trim();
    if (h) st.height = h; else delete st.height;
    // Rotatie hoort in `transform`. Leeg betekent: alleen de rotate eruit halen,
    // zodat een eigen `translate(...)` blijft staan.
    const r = velden.rotatie.value.trim();
    if (r === "") {
      const zonder = zonderRotatie(st.transform);
      if (zonder) st.transform = zonder; else delete st.transform;
    } else {
      st.transform = metRotatie(st.transform, parseFloat(r) || 0);
    }
    const z = velden.z.value.trim();
    if (z) st["z-index"] = z; else delete st["z-index"];
    const inhoud = el("i-inhoud");
    if (inhoud) {
      if (e.image !== undefined) e.image = inhoud.value;
      else {
        // Leegmaken moet het veld weghalen, niet een leeg icoon achterlaten:
        // `icon: ""` laat Home Assistant niets tekenen, terwijl géén `icon`
        // juist het icoon van de entiteit zelf pakt (de thermometer bij een
        // temperatuursensor).
        const v = inhoud.value.trim();
        if (v) e.icon = v; else delete e.icon;
      }
    }
    // De entity van het element zelf, en die van de voorwaarde eromheen.
    // Losse knoppen: het element kan een entity hebben zónder voorwaarde, en
    // een voorwaarde zonder dat het element er zelf een heeft.
    const ent = el("i-entity");
    if (ent) {
      const v = ent.value.trim();
      if (v) e.entity = v; else delete e.entity;
    }
    // De voorwaarde wordt niet hier bewerkt: die zit in het rechtermuisklik-menu
    // (entiteit, waarde en omgekeerd), zodat dit paneel rustig blijft.
    // Een entity die niet in de lijst staat mag, maar moet wel opvallen:
    // het element zou anders stil niets meer doen.
    const onbekend = [];
    if (e.entity && !STAAT.namen[e.entity]) onbekend.push(e.entity);
    if (voorwaarde && voorwaarde.entity && !STAAT.namen[voorwaarde.entity]) {
      onbekend.push(voorwaarde.entity);
    }
    bouwStaats();
    tekenAlles();
    toonPositie(e, false);
    const ab = STAAT.abonnement || { toegevoegd: [], weggehaald: [] };
    const aantalAb = ab.toegevoegd.length + ab.weggehaald.length;
    const abKort = !aantalAb ? ""
      : aantalAb <= 2
        ? " · abonnement " +
          ab.toegevoegd.map(x => "+" + x).concat(ab.weggehaald.map(x => "−" + x)).join(" ")
        : ` · abonnement ${ab.toegevoegd.length} bij, ${ab.weggehaald.length} af`;
    zeg((onbekend.length
      ? `onbekend in de entiteitenlijst: ${onbekend.join(", ")}`
      : "toegepast — Ongedaan draait het terug") + abKort);
  };

  el("i-verwijderen").onclick = () => verwijderGeselecteerd();

  // De getallen meelopen tijdens het slepen, zodat u het niet hoeft te schatten.
  el("vlak").querySelectorAll(".el").forEach(doos => {
    if (doos.__element !== e) return;
    const zet = () => {
      velden.links.value = st.left ?? "50%";
      velden.boven.value = st.top ?? "50%";
    };
    doos.addEventListener("pointermove", zet);
    doos.addEventListener("pointerup", zet);
  });
}

/* Ruwe YAML, zodat u precies ziet wat u bewerkt. */
function naarYAML(e, diepte) {
  if (Array.isArray(e)) {
    return e.map(x => inspring(diepte) + "- " + yamlSchaal(x, diepte + 1)).join("\n");
  }
  if (e && typeof e === "object") {
    return Object.entries(e)
      .filter(([k]) => k !== "__aan")
      .map(([k, v]) => {
        if (v && typeof v === "object") {
          return inspring(diepte) + k + ":\n" + inspring(diepte) + yamlSchaal(v, diepte + 1);
        }
        return inspring(diepte) + k + ": " + scalar(v);
      }).join("\n");
  }
  return inspring(diepte) + scalar(e);
}
function yamlSchaal(v, diepte) {
  if (v && typeof v === "object") return naarYAML(v, diepte);
  return scalar(v);
}
const inspring = d => "  ".repeat(d);
const scalar = v => typeof v === "string" ? `'${v.replace(/'/g, "''")}'` : String(v);

/* Volledige YAML van het hele document, om op te slaan.

   `naarYAML` hierboven is een kijker voor de inspectie, geen schrijver: hij
   laat lege `{}` en `[]` weg (wordt `null`), hangt de eerste regel van een
   object verkeerd aan een `- ` (gaat niet parseën) en laat strings met een
   nieuwe regel halverwege. Dit is de schrijver. Geciteerd wordt alleen wat
   nodig is, maar wel alles waar YAML 1.1 anders `true`, `100` of een datum
   van zou maken — Home Assistant laadt met die oude regels, en `state: on`
   zonder aanhalingstekens wordt dan een booleaans getal in plaats van de
   staat die het hoort te zijn. */
function documentYAML(doc) {
  const pad = d => "  ".repeat(d);
  const GEVAARLIJK = new Set(["", "~", "null", "true", "false",
                              "yes", "no", "on", "off", "y", "n"]);
  const isGetal = s =>
    /^[-+]?[0-9][0-9_]*(\.[0-9_]*)?([eE][-+]?[0-9]+)?$/.test(s) ||
    /^(0x[0-9a-fA-F_]+|0o[0-7_]+|0b[01_]+)$/.test(s) ||
    /^[+-]?(\.\.|\.)?(inf|nan)$/i.test(s);
  const isDatum = s => /^\d{4}-\d{1,2}-\d{1,2}([Tt ].*)?$/.test(s);

  function tekst(s) {
    const nodig =
      GEVAARLIJK.has(s.toLowerCase()) ||
      s !== s.trim() ||
      /[\n\r\t]/.test(s) ||
      // Alleen het allereerste teken heeft betekenis, behalve bij `: ` en ` #`.
      ",[]{}#&*!|>'\"%@`".includes(s[0]) ||
      ("-?:".includes(s[0]) && (s.length === 1 || s[1] === " ")) ||
      s.includes(": ") || s.endsWith(":") ||
      s.includes(" #") ||
      isGetal(s) || isDatum(s);
    // JSON-tekst is een geldige dubbel-geciteerde YAML-scalar: dezelfde
    // schuiltekens (`\"`, `\\`, `\n`, `\t`, `\uXXXX`).
    return nodig ? JSON.stringify(s) : s;
  }
  const scalarYAML = v =>
    v === null || v === undefined ? "null"
    : typeof v === "boolean" ? (v ? "true" : "false")
    : typeof v === "number" ? (Number.isFinite(v) ? String(v) : "null")
    : tekst(String(v));

  const leeg = v => {
    if (v === null || typeof v !== "object") return false;
    if (Array.isArray(v)) return v.length === 0;
    return Object.keys(v).filter(k => k !== "__aan").length === 0;
  };

  function regels(waarde, diepte) {
    const p = pad(diepte);
    const uit = [];
    if (Array.isArray(waarde)) {
      for (const item of waarde) {
        if (leeg(item)) {
          uit.push(p + "- " + (Array.isArray(item) ? "[]" : "{}"));
        } else if (item !== null && typeof item === "object") {
          // De eerste regel van het object hangt aan de `- `; de regels
          // erna staan op precies dezelfde hoogte als die eerste regel,
          // want die was al op `pad(diepte + 1)` gezet en we halen daar
          // precies zoveel vanaf als de `- ` inneemt.
          const sub = regels(item, diepte + 1);
          uit.push(p + "- " + sub[0].slice(pad(diepte + 1).length));
          for (let i = 1; i < sub.length; i++) uit.push(sub[i]);
        } else {
          uit.push(p + "- " + scalarYAML(item));
        }
      }
      return uit;
    }
    for (const [k, v] of Object.entries(waarde)) {
      if (k === "__aan") continue;        // werkgeheugen, hoort niet in het bestand
      const ks = tekst(k);
      if (v === null || typeof v !== "object") {
        uit.push(p + ks + ": " + scalarYAML(v));
      } else if (leeg(v)) {
        uit.push(p + ks + ": " + (Array.isArray(v) ? "[]" : "{}"));
      } else {
        uit.push(p + ks + ":");
        for (const r of regels(v, diepte + 1)) uit.push(r);
      }
    }
    return uit;
  }

  const regelLijst = regels(doc, 0);
  return regelLijst.length ? regelLijst.join("\n") + "\n" : "{}\n";
}

/* ---------- toevoegen ----------
   Eén zoekveld, twee lijsten: apparaten (de standaard) en losse entities.
   Zoeken kan op de naam van het apparaat, op elke bijhorende entity én op
   het apparaat-id. */

/* Alle entity's die nu op de plattegrond staan — ook die achter een
   voorwaarde. Daarmee is `toon enkel ongebruikte` te bepalen. */
function kaartEntiteiten() {
  const uit = new Set();
  const loop = lijst => {
    for (const e of lijst || []) {
      if (!e || typeof e !== "object") continue;
      if (e.entity) uit.add(e.entity);
      for (const c of e.conditions || []) if (c && c.entity) uit.add(c.entity);
      if (e.elements) loop(e.elements);
    }
  };
  loop(STAAT.kaart ? STAAT.kaart.elements : []);
  return uit;
}

/* De drie entiteiten-lijsten: alles, alleen de personen, alleen de helpers.
   Apparaten is de vierde en loopt niet via deze functie — die heeft een eigen
   tak hieronder, want een apparaat is geen entiteit. */
function lijstVoorModus(manus) {
  if (manus === "persons") {
    return STAAT.entiteiten.filter(e => e.id.startsWith("person."));
  }
  if (manus === "helpers") {
    return STAAT.entiteiten.filter(e => STAAT.helpers.has(e.id));
  }
  return STAAT.entiteiten;
}

/* Instellingen per verdieping: aan welke Home Assistant-floor dit verdiep hoort,
   en welke achtergrondafbeelding er per variant bij hoort. Bewaard in
   localStorage — het is editor-werkruimte, net als de zones, en geen onderdeel
   van het dashboard dat u met 💾 wegschrijft. */
const VERDIEP_SLEUTEL = "prototype.verdiep";
let verdiepCache = null;          // wat de server heeft (of lokaal als HA wegvalt)

/* De verdiep-koppeling en de afbeeldingen per variant staan in Home Assistant,
   naast de zones. Per computer bewaren betekende dat u ze overal opnieuw moest
   zetten; localStorage is nu alleen nog de cache voor als HA even niet
   antwoordt. */
function verdiepInstellingen() {
  if (verdiepCache) return verdiepCache;
  try { verdiepCache = JSON.parse(localStorage.getItem(VERDIEP_SLEUTEL)) || {}; }
  catch (_) { verdiepCache = {}; }
  return verdiepCache;
}

function bewaarVerdiepInstellingen(alles) {
  verdiepCache = alles;
  try { localStorage.setItem(VERDIEP_SLEUTEL, JSON.stringify(alles)); } catch (_) { /* geen opslag */ }
  verdiepNaarHABinnenkort();
}

/* Waar de instellingen van een view onder bewaard worden: de titel, anders het
   pad, anders de plaats in de lijst. */
function verdiepSleutel(view) {
  if (view && view.title) return view.title;
  if (view && view.path) return view.path;
  return "view-" + (Number.isInteger(STAAT.viewIndex) ? STAAT.viewIndex : 0);
}

function verdiepInstelling(view) {
  return (view && verdiepInstellingen()[verdiepSleutel(view)]) || {};
}

/* Weten we welke zones bij deze verdieping horen? Dat kan pas als de gebieden van
   Home Assistant binnen zijn. Zonder die wetenschap is elke zone een gok en
   tekenen we alleen wat er voor dit verdiep is opgeslagen. */
function zoneVerdiepBekend() {
  const gekoppeld = verdiepInstelling(STAAT.view).floor || "";
  const vloer = STAAT.vloeren;
  return !!(gekoppeld && vloer && vloer.gebied);
}

/* Welke bestandsnaam deze verdieping toont voor een variant: eerst wat er in de
   verdieping-instellingen staat, anders wat de kaart noemt, anders home.png. */
function verdiepAfbeelding(variant, kaart) {
  const inst = verdiepInstelling(STAAT.view);
  const perVariant = inst.afbeeldingen && inst.afbeeldingen[variant];
  // Een uitdrukking in de instellingen is geen bestandsnaam: dan liever wat de
  // kaart noemt, of home.png.
  const eigen = perVariant && !isUitdrukking(perVariant) ? perVariant : "";
  return eigen || afbeeldingVan(kaart) || "home.png";
}

/* De floors uit Home Assistant, voor het koppeldropdownje. Eén klein commando;
   lukt het niet, dan blijft de koppeling op "geen" staan en zeggen we dat. */
async function vloerenLijst() {
  const inst = haInstelling();
  if (!inst.url || !inst.token) return null;
  let ha = null;
  try {
    ha = await metTijdslimiet(haVerbind(inst.url, inst.token), 15000);
    return await metTijdslimiet(ha.stuur("config/floor_registry/list"), 20000);
  } catch (_) {
    return null;
  } finally {
    if (ha) ha.dicht();
  }
}

/* Op welk verdiep een entiteit hoort komt uit de registries van Home Assistant:
   entiteit -> gebied -> floor. Eén keer ophalen en bewaren. Lukt het niet (geen
   token, geen verbinding), dan zeggen we dat bij de toggle en filteren we
   géén — een lege lijst zonder uitleg is erger dan een te lange. */
async function verdiepKaartOphalen() {
  const vak = el("toon-verdiep");
  const regel = el("verdiep-status");
  const zeg = tekst => { if (regel) regel.textContent = tekst; };
  const inst = haInstelling();
  if (!inst.url || !inst.token) {
    // Niet "leeg" maar precies zeggen wát er mist: een adres zonder token is
    // een andere fout dan helemaal niets, en beide zijn met één ⚙-venster
    // op te lossen.
    STAAT.vloeren = { status: "geen instellingen", entiteit: null, apparaat: null };
    zeg(!inst.url
      ? "Verdiepdata: geen adres ingesteld (⚙) — er wordt niet gefilterd."
      : `Verdiepdata: adres ${inst.url} staat er, maar geen token (⚙) — er wordt niet gefilterd.`);
    return STAAT.vloeren;
  }

  const fouten = [];
  const kaart = { status: "klaar", entiteit: null, apparaat: null, gebied: null };
  let ha = null;
  // Elk commando apart, met zijn eigen tijdslimiet. Eén mislukte aanroep mag de
  // rest niet meeslepen: als alleen de entiteiten mislukken kan de apparatenlijst
  // al filteren, en andersom. En wat er misgaat, zetten we op de statusregel —
  // een stille toggle die "alles" toont is niet te onderscheiden van een
  // kapotte.
  const vraag = async (cmd, ms) => {
    try { return await metTijdslimiet(ha.stuur(cmd), ms); }
    catch (e) { fouten.push(`${cmd} → ${(e && e.message) || e}`); return null; }
  };
  try {
    ha = await metTijdslimiet(haVerbind(inst.url, inst.token), 15000);
    const floors = await vraag("config/floor_registry/list", 20000);
    const areas = await vraag("config/area_registry/list", 20000);
    if (!floors || !areas) {
      kaart.status = "onbereikbaar";
    } else {
      const areaFloor = {};        // area_id -> floor_id
      for (const a of areas) areaFloor[a.area_id] = a.floor_id || "";
      const gebiedNaam = {};       // gebiedsnaam -> floor_id, voor de zonekiezer
      for (const a of areas) if (a.floor_id) gebiedNaam[a.name] = a.floor_id;
      kaart.gebied = gebiedNaam;
      kaart.gebiedLijst = areas.map(a => ({ id: a.area_id, naam: a.name, floor: a.floor_id || "" }));
      const dev = await vraag("config/device_registry/list", 30000);
      const ent = await vraag("config/entity_registry/list", 30000);
      if (dev) {
        kaart.apparaat = {};
        for (const d of dev) kaart.apparaat[d.id] = areaFloor[d.area_id] || "";
      }
      if (ent) {
        const devMap = kaart.apparaat || {};
        kaart.entiteit = {};
        // Het gebied van de entiteit zelf, en anders dat van het apparaat eronder.
        for (const e of ent) {
          kaart.entiteit[e.entity_id] = areaFloor[e.area_id] ||
            (e.device_id ? devMap[e.device_id] || "" : "");
        }
      }
      if (!dev && !ent) kaart.status = "onbereikbaar";
    }
  } catch (e) {
    kaart.status = "onbereikbaar";
    fouten.push((e && e.message) || String(e));
  } finally {
    if (ha) ha.dicht();
  }

  STAAT.vloeren = kaart;
  // Nu pas is echt bekend welke zones bij dit verdiep horen: keuzelijst, lijst en
  // tekening opnieuw. Zonder dit bleef het beeld van vóór de gebieden staan — met
  // de zonekaders van een andere verdieping er nog in. Alleen als het écht gelukt
  // is, anders zou een mislukte poging zichzelf blijven herhalen.
  if (kaart.gebied) {
    bouwZonekiezer();
    tekenZoeklijst();
  }
  tekenAlles();
  const nEnt = kaart.entiteit ? Object.values(kaart.entiteit).filter(Boolean).length : 0;
  const nApp = kaart.apparaat ? Object.values(kaart.apparaat).filter(Boolean).length : 0;
  const tekst = fouten.length
    ? `Verdiepdata: niet volledig geladen — ${fouten[0]}`
    : `Verdiepdata geladen: ${nEnt} entiteiten en ${nApp} apparaten met een gebied (via ${inst.url}).`;
  zeg(tekst);
  vak.title = tekst + " Zonder gebied, of op een ander verdiep, blijft het verborgen.";
  return STAAT.vloeren;
}

/* De zones die op het geopende verdiep horen. Twee bronnen: de bekende kamers
   die bij een gebied van dit verdiep passen, en de gebieden die Home Assistant
   zelf aan dit verdiep heeft gehangen — dáár komen nieuwe kamers vandaan (als
   gebied, mét verdiep); de editor maakt ze niet zelf. Zonder koppeling, of als
   de gegevens er nog niet zijn, geeft dit de volledige lijst: dan is er niets
   om eerlijk op te filteren. */
function zonesVanVerdiep() {
  const gekoppeld = verdiepInstelling(STAAT.view).floor || "";
  const vloer = STAAT.vloeren;
  if (!gekoppeld || !vloer || !vloer.gebied) return ZONES.slice();
  const areaNaarZone = {};
  for (const [zid, area] of Object.entries(STAAT.zoneArea)) areaNaarZone[area] = zid;
  const uit = [];
  for (const z of ZONES) {
    const area = STAAT.zoneArea[z.id];
    if (area && vloer.gebied[area] === gekoppeld) uit.push(z);
  }
  for (const a of (vloer.gebiedLijst || [])) {
    if (a.floor !== gekoppeld) continue;
    if (areaNaarZone[a.naam]) continue;     // al als bestaande zone bekend
    uit.push({ id: a.id, naam: a.naam });
  }
  return uit;
}

/* De regel onder de vinkjes: altijd de werkelijke stand, zodat "de lijst toont
   alles" nooit meer dubbelzinnig is. Alleen wanneer de loader zelf de reden
   kent (geen instellingen, iets mislukt) laten we diens tekst staan. */
function statusRegelVernieuw(gekoppeld) {
  const regel = el("verdiep-status");
  if (!regel) return;
  if (!gekoppeld) {
    regel.textContent =
      "Dit verdiep is nog niet gekoppeld — zet de koppeling in het ⚙-venster achter 'verdiep'.";
    return;
  }
  const vloer = STAAT.vloeren;
  if (!vloer) { regel.textContent = "Verdiepdata ophalen…"; return; }
  if (vloer.status !== "klaar") return;          // de loader heeft het al gezegd
  const nEnt = vloer.entiteit ? Object.values(vloer.entiteit).filter(Boolean).length : 0;
  const nApp = vloer.apparaat ? Object.values(vloer.apparaat).filter(Boolean).length : 0;
  regel.textContent = `Verdiepdata geladen: ${nEnt} entiteiten en ${nApp} apparaten met een gebied.`;
}

/* De verdiepdata ophalen als ze er nog niet zijn, en daarna béide lijsten
   opnieuw tekenen: de zonekiezer linksboven en de entiteitenlijst links.
   Eén plek voor die taak, zodat ze dezelfde lading delen en er nooit twee
   tegelijk gaan lopen. */
function verdiepDataOphalen() {
  if (STAAT.vloeren || STAAT.vloerenBelofte) return;      // al geladen of bezig
  STAAT.vloerenBelofte = verdiepKaartOphalen().then(() => {
    STAAT.vloerenBelofte = null;
    bouwZonekiezer();
    tekenZoeklijst();
  });
}

function tekenZoeklijst() {
  const zoek = el("zoek-entiteit").value.trim().toLowerCase();
  const keuze = el("lijst-entiteiten");
  const ongebruikt = el("toon-ongebruikt").checked;
  const opVerdiep = el("toon-verdiep").checked;
  // De koppeling die u zelf in het ⚙-venster van dit verdiep heeft neergezet:
  // een floor_id uit Home Assistant, geen gegok bij de titel van het tabblad.
  const gekoppeld = verdiepInstelling(STAAT.view).floor || "";
  statusRegelVernieuw(gekoppeld);
  // Nog niet opgehaald: eerst de registries halen en dan opnieuw tekenen —
  // niet intussen de lijst leegmaken, want dat zou eruitzien als "er is niets".
  if (opVerdiep && gekoppeld && !STAAT.vloeren) {
    verdiepDataOphalen();
    return;
  }
  const kaart = kaartEntiteiten();
  const apparaten = STAAT.toev === "apparaten";
  // Alleen filteren als dít deel van de gegevens er ook is: als alleen de
  // entiteitenaanroep mislukt kan de apparatenlijst al wél filteren, en
  // andersom. Liever één lijst die klopt dan allebei stilvol.
  const vloerData = STAAT.vloeren;
  const filterVloer = opVerdiep && gekoppeld && vloerData && vloerData.status === "klaar" &&
    STAAT.toev !== "persons" && (apparaten ? vloerData.apparaat : vloerData.entiteit);
  let treffers = [];

  // De voorwerpen zijn geen entiteiten: geen apparaat, geen verdiep, geen waarde.
  // Ze komen uit voorwerpen.json, en ze staan per kamer gegroepeerd.
  if (STAAT.toev === "voorwerpen") {
    const stijl = voorwerpStijl();
    keuze.innerHTML = "";
    let aantal = 0;
    for (const groep of (STAAT.voorwerpen && STAAT.voorwerpen.groepen) || []) {
      const erin = groep.voorwerpen
        .filter(v => (v.stijlen || []).includes(stijl))
        .filter(v => !zoek || v.naam.toLowerCase().includes(zoek));
      if (!erin.length) continue;
      const blok = document.createElement("optgroup");
      blok.label = groep.naam;
      for (const v of erin) {
        const o = document.createElement("option");
        o.value = v.id;
        o.textContent = v.naam;
        blok.appendChild(o);
        aantal++;
      }
      keuze.appendChild(blok);
    }
    if (!aantal) {
      const o = document.createElement("option");
      o.value = "";
      o.textContent = STAAT.voorwerpen
        ? "niets gevonden" : "de voorwerpenlijst kon niet geladen worden";
      keuze.appendChild(o);
    }
    keuze.selectedIndex = 0;
    keuze.onchange = () => kiesUitLijst();
    kiesUitLijst();
    return;
  }

  if (apparaten) {
    treffers = (STAAT.apparaten || [])
      .filter(a => !(ongebruikt && a.entities.some(x => kaart.has(x))))
      .filter(a => !filterVloer || (STAAT.vloeren.apparaat[a.id] || "") === gekoppeld)
      .filter(a => !zoek || a.zoek.includes(zoek))
      .sort((a, b) =>
        // Een apparaat-id dat er precies in staat komt bovenaan: als u een id
        // plakt wilt u dat ene apparaat, niet de langste lijst ernaast.
        (b.id.includes(zoek) ? 1 : 0) - (a.id.includes(zoek) ? 1 : 0) ||
        a.naam.localeCompare(b.naam));
  } else {
    treffers = lijstVoorModus(STAAT.toev)
      .filter(e => !(ongebruikt && kaart.has(e.id)))
      .filter(e => !filterVloer || (STAAT.vloeren.entiteit[e.id] || "") === gekoppeld)
      .filter(e => !zoek || e.id.toLowerCase().includes(zoek) || e.naam.toLowerCase().includes(zoek))
      .sort((a, b) => {
        const ah = STAAT.herkend.has(a.id) ? 0 : 1;
        const bh = STAAT.herkend.has(b.id) ? 0 : 1;
        return ah - bh || a.id.localeCompare(b.id);
      });
  }

  const zichtbaar = treffers.slice(0, 300);
  keuze.innerHTML = "";
  for (const x of zichtbaar) {
    const o = document.createElement("option");
    if (apparaten) {
      const op = x.entities.some(e => kaart.has(e));
