const beknop = (r) => `${r.type} · ${r.naam}`;
const afkappen = (regels, max) =>
  regels.length <= max ? regels : regels.slice(0, max).concat(`… en nog ${regels.length - max} meer`);

el("knop-schrijf").onclick = async () => {
  const knop = el("knop-schrijf");
  // Hooguit drie rondes. Bij een verbindingsfout krijgt u het instellingenvenster
  // met het adres erin, in plaats van een melding die niets zegt over wát er mis
  // is — bijna altijd een verkeerde poort of protocol.
  for (let poging = 0; poging < 3; poging++) {
    let inst = haInstelling();
    if (!inst.url || !inst.token) {
      inst = await vraagInstelling(inst);
      if (!inst) { meld("Niet weggeschreven — geen instellingen ingevuld."); return; }
    }

    knop.disabled = true;
    let ha = null;
    try {
      meld(`Live dashboard "${inst.pad}" ophalen…`);
      // Ook hier een tijdslimiet: zonder die hing de knop eindeloos op
      // "ophalen…" als het adres niet bereikbaar was, in plaats van het
      // instellingenvenster te openen.
      ha = await metTijdslimiet(haVerbind(inst.url, inst.token), 8000);
      const huidig = await metTijdslimiet(
        ha.stuur("lovelace/config", { url_path: inst.pad }), 8000);
      const liveCfg = huidig && huidig.config ? huidig.config : huidig;
      const nieuw = exportDoc();
      const d = verschilDashboards(liveCfg, nieuw);
      const zelfde = nietsTeMelden(d);

      const bevestigd = await vraagVenster({
        kop: zelfde ? "Niets te veranderen — toch overschrijven?" :
                      `Wat verandert er in "${inst.pad}"?`,
        uitleg: zelfde
          ? "Uw versie is inhoudelijk gelijk aan wat er nu staat. Overschrijven verandert dan niets, maar het is ook niet nodig."
          : "Per element en per eigenschap, vergeleken met wat er nu in Home " +
            "Assistant staat. Er wordt pas geschreven als u hieronder bevestigt.",
        lijsten: verschilLijsten(d),
        links: `live ${d.live} elementen → nieuw ${d.nieuw} elementen` +
               (zelfde ? "" :
                 ` · ${d.gewijzigd.length} gewijzigd · ${d.weg.length} weg · ${d.bij.length} nieuw`),
        okTekst: "Ja, wegschrijven",
        cancelTekst: "Terug",
      });
      if (!bevestigd) { meld("Niet weggeschreven — niets veranderd."); return; }

      await ha.stuur("lovelace/config/save", { url_path: inst.pad, config: nieuw });

      const terug = await ha.stuur("lovelace/config", { url_path: inst.pad });
      const opgeslagen = terug && terug.config ? terug.config : terug;
      const gelijk = JSON.stringify(opgeslagen) === JSON.stringify(nieuw);
      meld(
        `Opgeslagen in "${inst.pad}": ${exportRijen(opgeslagen).length} elementen. ` +
        (gelijk
          ? "Teruggelezen en exact gelijk aan wat u zag."
          : "Teruggelezen, maar het wijkt af van wat is verstuurd — bekijk het dashboard."),
        gelijk ? "serieus" : "fout"
      );
      return;
    } catch (e) {
      const fout = "Wegschrijven mislukt: " + (e && e.message ? e.message : e);
      if (isInstellingsfout(e)) {
        const opnieuw = await vraagInstelling(haInstelling(), foutUitleg(fout));
        if (opnieuw) continue;
      }
      meld(fout, "fout");
      return;
    } finally {
      if (ha) ha.dicht();
      knop.disabled = false;
    }
  }
  meld("Wegschrijven afgebroken: drie keer geen verbinding met Home Assistant.", "fout");
};

el("werkgebied").addEventListener("wheel", ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  const werk = el("werkgebied");
  zoomStap(ev.deltaY < 0 ? 1 : -1, { clientX: ev.clientX, clientY: ev.clientY });
}, { passive: false });

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") return;
  // Gereedschap wisselen en de selectie weghalen werken altijd.
  const toets = ev.key.toLowerCase();
  if (toets === "h" || toets === "s") { ev.preventDefault(); greepZet(toets === "s" ? "select" : "pan"); return; }
  if (ev.key === "Escape") {
    selecteer(null);
    toonPositie(null);
    // En het geselecteerde zonekader loslaten — anders blijven de hoekpunten
    // ergens hangen op een kamer waar u allang vanaf bent.
    if (STAAT.zoneBewerkt) { STAAT.zoneBewerkt = null; tekenZoneLagen(); }
    return;
  }
  // Pijltjestoetsen verplaatsen de hele selectie, dus daar is een element nodig.
  const e = STAAT.geselecteerd;
  if (!e) return;
  // Delete en Backspace doen hetzelfde als de knop [Verwijderen] in de inspectie.
  if (ev.key === "Delete" || ev.key === "Backspace") {
    ev.preventDefault();
    verwijderGeselecteerd();
    return;
  }
  const stap = ev.shiftKey ? 2 : 0.5;
  const kaart = {
    ArrowLeft: [-stap, 0], ArrowRight: [stap, 0],
    ArrowUp: [0, -stap], ArrowDown: [0, stap],
  }[ev.key];
  if (!kaart) return;
  ev.preventDefault();
  verplaatsMetPijl(e, kaart[0], kaart[1]);
});

/* Het venster smaller of breder maken verandert de betekenis van `vw`, dus dan
   moet alles opnieuw. */

window.addEventListener("resize", () => {
  clearTimeout(hertekentimer);
  hertekentimer = setTimeout(() => { pasVlakAan(); tekenAlles(); paneelPlekKlem(); }, 150);
});

laad().then(() => { tekenZoeklijst(); zonesUitHA(); verdiepUitHA(); haalOntbrekendeIconen(); })
  .catch(err => {
    // Ook bij een fout mag het vlak niet op 0×0 blijven staan: een leeg canvas
    // zonder maat is onleesbaar, en dan weet niemand waar het misgaat.
    pasVlakAan();
    meld("Laden mislukt: " + err, "fout");
    console.error(err);
  });
</script>
